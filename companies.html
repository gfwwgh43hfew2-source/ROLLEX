<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>إدارة الشركات - QuickData ProSoft</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800;900&display=swap" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-client.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background: #f4f6f8;
            direction: rtl;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* ============================================================
           شاشة إدخال كلمة المرور
           ============================================================ */
        #loginScreen {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }

        #loginScreen .box {
            background: #fff;
            padding: 40px;
            border-radius: 16px;
            max-width: 400px;
            width: 90%;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        #loginScreen .box h2 {
            font-size: 1.4rem;
            font-weight: 800;
            color: #1a2332;
            margin-bottom: 8px;
        }

        #loginScreen .box p {
            color: #888;
            font-size: 0.85rem;
            margin-bottom: 20px;
        }

        #loginScreen .box input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
            font-family: inherit;
            outline: none;
            transition: 0.3s;
            margin-bottom: 14px;
            text-align: center;
        }

        #loginScreen .box input:focus {
            border-color: #c9a84c;
        }

        #loginScreen .box .btn-submit {
            width: 100%;
            padding: 12px;
            background: #c9a84c;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.3s;
        }

        #loginScreen .box .btn-submit:hover {
            background: #b8942a;
        }

        #loginScreen .box .error {
            color: #e74c3c;
            font-size: 0.85rem;
            margin-top: 10px;
            display: none;
        }

        #loginScreen .box .error.show {
            display: block;
        }

        /* ============================================================
           المحتوى الفعلي للصفحة
           ============================================================ */
        #mainContent {
            display: none;
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
        }

        #mainContent .header {
            background: #fff;
            padding: 16px 24px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        #mainContent .header h1 {
            font-size: 1.5rem;
            font-weight: 800;
            color: #1a2332;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        #mainContent .header h1 i {
            color: #c9a84c;
        }

        #mainContent .header .back-btn {
            padding: 8px 20px;
            border: 1px solid #ddd;
            border-radius: 8px;
            background: #fff;
            color: #555;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.85rem;
            transition: 0.3s;
        }

        #mainContent .header .back-btn:hover {
            background: #f5f5f5;
        }

        /* Stats */
        #mainContent .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 14px;
            margin-bottom: 20px;
        }

        #mainContent .stat-card {
            background: #fff;
            padding: 16px 20px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            border: 1px solid #eee;
        }

        #mainContent .stat-card .label {
            font-size: 0.7rem;
            color: #888;
            font-weight: 600;
            text-transform: uppercase;
        }

        #mainContent .stat-card .value {
            font-size: 1.5rem;
            font-weight: 800;
            color: #1a2332;
            margin-top: 2px;
        }

        #mainContent .stat-card .value.gold {
            color: #c9a84c;
        }

        #mainContent .stat-card .value.green {
            color: #27ae60;
        }

        #mainContent .stat-card .value.red {
            color: #e74c3c;
        }

        /* Table */
        #mainContent .table-wrapper {
            background: #fff;
            border-radius: 12px;
            padding: 4px 0;
            border: 1px solid #eee;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            overflow-x: auto;
        }

        #mainContent table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.8rem;
            min-width: 900px;
        }

        #mainContent th {
            background: #f8f9fa;
            padding: 12px 16px;
            text-align: right;
            font-weight: 700;
            color: #555;
            font-size: 0.7rem;
            text-transform: uppercase;
            border-bottom: 2px solid #e9ecef;
        }

        #mainContent td {
            padding: 10px 16px;
            border-bottom: 1px solid #f1f1f1;
            color: #333;
        }

        #mainContent tr:last-child td {
            border-bottom: none;
        }

        #mainContent .badge {
            display: inline-block;
            padding: 3px 12px;
            border-radius: 50px;
            font-size: 0.65rem;
            font-weight: 700;
        }

        #mainContent .badge.trial {
            background: #fef3c7;
            color: #b7791f;
        }

        #mainContent .badge.active {
            background: #d1fae5;
            color: #065f46;
        }

        #mainContent .badge.expired {
            background: #fee2e2;
            color: #991b1b;
        }

        #mainContent .btn-sm {
            padding: 4px 14px;
            border: none;
            border-radius: 6px;
            font-weight: 700;
            font-size: 0.7rem;
            cursor: pointer;
            font-family: inherit;
            transition: 0.2s;
        }

        #mainContent .btn-sm:hover {
            transform: translateY(-1px);
        }

        #mainContent .btn-sm.gold {
            background: #c9a84c;
            color: #fff;
        }

        #mainContent .btn-sm.gold:hover {
            background: #b8942a;
        }

        #mainContent .btn-sm.outline {
            background: transparent;
            border: 1px solid #ddd;
            color: #555;
        }

        #mainContent .btn-sm.outline:hover {
            background: #f5f5f5;
        }

        #mainContent .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(4px);
            z-index: 9999;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        #mainContent .modal-overlay.active {
            display: flex;
        }

        #mainContent .modal-box {
            background: #fff;
            border-radius: 16px;
            max-width: 480px;
            width: 100%;
            padding: 28px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
        }

        #mainContent .modal-box h3 {
            font-size: 1.1rem;
            font-weight: 800;
            margin-bottom: 16px;
        }

        #mainContent .modal-box .form-group {
            margin-bottom: 14px;
        }

        #mainContent .modal-box .form-group label {
            display: block;
            font-weight: 700;
            font-size: 0.75rem;
            color: #555;
            margin-bottom: 4px;
        }

        #mainContent .modal-box .form-group select,
        #mainContent .modal-box .form-group input {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-family: inherit;
            font-size: 0.9rem;
        }

        #mainContent .modal-box .form-actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        #mainContent .modal-box .form-actions .btn-save {
            padding: 10px 24px;
            background: #c9a84c;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.85rem;
            cursor: pointer;
        }

        #mainContent .modal-box .form-actions .btn-save:hover {
            background: #b8942a;
        }

        #mainContent .modal-box .form-actions .btn-cancel {
            padding: 10px 24px;
            background: transparent;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
        }

        #mainContent .modal-box .form-actions .btn-cancel:hover {
            background: #f5f5f5;
        }

        #mainContent .empty-state {
            text-align: center;
            padding: 40px;
            color: #888;
        }

        #mainContent .loading-state {
            text-align: center;
            padding: 40px;
            color: #c9a84c;
        }

        #mainContent .loading-state i {
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* Toast */
        .toast-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 99999;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .toast {
            background: #fff;
            padding: 14px 20px;
            border-radius: 12px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.1);
            border-right: 4px solid #c9a84c;
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 300px;
            animation: slideIn 0.3s ease;
        }

        .toast.success {
            border-right-color: #27ae60;
        }

        .toast.error {
            border-right-color: #e74c3c;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }
    </style>
</head>
<body>

    <!-- ============================================================
    شاشة إدخال كلمة المرور
    ============================================================ -->
    <div id="loginScreen">
        <div class="box">
            <h2><i class="fas fa-lock"></i> حماية الصفحة</h2>
            <p>أدخل كلمة المرور للوصول إلى إدارة الشركات</p>
            <input type="password" id="passwordInput" placeholder="كلمة المرور" autocomplete="off" />
            <button class="btn-submit" onclick="checkPassword()">
                <i class="fas fa-arrow-left"></i> دخول
            </button>
            <div class="error" id="errorMsg">❌ كلمة المرور غير صحيحة</div>
        </div>
    </div>

    <!-- ============================================================
    المحتوى الرئيسي
    ============================================================ -->
    <div id="mainContent">

        <div class="container">

            <!-- Header -->
            <div class="header">
                <h1><i class="fas fa-building"></i> إدارة الشركات</h1>
                <a href="index.html" class="back-btn"><i class="fas fa-arrow-right"></i> العودة</a>
            </div>

            <!-- Stats -->
            <div class="stats" id="statsContainer">
                <div class="stat-card">
                    <div class="label">إجمالي الشركات</div>
                    <div class="value" id="totalCompanies">0</div>
                </div>
                <div class="stat-card">
                    <div class="label">نشطة (مدفوعة)</div>
                    <div class="value green" id="activeCompanies">0</div>
                </div>
                <div class="stat-card">
                    <div class="label">تجريبية</div>
                    <div class="value gold" id="trialCompanies">0</div>
                </div>
                <div class="stat-card">
                    <div class="label">منتهية</div>
                    <div class="value red" id="expiredCompanies">0</div>
                </div>
            </div>

            <!-- Table -->
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>اسم الشركة</th>
                            <th>تاريخ التسجيل</th>
                            <th>تاريخ انتهاء التجربة</th>
                            <th>تاريخ انتهاء الاشتراك</th>
                            <th>الحالة</th>
                            <th>إجراءات</th>
                        </tr>
                    </thead>
                    <tbody id="companiesBody">
                        <tr><td colspan="6"><div class="loading-state"><i class="fas fa-spinner"></i> جاري التحميل...</div></td></tr>
                    </tbody>
                </table>
            </div>

        </div>

        <!-- Modal -->
        <div class="modal-overlay" id="subscriptionModal">
            <div class="modal-box">
                <h3><i class="fas fa-credit-card"></i> تمديد الاشتراك</h3>
                <form id="subscriptionForm">
                    <input type="hidden" id="modalCompanyId" />
                    <div class="form-group">
                        <label>مدة التمديد</label>
                        <select id="modalDuration">
                            <option value="30">شهر واحد (30 يوم)</option>
                            <option value="90">3 أشهر (90 يوم)</option>
                            <option value="180">6 أشهر (180 يوم)</option>
                            <option value="365">سنة (365 يوم)</option>
                        </select>
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="btn-save"><i class="fas fa-check"></i> تمديد الاشتراك</button>
                        <button type="button" class="btn-cancel" onclick="closeModal()">إلغاء</button>
                    </div>
                </form>
            </div>
        </div>

    </div>

    <!-- Toast -->
    <div class="toast-container" id="toastContainer"></div>

    <script>
        // ============================================================
        // Toast
        // ============================================================
        function showToast(title, message, type) {
            var container = document.getElementById('toastContainer');
            var toast = document.createElement('div');
            toast.className = 'toast ' + (type || '');
            toast.innerHTML = `<i class="fas ${type === 'success' ? 'fa-check-circle' : 'fa-exclamation-circle'}"></i> <div><strong>${title}</strong><br><span style="color:#777;font-size:0.8rem;">${message}</span></div>`;
            container.appendChild(toast);
            setTimeout(() => { toast.style.opacity = '0'; setTimeout(() => toast.remove(), 300); }, 3000);
        }

        // ============================================================
        // دالة التحقق من كلمة المرور
        // ============================================================
        var passwordAttempts = 0;
        var isUnlocked = false;

        async function checkPassword() {
            var input = document.getElementById('passwordInput').value.trim();
            var errorMsg = document.getElementById('errorMsg');

            if (!input) {
                errorMsg.textContent = '❌ يرجى إدخال كلمة المرور';
                errorMsg.classList.add('show');
                return;
            }

            try {
                // جلب الباسوورد من قاعدة البيانات
                var token = getToken();
                if (!token) {
                    window.location.href = 'login.html';
                    return;
                }

                var response = await fetch(SUPABASE_URL + '/rest/v1/admin_settings?select=value&key=eq.companies_password', {
                    headers: {
                        'apikey': SUPABASE_ANON_KEY,
                        'Authorization': 'Bearer ' + token
                    }
                });

                if (!response.ok) {
                    errorMsg.textContent = '❌ خطأ في الاتصال بقاعدة البيانات';
                    errorMsg.classList.add('show');
                    return;
                }

                var data = await response.json();
                if (!data || data.length === 0) {
                    errorMsg.textContent = '❌ كلمة المرور غير موجودة في النظام';
                    errorMsg.classList.add('show');
                    return;
                }

                var storedPassword = data[0].value;

                // مقارنة الباسوورد
                if (input === storedPassword) {
                    isUnlocked = true;
                    document.getElementById('loginScreen').style.display = 'none';
                    document.getElementById('mainContent').style.display = 'block';
                    loadCompanies();
                } else {
                    passwordAttempts++;
                    errorMsg.textContent = '❌ كلمة المرور غير صحيحة (محاولة ' + passwordAttempts + ')';
                    errorMsg.classList.add('show');
                    document.getElementById('passwordInput').value = '';
                    document.getElementById('passwordInput').focus();
                }

            } catch (error) {
                console.error('❌ خطأ:', error);
                errorMsg.textContent = '❌ حدث خطأ غير متوقع';
                errorMsg.classList.add('show');
            }
        }

        // ============================================================
        // إدخال الباسوورد بالضغط على Enter
        // ============================================================
        document.getElementById('passwordInput').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                checkPassword();
            }
        });

        // ============================================================
        // دالة تحميل الشركات
        // ============================================================
        async function loadCompanies() {
            var token = getToken();
            if (!token) {
                window.location.href = 'login.html';
                return;
            }

            try {
                var response = await fetch(SUPABASE_URL + '/rest/v1/companies?select=*', {
                    headers: {
                        'apikey': SUPABASE_ANON_KEY,
                        'Authorization': 'Bearer ' + token
                    }
                });

                if (!response.ok) {
                    document.getElementById('companiesBody').innerHTML = '<tr><td colspan="6"><div class="empty-state">حدث خطأ في تحميل البيانات</div></td></tr>';
                    return;
                }

                var companies = await response.json();

                // Stats
                var total = companies.length;
                var active = 0, trial = 0, expired = 0;

                companies.forEach(function(c) {
                    var status = c.subscription_status || 'trial';
                    if (status === 'active') active++;
                    else if (status === 'trial') trial++;
                    else if (status === 'expired') expired++;
                });

                document.getElementById('totalCompanies').textContent = total;
                document.getElementById('activeCompanies').textContent = active;
                document.getElementById('trialCompanies').textContent = trial;
                document.getElementById('expiredCompanies').textContent = expired;

                // Table
                var html = '';
                companies.forEach(function(c) {
                    var status = c.subscription_status || 'trial';
                    var badgeClass = status === 'active' ? 'active' : (status === 'trial' ? 'trial' : 'expired');
                    var badgeLabel = status === 'active' ? 'نشط' : (status === 'trial' ? 'تجريبي' : 'منتهي');

                    html += `<tr>
                        <td><strong>${c.name}</strong></td>
                        <td>${new Date(c.created_at).toLocaleDateString('ar-EG')}</td>
                        <td>${c.trial_end_date ? new Date(c.trial_end_date).toLocaleDateString('ar-EG') : '-'}</td>
                        <td>${c.subscription_end_date ? new Date(c.subscription_end_date).toLocaleDateString('ar-EG') : '-'}</td>
                        <td><span class="badge ${badgeClass}">${badgeLabel}</span></td>
                        <td>
                            <button class="btn-sm gold" onclick="openModal('${c.id}')"><i class="fas fa-plus"></i> تمديد</button>
                            <button class="btn-sm outline" onclick="setStatus('${c.id}', 'active')">تفعيل</button>
                            <button class="btn-sm outline" onclick="setStatus('${c.id}', 'expired')">إنهاء</button>
                        </td>
                    </tr>`;
                });

                document.getElementById('companiesBody').innerHTML = html || '<tr><td colspan="6"><div class="empty-state">لا توجد شركات</div></td></tr>';

            } catch (error) {
                console.error('❌ خطأ:', error);
                document.getElementById('companiesBody').innerHTML = '<tr><td colspan="6"><div class="empty-state">حدث خطأ في تحميل البيانات</div></td></tr>';
            }
        }

        // ============================================================
        // Modal
        // ============================================================
        function openModal(companyId) {
            document.getElementById('modalCompanyId').value = companyId;
            document.getElementById('subscriptionModal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('subscriptionModal').classList.remove('active');
        }

        document.getElementById('subscriptionForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            var companyId = document.getElementById('modalCompanyId').value;
            var duration = parseInt(document.getElementById('modalDuration').value);

            var token = getToken();
            var today = new Date();
            var newEndDate = new Date(today);
            newEndDate.setDate(newEndDate.getDate() + duration);

            var response = await fetch(SUPABASE_URL + '/rest/v1/companies?id=eq.' + companyId, {
                method: 'PATCH',
                headers: {
                    'apikey': SUPABASE_ANON_KEY,
                    'Authorization': 'Bearer ' + token,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    subscription_status: 'active',
                    subscription_end_date: newEndDate.toISOString().split('T')[0]
                })
            });

            if (response.ok) {
                showToast('✅ تم التمديد', 'تم تمديد الاشتراك بنجاح', 'success');
                closeModal();
                loadCompanies();
            } else {
                showToast('❌ خطأ', 'فشل تمديد الاشتراك', 'error');
            }
        });

        // ============================================================
        // Set Status
        // ============================================================
        async function setStatus(companyId, status) {
            var token = getToken();
            var response = await fetch(SUPABASE_URL + '/rest/v1/companies?id=eq.' + companyId, {
                method: 'PATCH',
                headers: {
                    'apikey': SUPABASE_ANON_KEY,
                    'Authorization': 'Bearer ' + token,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ subscription_status: status })
            });

            if (response.ok) {
                showToast('✅ تم التحديث', 'تم تغيير حالة الاشتراك', 'success');
                loadCompanies();
            } else {
                showToast('❌ خطأ', 'فشل تغيير الحالة', 'error');
            }
        }

        // ============================================================
        // إعدادات إضافية
        // ============================================================
        // عند تحميل الصفحة، نركز على حقل الباسوورد
        document.addEventListener('DOMContentLoaded', function() {
            document.getElementById('passwordInput').focus();
        });

        // عند الضغط على زر العودة، نعود للصفحة الرئيسية
        document.querySelector('.back-btn').addEventListener('click', function(e) {
            e.preventDefault();
            window.location.href = 'index.html';
        });

        console.log('🔐 صفحة إدارة الشركات محمية بكلمة مرور');
    </script>

</body>
</html>
