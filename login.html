<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>تسجيل الدخول - رولكس</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800&display=swap" rel="stylesheet" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Cairo', sans-serif;
            background: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            direction: rtl;
        }
        .login-box {
            background: white;
            padding: 40px 30px;
            border-radius: 16px;
            box-shadow: 0 8px 40px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        .login-box .logo {
            font-size: 2.5rem;
            margin-bottom: 8px;
        }
        .login-box h1 {
            font-size: 1.5rem;
            font-weight: 800;
            color: #1a2332;
        }
        .login-box p {
            color: #8a96a8;
            font-size: 0.85rem;
            margin-bottom: 24px;
        }
        .login-box input {
            width: 100%;
            padding: 12px 14px;
            margin-bottom: 12px;
            border: 1.5px solid #e8ecf1;
            border-radius: 8px;
            font-size: 0.9rem;
            font-family: 'Cairo', sans-serif;
            outline: none;
            transition: 0.3s;
            background: #f8f9fb;
        }
        .login-box input:focus {
            border-color: #c9a84c;
            background: white;
            box-shadow: 0 0 0 4px rgba(201,168,76,0.06);
        }
        .login-box .btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #c9a84c, #b8942a);
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            font-family: 'Cairo', sans-serif;
            margin-top: 6px;
        }
        .login-box .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 20px rgba(201,168,76,0.25);
        }
        .login-box .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        .login-box .error-msg {
            color: #dc3545;
            font-size: 0.8rem;
            margin-top: 10px;
            display: none;
        }
        .login-box .error-msg.show {
            display: block;
        }
        .login-box .footer-text {
            margin-top: 16px;
            font-size: 0.75rem;
            color: #8a96a8;
        }
        .login-box .footer-text a {
            color: #c9a84c;
            text-decoration: none;
            font-weight: 700;
        }
        .login-box .footer-text a:hover {
            text-decoration: underline;
        }
        .login-box .admin-msg {
            font-size: 0.7rem;
            color: #8a96a8;
            margin-top: 8px;
            display: none;
        }
        .login-box .admin-msg.show {
            display: block;
        }
    </style>
</head>
<body>

    <div class="login-box">
        <div class="logo">🏛️</div>
        <h1>رولكس</h1>
        <p>نظام إدارة الخزائن والفواتير</p>

        <form id="loginForm">
            <input type="email" id="email" placeholder="البريد الإلكتروني" required />
            <input type="password" id="password" placeholder="كلمة السر" required />
            <button type="submit" class="btn" id="loginBtn">🔓 تسجيل الدخول</button>
        </form>

        <div class="error-msg" id="errorMsg">❌ البريد الإلكتروني أو كلمة السر غير صحيحة</div>

        <div class="footer-text">
            ليس لديك حساب؟ <a href="register.html" id="registerLink">إنشاء حساب جديد</a>
        </div>
        <div class="admin-msg" id="adminMsg">⚠️ تم إنشاء حساب المدير بالفعل. التسجيل غير متاح.</div>
    </div>

    <script>
        // ===== إعدادات Supabase =====
        var SUPABASE_URL = 'https://ykkhkgajzyxsgoamtmnn.supabase.co';
        var SUPABASE_ANON_KEY = 'sb_publishable_NOH7uJlEoPf6wcT87DNBug_izzR-4VF';

        // ============================================================
        // التحقق من وجود مدير وإخفاء زر التسجيل
        // ============================================================
        async function checkAdminExists() {
            try {
                var response = await fetch(SUPABASE_URL + '/rest/v1/profiles?role=eq.admin&select=id', {
                    headers: {
                        'apikey': SUPABASE_ANON_KEY,
                        'Authorization': 'Bearer ' + SUPABASE_ANON_KEY
                    }
                });

                if (!response.ok) {
                    console.warn('⚠️ فشل في التحقق من وجود مدير');
                    return false;
                }

                var data = await response.json();
                var adminExists = data && data.length > 0;

                // إخفاء أو إظهار زر التسجيل
                var registerLink = document.getElementById('registerLink');
                var adminMsg = document.getElementById('adminMsg');

                if (registerLink) {
                    if (adminExists) {
                        registerLink.style.display = 'none';
                        adminMsg.classList.add('show');
                    } else {
                        registerLink.style.display = 'inline';
                        adminMsg.classList.remove('show');
                    }
                }

                return adminExists;
            } catch (error) {
                console.error('❌ خطأ في التحقق:', error);
                return false;
            }
        }

        // ============================================================
        // تسجيل الدخول
        // ============================================================
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            var email = document.getElementById('email').value;
            var password = document.getElementById('password').value;
            var btn = document.getElementById('loginBtn');
            var errorMsg = document.getElementById('errorMsg');

            btn.disabled = true;
            btn.innerHTML = '⏳ جاري تسجيل الدخول...';
            errorMsg.classList.remove('show');

            try {
                var response = await fetch(SUPABASE_URL + '/auth/v1/token?grant_type=password', {
                    method: 'POST',
                    headers: {
                        'apikey': SUPABASE_ANON_KEY,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        email: email,
                        password: password
                    })
                });

                var data = await response.json();

                if (response.ok) {
                    // حفظ Session
                    localStorage.setItem('rollex_session', JSON.stringify(data));

                    // التوجيه إلى لوحة التحكم
                    window.location.href = 'index.html';
                } else {
                    errorMsg.textContent = '❌ ' + (data.msg || data.message || 'البريد أو كلمة السر غير صحيحة');
                    errorMsg.classList.add('show');
                }
            } catch (error) {
                errorMsg.textContent = '❌ حدث خطأ في الاتصال بقاعدة البيانات';
                errorMsg.classList.add('show');
                console.error(error);
            }

            btn.disabled = false;
            btn.innerHTML = '🔓 تسجيل الدخول';
        });

        // ============================================================
        // تنفيذ عند تحميل الصفحة
        // ============================================================
        document.addEventListener('DOMContentLoaded', function() {
            checkAdminExists();
        });
    </script>

</body>
</html>
