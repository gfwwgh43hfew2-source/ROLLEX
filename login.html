<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5" />
    <title>تسجيل الدخول - QuickData ProSoft</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        /* ==========================================================
           RESET & BASE
           ========================================================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --gold: #f5a623;
            --gold-light: #ffc857;
            --gold-deep: #e08e0b;
            --navy-bg: #1b2431;
            --navy-bg-2: #141c27;
            --card: #212c3b;
            --field: #2a3646;
            --field-border: #37455a;
            --text-dim: rgba(255, 255, 255, 0.35);
            --text-mid: rgba(255, 255, 255, 0.55);
        }

        html { scroll-behavior: smooth; }

        body {
            font-family: 'Cairo', 'Segoe UI', Tahoma, Arial, sans-serif;
            direction: rtl;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            position: relative;
            background: radial-gradient(ellipse at 50% 40%, #232f40 0%, var(--navy-bg) 55%, var(--navy-bg-2) 100%);
            overflow: hidden;
        }

        /* ==========================================================
           الحلقة المتقطعة المزخرفة حول البطاقة
           ========================================================== */
        .ring-wrap {
            position: relative;
            width: 100%;
            max-width: 460px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .ring {
            position: absolute;
            inset: -70px;
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
        }

        .ring svg {
            width: 100%;
            height: 100%;
            animation: ringSpin 90s linear infinite;
        }

        @keyframes ringSpin {
            to { transform: rotate(360deg); }
        }

        .ring .tick {
            stroke: rgba(255, 255, 255, 0.14);
            stroke-width: 3;
            stroke-linecap: round;
        }

        .ring .tick.lit {
            stroke: var(--gold);
            filter: drop-shadow(0 0 5px rgba(245, 166, 35, 0.85));
        }

        @media (prefers-reduced-motion: reduce) {
            .ring svg { animation: none; }
        }

        /* ==========================================================
           البطاقة
           ========================================================== */
        .login-container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 360px;
            background: var(--card);
            border-radius: 22px;
            padding: 38px 30px 30px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 30px 70px rgba(0, 0, 0, 0.55);
            animation: fadeInUp 0.7s cubic-bezier(0.16, 1, 0.3, 1) both;
        }

        @keyframes fadeInUp {
            0% { opacity: 0; transform: translateY(30px) scale(0.97); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* ===== العنوان ===== */
        .title {
            text-align: center;
            font-size: 1.9rem;
            font-weight: 900;
            letter-spacing: 2px;
            color: var(--gold);
            text-shadow: 0 0 22px rgba(245, 166, 35, 0.35);
            margin-bottom: 28px;
        }

        /* ==========================================================
           حقول الإدخال
           ========================================================== */
        .form-group {
            margin-bottom: 16px;
        }

        .input-wrap {
            position: relative;
            border-radius: 12px;
            background: var(--field);
            border: 1px solid var(--field-border);
            transition: border-color 0.25s, box-shadow 0.25s;
        }

        .input-wrap:focus-within {
            border-color: var(--gold);
            box-shadow: 0 0 0 3px rgba(245, 166, 35, 0.12);
        }

        .input-wrap .input-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-dim);
            font-size: 0.85rem;
            z-index: 2;
        }

        .input-wrap:focus-within .input-icon { color: var(--gold); }

        .input-wrap input {
            width: 100%;
            padding: 14px 44px 14px 16px;
            border: none;
            background: transparent;
            color: #fff;
            font-size: 0.9rem;
            font-family: inherit;
            outline: none;
            text-align: right;
        }

        .input-wrap input::placeholder { color: var(--text-dim); font-weight: 400; }

        .input-wrap .input-icon.right {
            left: auto;
            right: 16px;
        }

        .toggle-pass {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--text-dim);
            cursor: pointer;
            font-size: 0.8rem;
            z-index: 3;
            padding: 4px;
        }
        .toggle-pass:hover { color: var(--gold); }

        .input-wrap.has-toggle input {
            padding: 14px 44px 14px 44px;
        }
        .input-wrap.has-toggle .input-icon.right { right: 16px; }
        .input-wrap.has-toggle .toggle-pass { left: 16px; }

        /* ===== نسيت كلمة المرور ===== */
        .forgot {
            text-align: left;
            margin-bottom: 22px;
        }
        .forgot a {
            color: var(--text-mid);
            font-size: 0.78rem;
            font-weight: 600;
            text-decoration: none;
        }
        .forgot a:hover { color: var(--gold); text-decoration: underline; }

        /* ==========================================================
           زر تسجيل الدخول
           ========================================================== */
        .btn-primary {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--gold-light), var(--gold), var(--gold-deep));
            color: #1b1204;
            border: none;
            border-radius: 12px;
            font-weight: 800;
            font-size: 0.95rem;
            letter-spacing: 1px;
            cursor: pointer;
            transition: transform 0.25s, box-shadow 0.25s;
            font-family: inherit;
            box-shadow: 0 10px 26px rgba(245, 166, 35, 0.28);
            position: relative;
            overflow: hidden;
        }

        .btn-primary::before {
            content: '';
            position: absolute; inset: 0;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.35), transparent 60%);
            transform: translateX(-100%);
            transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .btn-primary:hover::before { transform: translateX(100%); }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 16px 36px rgba(245, 166, 35, 0.36);
        }
        .btn-primary:active { transform: translateY(0) scale(0.98); }

        .btn-primary .ripple {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.5);
            transform: scale(0);
            animation: rippleAnim 0.6s ease-out;
            pointer-events: none;
        }
        @keyframes rippleAnim { to { transform: scale(3); opacity: 0; } }

        /* ===== التحميل ===== */
        .loading-spinner {
            display: none;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 12px;
        }
        .loading-spinner .dots { display: flex; gap: 5px; }
        .loading-spinner .dots span {
            width: 6px; height: 6px;
            border-radius: 50%;
            background: var(--gold);
            animation: dotBounce 1.2s ease-in-out infinite;
        }
        .loading-spinner .dots span:nth-child(2) { animation-delay: 0.15s; }
        .loading-spinner .dots span:nth-child(3) { animation-delay: 0.3s; }
        @keyframes dotBounce {
            0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
            30% { transform: translateY(-6px); opacity: 1; }
        }
        .loading-spinner span.label { color: var(--text-mid); font-size: 0.82rem; font-weight: 600; }

        /* ===== رسائل الحالة ===== */
        .message {
            text-align: center;
            padding: 12px 16px;
            border-radius: 12px;
            margin-top: 14px;
            font-size: 0.82rem;
            display: none;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-weight: 700;
        }
        .message.success {
            display: flex;
            background: rgba(43, 138, 62, 0.12);
            color: #66d17d;
            border: 1px solid rgba(43, 138, 62, 0.2);
        }
        .message.error {
            display: flex;
            background: rgba(201, 42, 42, 0.1);
            color: #ff6b6b;
            border: 1px solid rgba(201, 42, 42, 0.18);
            animation: shake 0.5s ease;
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-6px); }
            40% { transform: translateX(6px); }
            60% { transform: translateX(-4px); }
            80% { transform: translateX(4px); }
        }
        .checkmark { width: 16px; height: 16px; flex-shrink: 0; }
        .checkmark circle { stroke: #66d17d; stroke-width: 2; fill: none; }
        .checkmark path { stroke: #66d17d; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; fill: none; }

        /* ==========================================================
           تسجيل الدخول عبر
           ========================================================== */
        .social-label {
            text-align: center;
            font-size: 0.78rem;
            font-weight: 600;
            color: var(--text-dim);
            margin: 24px 0 14px;
        }

        .social-btns {
            display: flex;
            justify-content: center;
            gap: 14px;
            margin-bottom: 22px;
        }

        .social-btns button {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .social-btns button:hover { transform: translateY(-2px); }

        .social-btns .fb { background: #3b5998; box-shadow: 0 6px 16px rgba(59, 89, 152, 0.35); }
        .social-btns .x  { background: #14171a; box-shadow: 0 6px 16px rgba(0, 0, 0, 0.4); }
        .social-btns .gg { background: linear-gradient(135deg, #ea4335, #fbbc05); box-shadow: 0 6px 16px rgba(234, 67, 53, 0.32); }

        /* ==========================================================
           روابط أسفل البطاقة
           ========================================================== */
        .links {
            text-align: center;
            color: var(--text-dim);
            font-size: 0.8rem;
            font-weight: 600;
        }
        .links a {
            color: var(--gold);
            text-decoration: none;
            font-weight: 800;
        }
        .links a:hover { text-decoration: underline; color: var(--gold-light); }

        .copyright {
            text-align: center;
            margin-top: 20px;
            padding-top: 14px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            color: rgba(255, 255, 255, 0.16);
            font-size: 0.6rem;
            font-weight: 600;
            letter-spacing: 0.4px;
        }
        .copyright strong { color: rgba(245, 166, 35, 0.35); }

        /* ===== إمكانية الوصول ===== */
        a:focus-visible, button:focus-visible, input:focus-visible {
            outline: 2px solid var(--gold);
            outline-offset: 2px;
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 480px) {
            .ring { inset: -40px; }
            .login-container { padding: 30px 22px 24px; border-radius: 20px; }
            .title { font-size: 1.6rem; }
        }
    </style>
</head>
<body>

    <div class="ring-wrap" id="ringWrap">
        <div class="ring" id="ring"></div>

        <div class="login-container" id="loginCard">

            <div class="title">تسجيل الدخول</div>

            <form id="loginForm">

                <div class="form-group">
                    <div class="input-wrap">
                        <i class="fas fa-envelope input-icon right"></i>
                        <input type="email" id="email" name="email" placeholder="البريد الإلكتروني" required autocomplete="email" />
                    </div>
                </div>

                <div class="form-group">
                    <div class="input-wrap has-toggle">
                        <i class="fas fa-lock input-icon right"></i>
                        <input type="password" id="password" name="password" placeholder="كلمة المرور" required autocomplete="current-password" />
                        <button type="button" class="toggle-pass" id="togglePass" aria-label="إظهار كلمة المرور">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>

                <div class="forgot">
                    <a href="#">نسيت كلمة المرور؟</a>
                </div>

                <button type="submit" class="btn-primary" id="loginBtn">دخول</button>

                <div class="loading-spinner" id="loadingSpinner">
                    <div class="dots"><span></span><span></span><span></span></div>
                    <span class="label">جاري التحقق...</span>
                </div>

                <div id="message" class="message"></div>
            </form>

            <div class="social-label">تسجيل الدخول باستخدام</div>
            <div class="social-btns">
                <button class="fb" onclick="alert('جاري التوجيه إلى فيسبوك...')" aria-label="فيسبوك"><i class="fab fa-facebook-f"></i></button>
                <button class="x" onclick="alert('جاري التوجيه إلى X...')" aria-label="X"><i class="fab fa-x-twitter"></i></button>
                <button class="gg" onclick="alert('جاري التوجيه إلى جوجل...')" aria-label="جوجل"><i class="fab fa-google"></i></button>
            </div>

            <div class="links">
                ليس لديك حساب؟ <a href="register.html">إنشاء حساب</a>
            </div>

            <div class="copyright">
                © 2026 جميع الحقوق محفوظة لـ <strong>QuickData ProSoft</strong>
            </div>

        </div>
    </div>

    <script>
        /**
         * ============================================================
         * SUPABASE CONFIGURATION
         * ============================================================
         */
        var SUPABASE_URL = 'https://ykkhkgajzyxsgoamtmnn.supabase.co';
        var SUPABASE_ANON_KEY = 'sb_publishable_NOH7uJlEoPf6wcT87DNBug_izzR-4VF';

        /**
         * ============================================================
         * بناء الحلقة المتقطعة المزخرفة (SVG)
         * ============================================================
         */
        (function buildRing() {
            var ring = document.getElementById('ring');
            var size = 600;
            var cx = size / 2, cy = size / 2, r = size / 2 - 20;
            var total = 48;
            var litStart = 4, litEnd = 15; // القطاع المضيء بالذهبي (أعلى اليمين)
            var svgNS = 'http://www.w3.org/2000/svg';
            var svg = document.createElementNS(svgNS, 'svg');
            svg.setAttribute('viewBox', '0 0 ' + size + ' ' + size);

            for (var i = 0; i < total; i++) {
                var angle = (i / total) * 2 * Math.PI;
                var inner = r - 14;
                var outer = r;
                var x1 = cx + inner * Math.cos(angle);
                var y1 = cy + inner * Math.sin(angle);
                var x2 = cx + outer * Math.cos(angle);
                var y2 = cy + outer * Math.sin(angle);
                var line = document.createElementNS(svgNS, 'line');
                line.setAttribute('x1', x1); line.setAttribute('y1', y1);
                line.setAttribute('x2', x2); line.setAttribute('y2', y2);
                var lit = (i >= litStart && i <= litEnd);
                line.setAttribute('class', 'tick' + (lit ? ' lit' : ''));
                svg.appendChild(line);
            }
            ring.appendChild(svg);
        })();

        /**
         * ============================================================
         * إظهار / إخفاء كلمة المرور
         * ============================================================
         */
        var togglePass = document.getElementById('togglePass');
        var passwordInput = document.getElementById('password');
        togglePass.addEventListener('click', function() {
            var isPassword = passwordInput.type === 'password';
            passwordInput.type = isPassword ? 'text' : 'password';
            togglePass.innerHTML = isPassword ? '<i class="fas fa-eye-slash"></i>' : '<i class="fas fa-eye"></i>';
        });

        /**
         * ============================================================
         * تأثير التموّج عند النقر على الزر
         * ============================================================
         */
        var loginBtn = document.getElementById('loginBtn');
        loginBtn.addEventListener('click', function(e) {
            var rect = this.getBoundingClientRect();
            var ripple = document.createElement('span');
            var size = Math.max(rect.width, rect.height);
            ripple.className = 'ripple';
            ripple.style.width = ripple.style.height = size + 'px';
            ripple.style.left = (e.clientX - rect.left - size / 2) + 'px';
            ripple.style.top = (e.clientY - rect.top - size / 2) + 'px';
            this.appendChild(ripple);
            setTimeout(function() { ripple.remove(); }, 650);
        });

        /**
         * ============================================================
         * نموذج تسجيل الدخول - Supabase
         * ============================================================
         */
        var loginForm = document.getElementById('loginForm');
        var messageDiv = document.getElementById('message');
        var loadingSpinner = document.getElementById('loadingSpinner');

        loginForm.addEventListener('submit', async function(e) {
            e.preventDefault();

            var email = document.getElementById('email').value.trim();
            var password = passwordInput.value.trim();

            if (!email || !password) {
                showMessage('❌ الرجاء ملء جميع الحقول', 'error');
                return;
            }

            loginBtn.style.display = 'none';
            loadingSpinner.style.display = 'flex';
            hideMessage();

            try {
                var response = await fetch(SUPABASE_URL + '/auth/v1/token?grant_type=password', {
                    method: 'POST',
                    headers: {
                        'apikey': SUPABASE_ANON_KEY,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        email: email,
                        password: password
                    })
                });

                var data = await response.json();

                if (!response.ok) {
                    var errorMsg = data.msg || data.message || 'بيانات الدخول غير صحيحة';
                    throw new Error(errorMsg);
                }

                localStorage.setItem('rollex_session', JSON.stringify(data));
                showMessage('✅ تم تسجيل الدخول بنجاح! جاري التحويل...', 'success');

                setTimeout(function() {
                    window.location.href = 'index.html';
                }, 900);

            } catch (error) {
                console.error('❌ خطأ:', error);
                showMessage('❌ ' + error.message, 'error');
            }

            loginBtn.style.display = 'flex';
            loadingSpinner.style.display = 'none';
        });

        function showMessage(text, type) {
            var icon = type === 'success'
                ? '<svg class="checkmark" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M7 12.5l3 3 7-7"/></svg>'
                : '<i class="fas fa-circle-exclamation"></i>';
            messageDiv.innerHTML = icon + '<span>' + text + '</span>';
            messageDiv.className = 'message ' + type;
        }

        function hideMessage() {
            messageDiv.className = 'message';
            messageDiv.innerHTML = '';
        }

        console.log('🏢 QuickData ProSoft - نظام إدارة الشركات');
        console.log('🔗 Supabase URL:', SUPABASE_URL);
        console.log('✅ النظام جاهز للعمل');
    </script>

</body>
</html>
