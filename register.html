<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>إنشاء حساب - نظام إدارة الشركات</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <style>
        /* ============================================================
           RESET & BASE - تصميم احترافي نظيف وسريع
           ============================================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #0f1a2e;
            --primary-light: #1a2d4a;
            --gold: #d4a83a;
            --gold-light: #f0d080;
            --gold-dark: #b8922a;
            --white: #ffffff;
            --gray-50: #f8f9fb;
            --gray-100: #f0f2f5;
            --gray-200: #e8ecf1;
            --gray-300: #dce1e8;
            --gray-400: #b8c4d0;
            --gray-500: #8a96a8;
            --gray-600: #6b7a8d;
            --gray-700: #4a5a6e;
            --gray-800: #2c3a4f;
            --gray-900: #1a2332;
            --radius: 16px;
            --radius-sm: 10px;
            --shadow: 0 8px 40px rgba(0, 0, 0, 0.08);
            --shadow-hover: 0 12px 60px rgba(0, 0, 0, 0.12);
            --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            --font: 'Cairo', sans-serif;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: var(--font);
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: var(--gray-100);
            background-image: radial-gradient(ellipse at 30% 20%, rgba(212, 168, 58, 0.06) 0%, transparent 60%),
                radial-gradient(ellipse at 70% 80%, rgba(212, 168, 58, 0.04) 0%, transparent 50%);
            direction: rtl;
        }

        /* ============================================================
           الحاوية الرئيسية
           ============================================================ */
        .register-wrapper {
            width: 100%;
            max-width: 480px;
            animation: fadeIn 0.6s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }

        @keyframes fadeIn {
            0% {
                opacity: 0;
                transform: translateY(30px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ============================================================
           البطاقة
           ============================================================ */
        .register-container {
            background: var(--white);
            border-radius: var(--radius);
            padding: 40px 36px 32px;
            box-shadow: var(--shadow);
            transition: var(--transition);
            border: 1px solid var(--gray-200);
        }

        .register-container:hover {
            box-shadow: var(--shadow-hover);
        }

        /* ============================================================
           الشعار
           ============================================================ */
        .logo-section {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 28px;
        }

        .logo-icon {
            flex-shrink: 0;
            width: 52px;
            height: 52px;
            background: linear-gradient(135deg, var(--gold), var(--gold-dark));
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            font-weight: 900;
            color: var(--white);
            box-shadow: 0 4px 16px rgba(212, 168, 58, 0.25);
        }

        .logo-text h1 {
            font-size: 1.3rem;
            font-weight: 900;
            color: var(--gray-900);
            line-height: 1.2;
        }

        .logo-text .subtitle {
            color: var(--gray-500);
            font-size: 0.7rem;
            font-weight: 600;
            margin-top: 2px;
        }

        /* ============================================================
           حقول الإدخال
           ============================================================ */
        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: flex;
            align-items: center;
            gap: 6px;
            color: var(--gray-600);
            font-size: 0.7rem;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .form-group label i {
            color: var(--gold);
            font-size: 0.65rem;
        }

        .input-wrap {
            position: relative;
            border-radius: var(--radius-sm);
            border: 1.5px solid var(--gray-200);
            background: var(--gray-50);
            transition: var(--transition);
        }

        .input-wrap:focus-within {
            border-color: var(--gold);
            background: var(--white);
            box-shadow: 0 0 0 4px rgba(212, 168, 58, 0.06);
        }

        .input-wrap .input-icon {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--gray-400);
            font-size: 0.75rem;
            transition: var(--transition);
        }

        .input-wrap:focus-within .input-icon {
            color: var(--gold);
        }

        .input-wrap input {
            width: 100%;
            padding: 12px 38px 12px 12px;
            border: none;
            background: transparent;
            color: var(--gray-900);
            font-size: 0.85rem;
            font-family: var(--font);
            outline: none;
            border-radius: var(--radius-sm);
        }

        .input-wrap input::placeholder {
            color: var(--gray-400);
            font-weight: 400;
        }

        /* ============================================================
           زر إنشاء الحساب
           ============================================================ */
        .btn-primary {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--gold), var(--gold-dark));
            color: var(--white);
            border: none;
            border-radius: 50px;
            font-weight: 800;
            font-size: 0.95rem;
            cursor: pointer;
            transition: var(--transition);
            font-family: var(--font);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 4px 16px rgba(212, 168, 58, 0.2);
            margin-top: 6px;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(212, 168, 58, 0.3);
        }

        .btn-primary:active {
            transform: translateY(0) scale(0.98);
        }

        .btn-primary i {
            font-size: 0.9rem;
        }

        /* ============================================================
           زر التحميل
           ============================================================ */
        .loading-spinner {
            display: none;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 12px;
        }

        .loading-spinner .dots {
            display: flex;
            gap: 5px;
        }

        .loading-spinner .dots span {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--gold);
            animation: dotBounce 1.2s ease-in-out infinite;
        }

        .loading-spinner .dots span:nth-child(2) {
            animation-delay: 0.15s;
        }
        .loading-spinner .dots span:nth-child(3) {
            animation-delay: 0.3s;
        }

        @keyframes dotBounce {
            0%,
            60%,
            100% {
                transform: translateY(0);
                opacity: 0.4;
            }
            30% {
                transform: translateY(-6px);
                opacity: 1;
            }
        }

        .loading-spinner span.label {
            color: var(--gray-500);
            font-size: 0.8rem;
            font-weight: 600;
        }

        /* ============================================================
           رسائل الحالة
           ============================================================ */
        .message {
            text-align: center;
            padding: 10px 14px;
            border-radius: var(--radius-sm);
            margin-top: 14px;
            font-size: 0.8rem;
            display: none;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-weight: 700;
        }

        .message.success {
            display: flex;
            background: rgba(43, 138, 62, 0.06);
            color: #2b8a3e;
            border: 1px solid rgba(43, 138, 62, 0.08);
        }

        .message.error {
            display: flex;
            background: rgba(201, 42, 42, 0.06);
            color: #c92a2a;
            border: 1px solid rgba(201, 42, 42, 0.08);
        }

        /* ============================================================
           الروابط
           ============================================================ */
        .links {
            text-align: center;
            margin-top: 18px;
            color: var(--gray-500);
            font-size: 0.7rem;
            font-weight: 600;
        }

        .links a {
            color: var(--gold);
            text-decoration: none;
            font-weight: 700;
            transition: var(--transition);
        }

        .links a:hover {
            color: var(--gold-dark);
            text-decoration: underline;
        }

        /* ============================================================
           حقوق الملكية
           ============================================================ */
        .copyright {
            text-align: center;
            margin-top: 20px;
            padding-top: 16px;
            border-top: 1px solid var(--gray-200);
            color: var(--gray-400);
            font-size: 0.55rem;
            font-weight: 700;
        }

        .copyright strong {
            color: var(--gold);
        }

        .copyright .version {
            color: var(--gray-400);
            font-weight: 400;
        }

        /* ============================================================
           RESPONSIVE
           ============================================================ */
        @media (max-width: 480px) {
            .register-container {
                padding: 24px 18px 20px;
                border-radius: var(--radius-sm);
            }
            .logo-icon {
                width: 44px;
                height: 44px;
                font-size: 1rem;
                border-radius: 12px;
            }
            .logo-text h1 {
                font-size: 1.1rem;
            }
            .input-wrap input {
                padding: 10px 34px 10px 10px;
                font-size: 0.8rem;
            }
            .btn-primary {
                padding: 12px;
                font-size: 0.85rem;
            }
        }

        @media (max-width: 380px) {
            .register-container {
                padding: 18px 12px 16px;
            }
            .logo-icon {
                width: 38px;
                height: 38px;
                font-size: 0.85rem;
            }
            .logo-text h1 {
                font-size: 0.95rem;
            }
            .input-wrap input {
                padding: 8px 30px 8px 8px;
                font-size: 0.75rem;
            }
            .btn-primary {
                padding: 10px;
                font-size: 0.8rem;
            }
        }

        @media (min-width: 769px) {
            .register-container {
                padding: 48px 44px 36px;
                border-radius: var(--radius);
            }
            .logo-icon {
                width: 60px;
                height: 60px;
                font-size: 1.4rem;
                border-radius: 16px;
            }
            .logo-text h1 {
                font-size: 1.5rem;
            }
        }

        /* ============================================================
           SCROLLBAR
           ============================================================ */
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--gray-300);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--gold);
        }
    </style>
</head>
<body>

    <div class="register-wrapper">
        <div class="register-container">

            <!-- ===== الشعار ===== -->
            <div class="logo-section">
                <div class="logo-icon">QD</div>
                <div class="logo-text">
                    <h1>نظام إدارة الشركات</h1>
                    <div class="subtitle">إنشاء حساب جديد</div>
                </div>
            </div>

            <!-- ===== نموذج إنشاء حساب ===== -->
            <form id="registerForm">

                <div class="form-group">
                    <label><i class="fas fa-user"></i> الاسم الكامل</label>
                    <div class="input-wrap">
                        <i class="fas fa-user input-icon"></i>
                        <input type="text" id="name" placeholder="أحمد محمد" required />
                    </div>
                </div>

                <div class="form-group">
                    <label><i class="fas fa-envelope"></i> البريد الإلكتروني</label>
                    <div class="input-wrap">
                        <i class="fas fa-envelope input-icon"></i>
                        <input type="email" id="email" placeholder="admin@company.com" required autocomplete="email" />
                    </div>
                </div>

                <div class="form-group">
                    <label><i class="fas fa-lock"></i> كلمة المرور</label>
                    <div class="input-wrap">
                        <i class="fas fa-key input-icon"></i>
                        <input type="password" id="password" placeholder="•••••••• (6 أحرف على الأقل)" required minlength="6" />
                    </div>
                </div>

                <div class="form-group">
                    <label><i class="fas fa-building"></i> اسم الشركة</label>
                    <div class="input-wrap">
                        <i class="fas fa-building input-icon"></i>
                        <input type="text" id="companyName" placeholder="شركة النور للتجارة" required />
                    </div>
                </div>

                <button type="submit" class="btn-primary" id="registerBtn">
                    <i class="fas fa-user-plus"></i> إنشاء الحساب
                </button>

                <div class="loading-spinner" id="loadingSpinner">
                    <div class="dots"><span></span><span></span><span></span></div>
                    <span class="label">جاري إنشاء الحساب...</span>
                </div>

                <div id="message" class="message"></div>
            </form>

            <!-- ===== الروابط ===== -->
            <div class="links">
                لديك حساب بالفعل؟ <a href="login.html">تسجيل الدخول</a>
            </div>

            <!-- ===== حقوق الملكية ===== -->
            <div class="copyright">
                <i class="fas fa-copyright"></i>
                2026 جميع الحقوق محفوظة لـ
                <strong>QuickData ProSoft</strong>
                <span class="version">v3.0</span>
            </div>

        </div>
    </div>

    <script>
        /**
         * ============================================================
         * SUPABASE CONFIGURATION
         * ============================================================
         */
        var SUPABASE_URL = 'https://ykkhkgajzyxsgoamtmnn.supabase.co';
        var SUPABASE_ANON_KEY = 'sb_publishable_NOH7uJlEoPf6wcT87DNBug_izzR-4VF';

        /**
         * ============================================================
         * نموذج إنشاء حساب - Supabase
         * ============================================================
         */
        var registerForm = document.getElementById('registerForm');
        var messageDiv = document.getElementById('message');
        var loadingSpinner = document.getElementById('loadingSpinner');
        var registerBtn = document.getElementById('registerBtn');

        registerForm.addEventListener('submit', async function(e) {
            e.preventDefault();

            var name = document.getElementById('name').value.trim();
            var email = document.getElementById('email').value.trim();
            var password = document.getElementById('password').value;
            var companyName = document.getElementById('companyName').value.trim();

            if (!name || !email || !password || !companyName) {
                showMessage('❌ الرجاء ملء جميع الحقول', 'error');
                return;
            }

            if (password.length < 6) {
                showMessage('❌ كلمة المرور يجب أن تكون 6 أحرف على الأقل', 'error');
                return;
            }

            registerBtn.style.display = 'none';
            loadingSpinner.style.display = 'flex';
            hideMessage();

            try {
                // 1. إنشاء المستخدم في Supabase Auth
                var response = await fetch(SUPABASE_URL + '/auth/v1/signup', {
                    method: 'POST',
                    headers: {
                        'apikey': SUPABASE_ANON_KEY,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        email: email,
                        password: password,
                        data: {
                            name: name,
                            company_name: companyName,
                            role: 'admin'
                        }
                    })
                });

                var data = await response.json();

                if (!response.ok) {
                    var errorMsg = data.msg || data.message || 'حدث خطأ في إنشاء الحساب';
                    if (errorMsg.includes('already registered')) {
                        errorMsg = 'هذا البريد الإلكتروني مسجل بالفعل. يرجى استخدام بريد آخر.';
                    }
                    throw new Error(errorMsg);
                }

                // 2. حفظ الجلسة
                localStorage.setItem('rollex_session', JSON.stringify(data));

                // 3. إضافة المدير في جدول profiles
                var profilePayload = {
                    id: data.user.id,
                    name: name,
                    role: 'admin',
                    company_name: companyName,
                    email: email
                };

                var profileResponse = await fetch(SUPABASE_URL + '/rest/v1/profiles', {
                    method: 'POST',
                    headers: {
                        'apikey': SUPABASE_ANON_KEY,
                        'Authorization': 'Bearer ' + data.access_token,
                        'Content-Type': 'application/json',
                        'Prefer': 'return=representation'
                    },
                    body: JSON.stringify(profilePayload)
                });

                if (!profileResponse.ok) {
                    console.warn('⚠️ فشل إضافة البروفايل، لكن الحساب تم إنشاؤه');
                }

                showMessage('✅ تم إنشاء الحساب بنجاح! جاري التحويل...', 'success');

                setTimeout(function() {
                    window.location.href = 'index.html';
                }, 1500);

            } catch (error) {
                console.error('❌ خطأ:', error);
                showMessage('❌ ' + error.message, 'error');
            }

            registerBtn.style.display = 'flex';
            loadingSpinner.style.display = 'none';
        });

        /**
         * ============================================================
         * دوال مساعدة
         * ============================================================
         */
        function showMessage(text, type) {
            messageDiv.textContent = text;
            messageDiv.className = 'message ' + type;
        }

        function hideMessage() {
            messageDiv.className = 'message';
            messageDiv.textContent = '';
        }

        /**
         * ============================================================
         * رسالة الترحيب في Console
         * ============================================================
         */
        console.log('🏢 نظام إدارة الشركات - إنشاء حساب');
        console.log('🔗 Supabase URL:', SUPABASE_URL);
        console.log('✅ QuickData ProSoft v3.0');
    </script>

</body>
</html>
