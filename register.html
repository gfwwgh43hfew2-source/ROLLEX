<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>إنشاء حساب - QuickData ProSoft</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Cormorant+Garamond:wght@500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <style>
        /* ==========================================================
           RESET & BASE
           ========================================================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --champagne: #e6d3a3;
            --champagne-light: #f5ecd2;
            --champagne-deep: #b8944f;
            --platinum: #c7cedb;
            --ink: #060810;
            --ink-2: #0b0e1a;
            --wave-1: rgba(230, 211, 163, 0.07);
            --wave-2: rgba(199, 206, 219, 0.04);
        }

        html { scroll-behavior: smooth; }

        body {
            font-family: 'Cairo', 'Segoe UI', Tahoma, Arial, sans-serif;
            direction: rtl;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow: hidden;
            position: relative;
            background: var(--ink);
        }

        /* ===== خلفية شبكية مالية دقيقة ===== */
        .bg-fabric {
            position: fixed;
            inset: 0;
            z-index: 0;
            background-image:
                linear-gradient(rgba(230, 211, 163, 0.035) 1px, transparent 1px),
                linear-gradient(90deg, rgba(230, 211, 163, 0.035) 1px, transparent 1px);
            background-size: 46px 46px;
            mask-image: radial-gradient(ellipse 70% 60% at 50% 35%, #000 20%, transparent 85%);
        }

        .bg-overlay {
            position: fixed;
            inset: 0;
            z-index: 1;
            background:
                radial-gradient(ellipse at 25% 15%, rgba(230, 211, 163, 0.10) 0%, transparent 50%),
                radial-gradient(ellipse at 78% 85%, rgba(199, 206, 219, 0.06) 0%, transparent 50%),
                linear-gradient(180deg, rgba(6, 8, 16, 0.75) 0%, rgba(6, 8, 16, 0.96) 100%);
        }

        /* ===== توهج ذهبي متحرك ===== */
        .golden-glow {
            position: fixed;
            inset: 0;
            z-index: 1;
            pointer-events: none;
            opacity: 0.35;
            background-image:
                repeating-conic-gradient(from 0deg at 20% 25%, transparent 0deg, var(--wave-1) 10deg, transparent 20deg),
                repeating-conic-gradient(from 45deg at 82% 75%, transparent 0deg, var(--wave-2) 12deg, transparent 24deg);
            filter: blur(46px);
            animation: glowDrift 22s ease-in-out infinite alternate;
        }

        @keyframes glowDrift {
            0%   { transform: translate(0, 0) rotate(0deg) scale(1); }
            50%  { transform: translate(-2%, 2%) rotate(4deg) scale(1.05); }
            100% { transform: translate(2%, -1%) rotate(-3deg) scale(1.02); }
        }

        /* ===== جسيمات دقيقة ===== */
        .particles {
            position: fixed;
            inset: 0;
            z-index: 1;
            pointer-events: none;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            width: 3px;
            height: 3px;
            background: rgba(230, 211, 163, 0.2);
            border-radius: 50%;
            animation: floatParticle linear infinite;
            box-shadow: 0 0 8px rgba(230, 211, 163, 0.3);
        }

        @keyframes floatParticle {
            0% { transform: translateY(100vh) scale(0); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-8vh) scale(1); opacity: 0; }
        }

        /* ===== الحاوية الرئيسية ===== */
        .register-wrapper {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 560px;
            perspective: 1400px;
            animation: fadeInUp 0.55s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes fadeInUp {
            0% { opacity: 0; transform: translateY(28px) scale(0.97); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* ===== البطاقة الزجاجية ===== */
        .register-container {
            background: rgba(255, 255, 255, 0.025);
            backdrop-filter: blur(36px);
            -webkit-backdrop-filter: blur(36px);
            border-radius: 28px;
            padding: 48px 44px 36px;
            border: 1px solid rgba(230, 211, 163, 0.08);
            box-shadow:
                0 30px 80px rgba(0, 0, 0, 0.55),
                inset 0 1px 0 rgba(255, 255, 255, 0.05);
            position: relative;
            overflow: hidden;
            transform-style: preserve-3d;
            transition: transform 0.08s linear, box-shadow 0.25s;
        }

        .register-container:hover {
            box-shadow:
                0 36px 90px rgba(0, 0, 0, 0.6),
                0 0 70px rgba(230, 211, 163, 0.05),
                inset 0 1px 0 rgba(255, 255, 255, 0.07);
        }

        /* ===== حدود متوهجة دوّارة ===== */
        .register-container::before {
            content: '';
            position: absolute;
            inset: -2px;
            border-radius: 28px;
            padding: 1.5px;
            background: conic-gradient(from 0deg,
                    transparent 0%, rgba(230, 211, 163, 0.06) 25%,
                    rgba(230, 211, 163, 0.22) 50%, rgba(230, 211, 163, 0.06) 75%,
                    transparent 100%);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
            animation: borderSpin 9s linear infinite;
        }

        @keyframes borderSpin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* ===== محتوى البطاقة ===== */
        .card-content { transform: translateZ(24px); position: relative; }

        /* ===== الشعار ===== */
        .logo-section {
            display: flex;
            align-items: center;
            gap: 18px;
            margin-bottom: 30px;
            animation: slideDown 0.4s cubic-bezier(0.16, 1, 0.3, 1) 0.05s both;
        }

        @keyframes slideDown {
            0% { opacity: 0; transform: translateY(-14px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .logo-icon {
            flex-shrink: 0;
            width: 68px;
            height: 68px;
            background: linear-gradient(135deg, var(--champagne-light), var(--champagne), var(--champagne-deep));
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            color: var(--ink);
            box-shadow: 0 8px 26px rgba(230, 211, 163, 0.22);
            border: 1px solid rgba(230, 211, 163, 0.15);
            animation: logoFloat 4.5s ease-in-out infinite alternate;
            transition: transform 0.15s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.15s;
        }

        .logo-icon:hover {
            transform: scale(1.06) rotate(-3deg);
            box-shadow: 0 12px 36px rgba(230, 211, 163, 0.32);
        }

        @keyframes logoFloat {
            0% { transform: translateY(0); }
            100% { transform: translateY(-5px); }
        }

        .logo-text { flex: 1; }

        .logo-text h1 {
            font-family: 'Cormorant Garamond', 'Cairo', serif;
            font-size: 1.9rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--champagne-light), var(--champagne), var(--champagne-deep), var(--champagne));
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shimmer 5s ease-in-out infinite;
            line-height: 1.2;
            letter-spacing: 0.2px;
        }

        @keyframes shimmer {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .logo-text .subtitle {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: var(--platinum);
            opacity: 0.55;
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 1.4px;
            margin-top: 4px;
            text-transform: uppercase;
        }

        .logo-text .subtitle::before {
            content: '';
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: var(--champagne);
            box-shadow: 0 0 8px rgba(230, 211, 163, 0.7);
            animation: dotPulse 1.6s ease-in-out infinite;
        }

        @keyframes dotPulse {
            0%, 100% { opacity: 0.45; transform: scale(0.85); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        /* ===== حقوق الملكية ===== */
        .copyright {
            text-align: center;
            margin-top: 24px;
            padding-top: 18px;
            border-top: 1px solid rgba(230, 211, 163, 0.06);
            color: rgba(199, 206, 219, 0.2);
            font-size: 0.58rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            animation: slideUp 0.35s cubic-bezier(0.16, 1, 0.3, 1) 0.3s both;
        }

        .copyright i { margin: 0 4px; color: rgba(230, 211, 163, 0.2); }
        .copyright strong { color: rgba(230, 211, 163, 0.4); font-weight: 800; }
        .copyright .version { color: rgba(199, 206, 219, 0.14); font-weight: 400; font-size: 0.5rem; }

        /* ===== حقول الإدخال ===== */
        .form-group {
            margin-bottom: 18px;
            position: relative;
            animation: slideUp 0.32s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
            transform: translateY(10px);
        }

        .form-group:nth-child(1) { animation-delay: 0.05s; }
        .form-group:nth-child(2) { animation-delay: 0.08s; }
        .form-group:nth-child(3) { animation-delay: 0.11s; }
        .form-group:nth-child(4) { animation-delay: 0.14s; }

        @keyframes slideUp { to { opacity: 1; transform: translateY(0); } }

        .form-group label {
            display: flex;
            align-items: center;
            gap: 8px;
            color: rgba(199, 206, 219, 0.4);
            font-size: 0.7rem;
            font-weight: 700;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            transition: color 0.1s;
        }

        .form-group:focus-within label { color: rgba(230, 211, 163, 0.75); }

        .form-group label i { font-size: 0.6rem; color: rgba(230, 211, 163, 0.25); }

        .input-wrap {
            position: relative;
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.025);
            border: 1px solid rgba(230, 211, 163, 0.08);
            transition: border-color 0.1s, background 0.1s, box-shadow 0.1s, transform 0.1s;
            overflow: hidden;
        }

        .input-wrap:focus-within {
            border-color: rgba(230, 211, 163, 0.35);
            background: rgba(230, 211, 163, 0.045);
            box-shadow: 0 0 0 3.5px rgba(230, 211, 163, 0.06);
            transform: translateY(-1px);
        }

        .input-wrap .input-icon {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(199, 206, 219, 0.14);
            font-size: 0.85rem;
            transition: color 0.1s;
            z-index: 2;
        }

        .input-wrap:focus-within .input-icon { color: var(--champagne); }

        .input-wrap input {
            width: 100%;
            padding: 15px 48px 15px 16px;
            border: none;
            background: transparent;
            color: var(--champagne-light);
            font-size: 0.95rem;
            font-family: inherit;
            outline: none;
            position: relative;
            z-index: 1;
        }

        /* ===== إزالة النصوص الافتراضية الرمادية ===== */
        .input-wrap input::placeholder {
            color: transparent;
        }

        /* ===== زر إنشاء الحساب ===== */
        .btn-primary {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, var(--champagne-light), var(--champagne), var(--champagne-deep));
            background-size: 200% 100%;
            color: var(--ink);
            border: none;
            border-radius: 50px;
            font-weight: 800;
            font-size: 1rem;
            cursor: pointer;
            transition: background-position 0.2s, transform 0.08s, box-shadow 0.1s;
            font-family: inherit;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            position: relative;
            overflow: hidden;
            animation: slideUp 0.32s cubic-bezier(0.16, 1, 0.3, 1) 0.17s both;
            box-shadow: 0 6px 22px rgba(230, 211, 163, 0.18);
            margin-top: 8px;
        }

        .btn-primary:hover {
            background-position: 100% 0;
            transform: translateY(-2px);
            box-shadow: 0 14px 34px rgba(230, 211, 163, 0.3);
        }

        .btn-primary:active { transform: translateY(0) scale(0.97); }

        .btn-primary .ripple {
            position: absolute;
            border-radius: 50%;
            background: rgba(6, 8, 16, 0.3);
            transform: scale(0);
            animation: rippleAnim 0.4s ease-out;
            pointer-events: none;
        }

        @keyframes rippleAnim { to { transform: scale(3); opacity: 0); } }

        /* ===== التحميل ===== */
        .loading-spinner {
            display: none;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 14px;
            animation: slideUp 0.15s cubic-bezier(0.16, 1, 0.3, 1) both;
        }

        .loading-spinner .dots { display: flex; gap: 5px; }

        .loading-spinner .dots span {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--champagne);
            animation: dotBounce 0.9s ease-in-out infinite;
            box-shadow: 0 0 8px rgba(230, 211, 163, 0.45);
        }

        .loading-spinner .dots span:nth-child(2) { animation-delay: 0.12s; }
        .loading-spinner .dots span:nth-child(3) { animation-delay: 0.24s; }

        @keyframes dotBounce {
            0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
            30% { transform: translateY(-7px); opacity: 1; }
        }

        .loading-spinner span.label { color: rgba(199, 206, 219, 0.45); font-size: 0.8rem; font-weight: 600; }

        /* ===== رسائل الحالة ===== */
        .message {
            text-align: center;
            padding: 12px 16px;
            border-radius: 12px;
            margin-top: 14px;
            font-size: 0.8rem;
            display: none;
            align-items: center;
            justify-content: center;
            gap: 10px;
            animation: messagePop 0.2s cubic-bezier(0.16, 1, 0.3, 1) both;
            font-weight: 700;
        }

        @keyframes messagePop {
            0% { opacity: 0; transform: scale(0.94) translateY(-3px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }

        .message.success {
            display: flex;
            background: rgba(52, 211, 153, 0.08);
            color: #6ee7bf;
            border: 1px solid rgba(52, 211, 153, 0.16);
            backdrop-filter: blur(8px);
        }

        .message.error {
            display: flex;
            background: rgba(220, 60, 60, 0.06);
            color: #ff8080;
            border: 1px solid rgba(220, 60, 60, 0.14);
            backdrop-filter: blur(8px);
            animation: messagePop 0.2s cubic-bezier(0.16, 1, 0.3, 1) both, shake 0.3s ease 0.2s;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            50% { transform: translateX(5px); }
            75% { transform: translateX(-3px); }
        }

        .checkmark { width: 20px; height: 20px; flex-shrink: 0; }

        .checkmark circle {
            stroke: #6ee7bf;
            stroke-width: 2;
            fill: none;
            stroke-dasharray: 63;
            stroke-dashoffset: 63;
            animation: circleDraw 0.28s ease forwards;
        }

        .checkmark path {
            stroke: #6ee7bf;
            stroke-width: 2.5;
            stroke-linecap: round;
            stroke-linejoin: round;
            fill: none;
            stroke-dasharray: 20;
            stroke-dashoffset: 20;
            animation: checkDraw 0.2s ease 0.22s forwards;
        }

        @keyframes circleDraw { to { stroke-dashoffset: 0; } }
        @keyframes checkDraw { to { stroke-dashoffset: 0; } }

        /* ===== الروابط ===== */
        .links {
            text-align: center;
            margin-top: 20px;
            animation: slideUp 0.32s cubic-bezier(0.16, 1, 0.3, 1) 0.2s both;
            color: rgba(199, 206, 219, 0.14);
            font-size: 0.7rem;
            font-weight: 600;
            letter-spacing: 0.3px;
        }

        .links a {
            color: var(--champagne);
            text-decoration: none;
            transition: color 0.1s;
            font-weight: 700;
        }

        .links a:hover { color: var(--champagne-light); text-decoration: underline; }

        .links .system-name i { color: rgba(230, 211, 163, 0.15); margin: 0 4px; }

        /* ===== إمكانية الوصول ===== */
        a:focus-visible, button:focus-visible, input:focus-visible {
            outline: 2px solid rgba(230, 211, 163, 0.55);
            outline-offset: 2px;
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 600px) {
            .register-wrapper { max-width: 100%; }
            .register-container { padding: 28px 20px 24px; border-radius: 22px; }
            .logo-section { gap: 14px; margin-bottom: 24px; }
            .logo-icon { width: 52px; height: 52px; font-size: 1.4rem; border-radius: 14px; }
            .logo-text h1 { font-size: 1.4rem; }
            .input-wrap input { padding: 13px 42px 13px 14px; font-size: 0.88rem; }
            .input-wrap .input-icon { right: 14px; font-size: 0.75rem; }
            .btn-primary { padding: 14px; font-size: 0.9rem; }
            .links { font-size: 0.62rem; }
            .copyright { font-size: 0.52rem; margin-top: 18px; padding-top: 14px; }
        }

        @media (max-width: 420px) {
            .register-container { padding: 22px 14px 18px; border-radius: 18px; }
            .logo-icon { width: 44px; height: 44px; font-size: 1.2rem; border-radius: 12px; }
            .logo-text h1 { font-size: 1.2rem; }
            .input-wrap input { padding: 11px 36px 11px 12px; font-size: 0.82rem; }
            .btn-primary { padding: 12px; font-size: 0.85rem; }
        }

        @media (min-width: 769px) {
            .register-container { padding: 52px 48px 40px; border-radius: 32px; }
            .logo-icon { width: 76px; height: 76px; font-size: 2rem; border-radius: 20px; }
            .logo-text h1 { font-size: 2.1rem; }
        }

        ::-webkit-scrollbar { width: 3px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(230, 211, 163, 0.18); border-radius: 50px; }
    </style>
</head>
<body>

    <div class="bg-fabric"></div>
    <div class="bg-overlay"></div>
    <div class="golden-glow"></div>
    <div class="particles" id="particles"></div>

    <!-- ===== الحاوية الرئيسية ===== -->
    <div class="register-wrapper" id="registerWrapper">

        <div class="register-container" id="registerCard">
            <div class="card-content">

                <!-- ===== الشعار ===== -->
                <div class="logo-section">
                    <div class="logo-icon"><i class="fa-solid fa-building-columns"></i></div>
                    <div class="logo-text">
                        <h1>نظام إدارة الشركات</h1>
                        <div class="subtitle">إنشاء حساب جديد</div>
                    </div>
                </div>

                <!-- ===== نموذج إنشاء حساب ===== -->
                <form id="registerForm">

                    <div class="form-group">
                        <label><i class="fas fa-user"></i> الاسم الكامل</label>
                        <div class="input-wrap">
                            <i class="fas fa-user input-icon"></i>
                            <input type="text" id="name" required />
                        </div>
                    </div>

                    <div class="form-group">
                        <label><i class="fas fa-envelope"></i> البريد الإلكتروني</label>
                        <div class="input-wrap">
                            <i class="fas fa-envelope input-icon"></i>
                            <input type="email" id="email" required autocomplete="email" />
                        </div>
                    </div>

                    <div class="form-group">
                        <label><i class="fas fa-lock"></i> كلمة المرور</label>
                        <div class="input-wrap">
                            <i class="fas fa-key input-icon"></i>
                            <input type="password" id="password" required minlength="6" />
                        </div>
                    </div>

                    <div class="form-group">
                        <label><i class="fas fa-building"></i> اسم الشركة</label>
                        <div class="input-wrap">
                            <i class="fas fa-building input-icon"></i>
                            <input type="text" id="companyName" required />
                        </div>
                    </div>

                    <button type="submit" class="btn-primary" id="registerBtn">
                        <i class="fas fa-user-plus"></i> إنشاء الحساب
                    </button>

                    <div class="loading-spinner" id="loadingSpinner">
                        <div class="dots"><span></span><span></span><span></span></div>
                        <span class="label">جاري إنشاء الحساب...</span>
                    </div>

                    <!-- ===== رسائل الحالة ===== -->
                    <div id="adminMsg" style="display:none; color: #ff6b6b; font-size: 0.8rem; margin-top: 10px; text-align: center;">
                        ⚠️ هذه الشركة أو البريد الإلكتروني مسجل بالفعل.
                    </div>

                    <div id="successMsg" style="display:none; color: #28a745; font-size: 0.85rem; margin-top: 12px; text-align: center;">
                        ✅ تم إنشاء الحساب بنجاح! جاري التحويل...
                    </div>
                    
                    <div id="errorMsg" style="display:none; color: #dc3545; font-size: 0.85rem; margin-top: 12px; text-align: center;">
                        ❌ حدث خطأ، حاول مرة أخرى
                    </div>

                    <div id="message" class="message"></div>
                </form>

                <!-- ===== الروابط ===== -->
                <div class="links">
                    <span class="system-name">
                        <i class="fas fa-circle" style="font-size: 0.25rem; vertical-align: middle;"></i>
                        لديك حساب بالفعل؟ <a href="login.html">تسجيل الدخول</a>
                        <i class="fas fa-circle" style="font-size: 0.25rem; vertical-align: middle;"></i>
                    </span>
                </div>

                <!-- ===== حقوق الملكية ===== -->
                <div class="copyright">
                    <i class="fas fa-copyright"></i>
                    2026 جميع الحقوق محفوظة لـ
                    <strong>QuickData ProSoft</strong>
                    <span class="version">v3.0</span>
                </div>

            </div>
        </div>
    </div>

    <script>
        /**
         * ============================================================
         * SUPABASE CONFIGURATION
         * ============================================================
         */
        var SUPABASE_URL = 'https://ykkhkgajzyxsgoamtmnn.supabase.co';
        var SUPABASE_ANON_KEY = 'sb_publishable_NOH7uJlEoPf6wcT87DNBug_izzR-4VF';

        /**
         * ============================================================
         * جسيمات الخلفية المتحركة
         * ============================================================
         */
        (function createParticles() {
            var container = document.getElementById('particles');
            var count = 24;
            for (var i = 0; i < count; i++) {
                var particle = document.createElement('div');
                particle.className = 'particle';
                var size = 2 + Math.random() * 3;
                particle.style.width = size + 'px';
                particle.style.height = size + 'px';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.animationDuration = (7 + Math.random() * 9) + 's';
                particle.style.animationDelay = (Math.random() * 8) + 's';
                particle.style.opacity = 0.08 + Math.random() * 0.18;
                container.appendChild(particle);
            }
        })();

        /**
         * ============================================================
         * ميل البطاقة ثلاثي الأبعاد
         * ============================================================
         */
        var prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        var card = document.getElementById('registerCard');
        var wrapper = document.getElementById('registerWrapper');

        if (!prefersReducedMotion && window.matchMedia('(hover: hover)').matches) {
            wrapper.addEventListener('mousemove', function(e) {
                var rect = card.getBoundingClientRect();
                var x = (e.clientX - rect.left) / rect.width - 0.5;
                var y = (e.clientY - rect.top) / rect.height - 0.5;
                card.style.transform = 'rotateY(' + (x * 4) + 'deg) rotateX(' + (-y * 4) + 'deg)';
            });
            wrapper.addEventListener('mouseleave', function() {
                card.style.transform = 'rotateY(0deg) rotateX(0deg)';
            });
        }

        /**
         * ============================================================
         * تأثير التموّج عند النقر على الزر
         * ============================================================
         */
        var registerBtn = document.getElementById('registerBtn');
        registerBtn.addEventListener('click', function(e) {
            var rect = this.getBoundingClientRect();
            var ripple = document.createElement('span');
            var size = Math.max(rect.width, rect.height);
            ripple.className = 'ripple';
            ripple.style.width = ripple.style.height = size + 'px';
            ripple.style.left = (e.clientX - rect.left - size / 2) + 'px';
            ripple.style.top = (e.clientY - rect.top - size / 2) + 'px';
            this.appendChild(ripple);
            setTimeout(function() { ripple.remove(); }, 420);
        });

        /**
         * ============================================================
         * التحقق من وجود شركة أو بريد مسجل
         * ============================================================
         */
        async function checkCompanyOrEmailExists(companyName, email) {
            try {
                // 1. نتحقق من وجود شركة بنفس الاسم
                var companyResponse = await fetch(SUPABASE_URL + '/rest/v1/companies?name=eq.' + encodeURIComponent(companyName), {
                    headers: { 'apikey': SUPABASE_ANON_KEY }
                });
                var companyData = await companyResponse.json();
                if (companyData && companyData.length > 0) {
                    return { exists: true, reason: 'هذه الشركة مسجلة بالفعل' };
                }

                // 2. نتحقق من وجود مستخدم بنفس البريد
                var emailResponse = await fetch(SUPABASE_URL + '/rest/v1/profiles?email=eq.' + encodeURIComponent(email), {
                    headers: { 'apikey': SUPABASE_ANON_KEY }
                });
                var emailData = await emailResponse.json();
                if (emailData && emailData.length > 0) {
                    return { exists: true, reason: 'هذا البريد الإلكتروني مسجل بالفعل' };
                }

                return { exists: false };
            } catch (error) {
                console.error('❌ خطأ في التحقق:', error);
                return { exists: false };
            }
        }

        /**
         * ============================================================
         * منع فتح الصفحة لو فيه مدير (مؤقتاً للاختبار)
         * ============================================================
         */
        async function redirectIfAdminExists() {
            try {
                // نفحص بس وجود أي شركة، مش بنمنع التسجيل
                var response = await fetch(SUPABASE_URL + '/rest/v1/companies?limit=1', {
                    headers: { 'apikey': SUPABASE_ANON_KEY }
                });
                var data = await response.json();
                var hasCompanies = data && data.length > 0;
                
                // مجرد إشعار، مش منع
                var adminMsg = document.getElementById('adminMsg');
                if (hasCompanies && adminMsg) {
                    adminMsg.textContent = 'ℹ️ يوجد شركات مسجلة بالفعل. يمكنك التسجيل كشركة جديدة.';
                    adminMsg.style.display = 'block';
                    adminMsg.style.color = '#ffc107';
                    setTimeout(function() {
                        adminMsg.style.display = 'none';
                    }, 5000);
                }
            } catch (error) {
                console.error('❌ خطأ:', error);
            }
        }

        /**
         * ============================================================
         * إنشاء حساب جديد - مع إضافة الشركة
         * ============================================================
         */
        document.getElementById('registerForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            var name = document.getElementById('name').value.trim();
            var email = document.getElementById('email').value.trim();
            var password = document.getElementById('password').value;
            var companyName = document.getElementById('companyName').value.trim();

            var btn = document.getElementById('registerBtn');
            var errorMsg = document.getElementById('errorMsg');
            var successMsg = document.getElementById('successMsg');
            var adminMsg = document.getElementById('adminMsg');

            if (!name || !email || !password || !companyName) {
                if (errorMsg) {
                    errorMsg.textContent = '❌ الرجاء ملء جميع الحقول';
                    errorMsg.style.display = 'block';
                    setTimeout(function() { errorMsg.style.display = 'none'; }, 5000);
                }
                return;
            }

            if (password.length < 6) {
                if (errorMsg) {
                    errorMsg.textContent = '❌ كلمة المرور يجب أن تكون 6 أحرف على الأقل';
                    errorMsg.style.display = 'block';
                    setTimeout(function() { errorMsg.style.display = 'none'; }, 5000);
                }
                return;
            }

            btn.disabled = true;
            btn.innerHTML = '⏳ جاري إنشاء الحساب...';
            if (errorMsg) errorMsg.style.display = 'none';
            if (successMsg) successMsg.style.display = 'none';
            if (adminMsg) adminMsg.style.display = 'none';

            try {
                // 1. التحقق من وجود شركة أو بريد مسجل
                var checkResult = await checkCompanyOrEmailExists(companyName, email);

                if (checkResult.exists) {
                    if (adminMsg) {
                        adminMsg.textContent = '⚠️ ' + checkResult.reason;
                        adminMsg.style.display = 'block';
                        adminMsg.style.color = '#ff6b6b';
                        setTimeout(function() { adminMsg.style.display = 'none'; }, 5000);
                    }
                    btn.disabled = false;
                    btn.innerHTML = '✅ إنشاء الحساب';
                    return;
                }

                // 2. إنشاء المستخدم في Supabase Auth
                console.log('📝 جاري إنشاء المستخدم...');
                var response = await fetch(SUPABASE_URL + '/auth/v1/signup', {
                    method: 'POST',
                    headers: {
                        'apikey': SUPABASE_ANON_KEY,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        email: email,
                        password: password,
                        data: {
                            name: name,
                            company_name: companyName,
                            role: 'admin'
                        }
                    })
                });

                var data = await response.json();
                console.log('📡 استجابة التسجيل:', response.status);

                if (!response.ok) {
                    var errorMessage = data.msg || data.message || 'حدث خطأ في إنشاء الحساب';
                    if (errorMessage.includes('already registered')) {
                        errorMessage = 'هذا البريد الإلكتروني مسجل بالفعل. يرجى استخدام بريد آخر.';
                    }
                    throw new Error(errorMessage);
                }

                console.log('✅ تم إنشاء المستخدم:', data.user.id);

                // 3. حفظ الجلسة
                localStorage.setItem('rollex_session', JSON.stringify(data));

                // 4. إضافة الشركة في جدول companies
                console.log('📝 جاري إضافة الشركة...');
                var companyPayload = {
                    name: companyName,
                    subdomain: email.split('@')[1]
                };

                var companyResponse = await fetch(SUPABASE_URL + '/rest/v1/companies', {
                    method: 'POST',
                    headers: {
                        'apikey': SUPABASE_ANON_KEY,
                        'Authorization': 'Bearer ' + data.access_token,
                        'Content-Type': 'application/json',
                        'Prefer': 'return=representation'
                    },
                    body: JSON.stringify(companyPayload)
                });

                var companyData = await companyResponse.json();
                console.log('📡 استجابة إضافة الشركة:', companyResponse.status);

                if (!companyResponse.ok) {
                    console.error('❌ فشل إضافة الشركة:', companyData);
                }

                var companyId = companyData && companyData.length > 0 ? companyData[0].id : null;
                console.log('🏢 company_id:', companyId);

                // 5. إضافة المدير في جدول profiles مع company_id
                console.log('📝 جاري إضافة المدير في profiles...');
                var profilePayload = {
                    id: data.user.id,
                    name: name,
                    role: 'admin',
                    company_name: companyName,
                    email: email,
                    company_id: companyId
                };

                var profileResponse = await fetch(SUPABASE_URL + '/rest/v1/profiles', {
                    method: 'POST',
                    headers: {
                        'apikey': SUPABASE_ANON_KEY,
                        'Authorization': 'Bearer ' + data.access_token,
                        'Content-Type': 'application/json',
                        'Prefer': 'return=representation'
                    },
                    body: JSON.stringify(profilePayload)
                });

                var profileData = await profileResponse.text();
                console.log('📡 استجابة إضافة profiles:', profileResponse.status);

                if (!profileResponse.ok) {
                    console.error('❌ فشل إضافة البروفايل:', profileData);
                }

                if (successMsg) {
                    successMsg.style.display = 'block';
                }

                setTimeout(function() {
                    window.location.href = 'index.html';
                }, 1500);

            } catch (error) {
                console.error('❌ خطأ في التسجيل:', error);
                if (errorMsg) {
                    errorMsg.textContent = '❌ ' + error.message;
                    errorMsg.style.display = 'block';
                    setTimeout(function() { errorMsg.style.display = 'none'; }, 5000);
                }
            }

            btn.disabled = false;
            btn.innerHTML = '✅ إنشاء الحساب';
        });

        /**
         * ============================================================
         * رسالة الترحيب في Console
         * ============================================================
         */
        console.log('🏢 نظام إدارة الشركات - إنشاء حساب (Multi-Tenant)');
        console.log('🔗 Supabase URL:', SUPABASE_URL);
        console.log('✅ النظام جاهز للعمل - كل شركة تسجل بشكل مستقل');

        // ============================================================
        // تنفيذ عند تحميل الصفحة
        // ============================================================
        document.addEventListener('DOMContentLoaded', function() {
            console.log('🚀 تم تحميل صفحة التسجيل');
            redirectIfAdminExists();
        });
    </script>

</body>
</html>
