<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>إنشاء حساب - نظام إدارة الشركات</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <style>
        /* ===== الأساسيات ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background: #f4f5f7;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            direction: rtl;
            padding: 24px;
        }

        /* ===== الحاوية ===== */
        .container {
            width: 100%;
            max-width: 420px;
        }

        /* ===== البطاقة ===== */
        .card {
            background: #ffffff;
            border-radius: 20px;
            padding: 40px 32px 32px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.04);
            border: 1px solid #eef0f2;
        }

        /* ===== الشعار ===== */
        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 28px;
        }

        .brand-icon {
            width: 44px;
            height: 44px;
            background: #1a2634;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-weight: 800;
            font-size: 1rem;
            letter-spacing: 0.5px;
        }

        .brand-text h1 {
            font-size: 1.15rem;
            font-weight: 800;
            color: #1a2634;
            letter-spacing: -0.3px;
        }

        .brand-text span {
            display: block;
            font-size: 0.65rem;
            font-weight: 500;
            color: #8a94a6;
            margin-top: 2px;
        }

        /* ===== العنوان ===== */
        .page-title {
            margin-bottom: 24px;
        }

        .page-title h2 {
            font-size: 1.3rem;
            font-weight: 800;
            color: #1a2634;
        }

        .page-title p {
            color: #8a94a6;
            font-size: 0.8rem;
            font-weight: 400;
            margin-top: 4px;
        }

        /* ===== الحقول ===== */
        .field {
            margin-bottom: 16px;
        }

        .field label {
            display: block;
            font-size: 0.7rem;
            font-weight: 700;
            color: #3d4a5c;
            margin-bottom: 4px;
        }

        .field .input-wrap {
            position: relative;
            border: 1.5px solid #e6e9ed;
            border-radius: 10px;
            background: #fafbfc;
            transition: border-color 0.2s;
        }

        .field .input-wrap:focus-within {
            border-color: #1a2634;
            background: #ffffff;
        }

        .field .input-wrap i {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: #b0b8c6;
            font-size: 0.8rem;
        }

        .field .input-wrap input {
            width: 100%;
            padding: 11px 38px 11px 12px;
            border: none;
            background: transparent;
            font-size: 0.85rem;
            font-family: inherit;
            color: #1a2634;
            outline: none;
            border-radius: 10px;
        }

        .field .input-wrap input::placeholder {
            color: #c5ccd6;
            font-weight: 400;
        }

        /* ===== الزر ===== */
        .btn {
            width: 100%;
            padding: 13px;
            background: #1a2634;
            color: #ffffff;
            border: none;
            border-radius: 50px;
            font-size: 0.9rem;
            font-weight: 700;
            font-family: inherit;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn:hover {
            background: #0f1822;
        }

        .btn:active {
            transform: scale(0.98);
        }

        /* ===== رسائل ===== */
        .message {
            margin-top: 14px;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 0.75rem;
            font-weight: 600;
            display: none;
            text-align: center;
        }

        .message.show {
            display: block;
        }

        .message.success {
            background: #eaf6ed;
            color: #1e7b3c;
            border: 1px solid #c8e6d0;
        }

        .message.error {
            background: #fde8e8;
            color: #b33636;
            border: 1px solid #f5cfcf;
        }

        /* ===== التحميل ===== */
        .spinner {
            display: none;
            justify-content: center;
            align-items: center;
            gap: 6px;
            padding: 10px 0;
        }

        .spinner.show {
            display: flex;
        }

        .spinner span {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #1a2634;
            animation: bounce 1s ease-in-out infinite;
        }

        .spinner span:nth-child(2) {
            animation-delay: 0.15s;
        }
        .spinner span:nth-child(3) {
            animation-delay: 0.3s;
        }

        @keyframes bounce {
            0%,
            80%,
            100% {
                transform: scale(0.6);
                opacity: 0.4;
            }
            40% {
                transform: scale(1);
                opacity: 1;
            }
        }

        /* ===== الرابط ===== */
        .link {
            text-align: center;
            margin-top: 18px;
            font-size: 0.75rem;
            color: #8a94a6;
            font-weight: 500;
        }

        .link a {
            color: #1a2634;
            font-weight: 700;
            text-decoration: none;
        }

        .link a:hover {
            text-decoration: underline;
        }

        /* ===== التذييل ===== */
        .footer {
            text-align: center;
            margin-top: 20px;
            padding-top: 16px;
            border-top: 1px solid #eef0f2;
            font-size: 0.55rem;
            font-weight: 600;
            color: #b0b8c6;
        }

        .footer strong {
            color: #1a2634;
            font-weight: 700;
        }

        /* ===== استجابة ===== */
        @media (max-width: 420px) {
            .card {
                padding: 28px 18px 24px;
            }
            .brand-icon {
                width: 38px;
                height: 38px;
                font-size: 0.85rem;
            }
            .brand-text h1 {
                font-size: 1rem;
            }
            .page-title h2 {
                font-size: 1.1rem;
            }
            .field .input-wrap input {
                font-size: 0.8rem;
                padding: 10px 34px 10px 10px;
            }
            .btn {
                padding: 12px;
                font-size: 0.85rem;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="card">

            <!-- ===== الشعار ===== -->
            <div class="brand">
                <div class="brand-icon">QD</div>
                <div class="brand-text">
                    <h1>نظام إدارة الشركات</h1>
                    <span>QuickData ProSoft</span>
                </div>
            </div>

            <!-- ===== العنوان ===== -->
            <div class="page-title">
                <h2>إنشاء حساب جديد</h2>
                <p>أول مستخدم في النظام سيكون مديراً</p>
            </div>

            <!-- ===== النموذج ===== -->
            <form id="registerForm">

                <div class="field">
                    <label>الاسم الكامل</label>
                    <div class="input-wrap">
                        <i class="fas fa-user"></i>
                        <input type="text" id="name" placeholder="أحمد محمد" required />
                    </div>
                </div>

                <div class="field">
                    <label>البريد الإلكتروني</label>
                    <div class="input-wrap">
                        <i class="fas fa-envelope"></i>
                        <input type="email" id="email" placeholder="admin@company.com" required autocomplete="email" />
                    </div>
                </div>

                <div class="field">
                    <label>كلمة المرور</label>
                    <div class="input-wrap">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="password" placeholder="•••••••• (6 أحرف على الأقل)" required minlength="6" />
                    </div>
                </div>

                <div class="field">
                    <label>اسم الشركة</label>
                    <div class="input-wrap">
                        <i class="fas fa-building"></i>
                        <input type="text" id="companyName" placeholder="شركة النور للتجارة" required />
                    </div>
                </div>

                <button type="submit" class="btn" id="registerBtn">
                    <i class="fas fa-user-plus"></i> إنشاء الحساب
                </button>

                <div class="spinner" id="loadingSpinner">
                    <span></span><span></span><span></span>
                </div>

                <div class="message" id="message"></div>
            </form>

            <!-- ===== الرابط ===== -->
            <div class="link">
                لديك حساب؟ <a href="login.html">تسجيل الدخول</a>
            </div>

            <!-- ===== التذييل ===== -->
            <div class="footer">
                <i class="fas fa-copyright"></i> 2026
                <strong>QuickData ProSoft</strong>
                <span style="color:#c5ccd6;font-weight:400;">v3.0</span>
            </div>

        </div>
    </div>

    <script>
        // ===== إعدادات Supabase =====
        var SUPABASE_URL = 'https://ykkhkgajzyxsgoamtmnn.supabase.co';
        var SUPABASE_ANON_KEY = 'sb_publishable_NOH7uJlEoPf6wcT87DNBug_izzR-4VF';

        // ===== عناصر الصفحة =====
        var form = document.getElementById('registerForm');
        var msg = document.getElementById('message');
        var spinner = document.getElementById('loadingSpinner');
        var btn = document.getElementById('registerBtn');

        // ===== عرض رسالة =====
        function showMessage(text, type) {
            msg.textContent = text;
            msg.className = 'message show ' + type;
        }

        function hideMessage() {
            msg.className = 'message';
            msg.textContent = '';
        }

        // ===== إرسال النموذج =====
        form.addEventListener('submit', async function(e) {
            e.preventDefault();

            var name = document.getElementById('name').value.trim();
            var email = document.getElementById('email').value.trim();
            var password = document.getElementById('password').value;
            var company = document.getElementById('companyName').value.trim();

            if (!name || !email || !password || !company) {
                showMessage('الرجاء ملء جميع الحقول', 'error');
                return;
            }

            if (password.length < 6) {
                showMessage('كلمة المرور يجب أن تكون 6 أحرف على الأقل', 'error');
                return;
            }

            btn.style.display = 'none';
            spinner.classList.add('show');
            hideMessage();

            try {
                // 1. تسجيل المستخدم
                var res = await fetch(SUPABASE_URL + '/auth/v1/signup', {
                    method: 'POST',
                    headers: {
                        'apikey': SUPABASE_ANON_KEY,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        email: email,
                        password: password,
                        data: {
                            name: name,
                            company_name: company,
                            role: 'admin'
                        }
                    })
                });

                var data = await res.json();

                if (!res.ok) {
                    var err = data.msg || data.message || 'حدث خطأ';
                    if (err.includes('already registered')) {
                        err = 'هذا البريد مسجل بالفعل';
                    }
                    throw new Error(err);
                }

                // 2. حفظ الجلسة
                localStorage.setItem('rollex_session', JSON.stringify(data));

                // 3. إضافة في profiles
                await fetch(SUPABASE_URL + '/rest/v1/profiles', {
                    method: 'POST',
                    headers: {
                        'apikey': SUPABASE_ANON_KEY,
                        'Authorization': 'Bearer ' + data.access_token,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        id: data.user.id,
                        name: name,
                        role: 'admin',
                        company_name: company,
                        email: email
                    })
                });

                showMessage('✅ تم إنشاء الحساب بنجاح! جاري التحويل...', 'success');

                setTimeout(function() {
                    window.location.href = 'index.html';
                }, 1500);

            } catch (error) {
                showMessage('❌ ' + error.message, 'error');
            }

            btn.style.display = 'flex';
            spinner.classList.remove('show');
        });

        console.log('🏢 QuickData ProSoft - نظام إدارة الشركات');
    </script>

</body>
</html>
