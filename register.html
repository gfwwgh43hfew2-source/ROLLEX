<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5" />
    <title>إنشاء حساب - QuickData ProSoft</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800;900&family=Amiri:wght@400;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        /* ==========================================================
           RESET & BASE
           ========================================================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --gold: #f5c842;
            --gold-deep: #d4a020;
            --ink: #060a16;
            --ink-2: #0a1024;
            --pearl: rgba(255, 255, 255, 0.9);
            --wave-1: rgba(66, 180, 190, 0.14);
            --wave-2: rgba(245, 200, 66, 0.08);
        }

        html { scroll-behavior: smooth; }

        body {
            font-family: 'Cairo', 'Segoe UI', Tahoma, Arial, sans-serif;
            direction: rtl;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow: hidden;
            position: relative;
            background: var(--ink);
        }

        /* ===== خلفية فيديو متحركة ===== */
        .bg-video {
            position: fixed;
            inset: 0;
            z-index: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.28;
            filter: blur(2px) brightness(0.55) saturate(1.15);
            transform: scale(1.04);
        }

        /* ===== تراكب الخلفية ===== */
        .bg-overlay {
            position: fixed;
            inset: 0;
            z-index: 1;
            background:
                radial-gradient(ellipse at 30% 15%, rgba(245, 200, 66, 0.10) 0%, transparent 55%),
                radial-gradient(ellipse at 75% 85%, rgba(66, 180, 190, 0.08) 0%, transparent 55%),
                linear-gradient(180deg, rgba(6, 10, 22, 0.75) 0%, rgba(6, 10, 22, 0.94) 100%);
            backdrop-filter: blur(4px);
        }

        /* ===== توهج مياه متحرك ===== */
        .caustics {
            position: fixed;
            inset: 0;
            z-index: 1;
            pointer-events: none;
            opacity: 0.35;
            mix-blend-mode: screen;
            background-image:
                repeating-conic-gradient(from 0deg at 20% 30%, transparent 0deg, var(--wave-1) 8deg, transparent 16deg),
                repeating-conic-gradient(from 45deg at 80% 70%, transparent 0deg, var(--wave-2) 10deg, transparent 20deg);
            filter: blur(30px);
            animation: causticsDrift 22s ease-in-out infinite alternate;
        }

        @keyframes causticsDrift {
            0%   { transform: translate(0, 0) rotate(0deg) scale(1); }
            50%  { transform: translate(-2%, 2%) rotate(4deg) scale(1.08); }
            100% { transform: translate(2%, -1%) rotate(-3deg) scale(1.03); }
        }

        /* ===== جسيمات ذهبية متحركة ===== */
        .particles {
            position: fixed;
            inset: 0;
            z-index: 1;
            pointer-events: none;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            width: 3px;
            height: 3px;
            background: rgba(245, 200, 66, 0.18);
            border-radius: 50%;
            animation: floatParticle linear infinite;
            box-shadow: 0 0 8px rgba(245, 200, 66, 0.35);
        }

        @keyframes floatParticle {
            0% { transform: translateY(100vh) rotate(0deg) scale(0); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-10vh) rotate(720deg) scale(1); opacity: 0; }
        }

        /* ===== خط الأفق الذهبي ===== */
        .horizon {
            position: fixed;
            left: 0; right: 0; bottom: 0;
            height: 140px;
            z-index: 1;
            pointer-events: none;
            opacity: 0.5;
        }
        .horizon svg { width: 100%; height: 100%; display: block; }
        .horizon path {
            animation: horizonSway 10s ease-in-out infinite alternate;
            transform-origin: center bottom;
        }
        @keyframes horizonSway {
            0% { transform: translateY(0) scaleY(1); }
            100% { transform: translateY(-4px) scaleY(1.02); }
        }

        /* ===== الحاوية الرئيسية ===== */
        .register-wrapper {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 480px;
            perspective: 1400px;
            animation: fadeInUp 1.1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes fadeInUp {
            0% { opacity: 0; transform: translateY(60px) scale(0.95); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* ===== البطاقة الزجاجية ===== */
        .register-container {
            background: rgba(255, 255, 255, 0.035);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            border-radius: 32px;
            padding: 44px 36px 32px;
            border: 1px solid rgba(255, 255, 255, 0.07);
            box-shadow:
                0 40px 100px rgba(0, 0, 0, 0.6),
                inset 0 1px 0 rgba(255, 255, 255, 0.06);
            position: relative;
            overflow: hidden;
            transform-style: preserve-3d;
            will-change: transform;
            transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.4s;
        }

        .register-container:hover {
            box-shadow:
                0 50px 120px rgba(0, 0, 0, 0.65),
                0 0 90px rgba(245, 200, 66, 0.06),
                inset 0 1px 0 rgba(255, 255, 255, 0.08);
        }

        /* ===== حدود متوهجة ===== */
        .register-container::before {
            content: '';
            position: absolute;
            inset: -2px;
            border-radius: 32px;
            padding: 2px;
            background: conic-gradient(from 0deg,
                    transparent 0%, rgba(245, 200, 66, 0.06) 25%,
                    rgba(245, 200, 66, 0.18) 50%, rgba(245, 200, 66, 0.06) 75%,
                    transparent 100%);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
            animation: borderSpin 8s linear infinite;
        }

        @keyframes borderSpin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .register-container::after {
            content: '';
            position: absolute;
            top: -50%; left: -50%;
            width: 200%; height: 200%;
            background: radial-gradient(ellipse at 50% 30%, rgba(245, 200, 66, 0.035) 0%, transparent 50%);
            pointer-events: none;
            animation: glowPulse 6s ease-in-out infinite alternate;
        }

        @keyframes glowPulse {
            0% { opacity: 0.4; transform: scale(1); }
            100% { opacity: 1; transform: scale(1.1); }
        }

        /* ===== محتوى البطاقة ===== */
        .card-content { transform: translateZ(40px); position: relative; }

        /* ===== الشعار ===== */
        .logo-section {
            display: flex;
            align-items: center;
            gap: 18px;
            margin-bottom: 30px;
            animation: slideDown 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.1s both;
        }

        @keyframes slideDown {
            0% { opacity: 0; transform: translateY(-30px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .logo-image {
            flex-shrink: 0;
            width: 64px; height: 64px;
            border-radius: 18px;
            overflow: hidden;
            position: relative;
            border: 2px solid rgba(245, 200, 66, 0.14);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            animation: logoFloat 4s ease-in-out infinite alternate;
        }

        .logo-image::after {
            content: '';
            position: absolute; inset: 0;
            background: linear-gradient(120deg, transparent 30%, rgba(255,255,255,0.35) 48%, transparent 60%);
            transform: translateX(-120%);
            animation: logoSheen 5s ease-in-out infinite;
        }

        @keyframes logoSheen {
            0%, 60% { transform: translateX(-120%); }
            85%, 100% { transform: translateX(120%); }
        }

        .logo-image:hover {
            transform: scale(1.06) rotate(-3deg);
            border-color: rgba(245, 200, 66, 0.35);
            box-shadow: 0 12px 48px rgba(245, 200, 66, 0.18);
        }

        @keyframes logoFloat {
            0% { transform: translateY(0); }
            100% { transform: translateY(-6px); }
        }

        .logo-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .logo-text { flex: 1; }

        .logo-text h1 {
            font-size: 1.7rem;
            font-weight: 900;
            background: linear-gradient(135deg, #fff6da, var(--gold), var(--gold-deep), var(--gold));
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shimmer 5s ease-in-out infinite;
            line-height: 1.2;
            letter-spacing: -0.5px;
        }

        @keyframes shimmer {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .logo-text .subtitle {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: rgba(255, 255, 255, 0.3);
            font-size: 0.65rem;
            font-weight: 600;
            letter-spacing: 1px;
            margin-top: 4px;
        }
        .logo-text .subtitle::before {
            content: '';
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: var(--gold);
            box-shadow: 0 0 8px rgba(245, 200, 66, 0.7);
            animation: dotPulse 2s ease-in-out infinite;
        }
        @keyframes dotPulse {
            0%, 100% { opacity: 0.4; transform: scale(0.85); }
            50% { opacity: 1; transform: scale(1.15); }
        }

        /* ===== حقوق الملكية ===== */
        .copyright {
            text-align: center;
            margin-top: 22px;
            padding-top: 16px;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
            color: rgba(255, 255, 255, 0.14);
            font-size: 0.55rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.6s both;
        }

        .copyright i { margin: 0 4px; color: rgba(245, 200, 66, 0.18); }
        .copyright strong { color: rgba(245, 200, 66, 0.2); font-weight: 700; }

        /* ===== حقول الإدخال ===== */
        .form-group {
            margin-bottom: 20px;
            position: relative;
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
            transform: translateY(20px);
        }

        .form-group:nth-child(1) { animation-delay: 0.15s; }
        .form-group:nth-child(2) { animation-delay: 0.25s; }
        .form-group:nth-child(3) { animation-delay: 0.35s; }
        .form-group:nth-child(4) { animation-delay: 0.45s; }

        @keyframes slideUp { to { opacity: 1; transform: translateY(0); } }

        .form-group label {
            display: flex;
            align-items: center;
            gap: 8px;
            color: rgba(255, 255, 255, 0.4);
            font-size: 0.7rem;
            font-weight: 700;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            transition: all 0.3s;
        }

        .form-group:focus-within label { color: rgba(245, 200, 66, 0.7); }
        .form-group label i { font-size: 0.6rem; color: rgba(245, 200, 66, 0.25); }

        .input-wrap {
            position: relative;
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.025);
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            overflow: hidden;
        }

        .input-wrap::before {
            content: '';
            position: absolute; inset: 0;
            border-radius: 16px;
            padding: 1px;
            background: linear-gradient(135deg, transparent, rgba(245, 200, 66, 0.06), transparent);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.4s;
        }

        .input-wrap:focus-within {
            border-color: rgba(245, 200, 66, 0.2);
            background: rgba(255, 255, 255, 0.05);
            box-shadow: 0 0 0 4px rgba(245, 200, 66, 0.05), 0 0 40px rgba(245, 200, 66, 0.04);
            transform: translateY(-1px);
        }

        .input-wrap:focus-within::before { opacity: 1; }

        .input-wrap .input-icon {
            position: absolute;
            right: 16px; top: 50%;
            transform: translateY(-50%);
            color: rgba(255, 255, 255, 0.1);
            font-size: 0.8rem;
            transition: color 0.3s;
            z-index: 2;
        }

        .input-wrap:focus-within .input-icon { color: rgba(245, 200, 66, 0.3); }

        .input-wrap input {
            width: 100%;
            padding: 16px 48px 16px 48px;
            border: none;
            background: transparent;
            color: #fff;
            font-size: 0.95rem;
            font-family: inherit;
            outline: none;
            position: relative;
            z-index: 1;
        }

        .input-wrap input::placeholder { color: rgba(255, 255, 255, 0.1); font-weight: 400; }

        /* ===== زر إنشاء الحساب ===== */
        .btn-primary {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #fddc7b, var(--gold), var(--gold-deep));
            background-size: 200% 100%;
            color: var(--ink);
            border: none;
            border-radius: 50px;
            font-weight: 800;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            font-family: inherit;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            position: relative;
            overflow: hidden;
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.35s both;
            box-shadow: 0 4px 24px rgba(245, 200, 66, 0.18);
        }

        .btn-primary::before {
            content: '';
            position: absolute; inset: 0;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.35), transparent 60%);
            transform: translateX(-100%);
            transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .btn-primary:hover::before { transform: translateX(100%); }

        .btn-primary:hover {
            background-position: 100% 0;
            transform: translateY(-3px) scale(1.01);
            box-shadow: 0 16px 48px rgba(245, 200, 66, 0.3);
        }

        .btn-primary:active { transform: translateY(0) scale(0.97); }
        .btn-primary i { font-size: 0.9rem; }

        .btn-primary .ripple {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.5);
            transform: scale(0);
            animation: rippleAnim 0.6s ease-out;
            pointer-events: none;
        }
        @keyframes rippleAnim {
            to { transform: scale(3); opacity: 0; }
        }

        /* ===== زر التحميل ===== */
        .loading-spinner {
            display: none;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 14px;
            animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) both;
        }

        .loading-spinner .dots { display: flex; gap: 5px; }
        .loading-spinner .dots span {
            width: 6px; height: 6px;
            border-radius: 50%;
            background: var(--gold);
            animation: dotBounce 1.2s ease-in-out infinite;
            box-shadow: 0 0 8px rgba(245, 200, 66, 0.5);
        }
        .loading-spinner .dots span:nth-child(2) { animation-delay: 0.15s; }
        .loading-spinner .dots span:nth-child(3) { animation-delay: 0.3s; }
        @keyframes dotBounce {
            0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
            30% { transform: translateY(-6px); opacity: 1; }
        }

        .loading-spinner span.label {
            color: rgba(255, 255, 255, 0.35);
            font-size: 0.85rem;
            font-weight: 600;
        }

        /* ===== رسائل الحالة ===== */
        .message {
            text-align: center;
            padding: 14px 18px;
            border-radius: 14px;
            margin-top: 16px;
            font-size: 0.85rem;
            display: none;
            align-items: center;
            justify-content: center;
            gap: 10px;
            animation: messagePop 0.4s cubic-bezier(0.16, 1, 0.3, 1) both;
            font-weight: 700;
        }

        @keyframes messagePop {
            0% { opacity: 0; transform: scale(0.92) translateY(-4px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }

        .message.success {
            display: flex;
            background: rgba(43, 138, 62, 0.1);
            color: #66d17d;
            border: 1px solid rgba(43, 138, 62, 0.15);
            backdrop-filter: blur(8px);
        }

        .message.error {
            display: flex;
            background: rgba(201, 42, 42, 0.08);
            color: #ff6b6b;
            border: 1px solid rgba(201, 42, 42, 0.14);
            backdrop-filter: blur(8px);
            animation: messagePop 0.4s cubic-bezier(0.16, 1, 0.3, 1) both, shake 0.5s ease 0.4s;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-6px); }
            40% { transform: translateX(6px); }
            60% { transform: translateX(-4px); }
            80% { transform: translateX(4px); }
        }

        .checkmark {
            width: 18px; height: 18px;
            flex-shrink: 0;
        }
        .checkmark circle {
            stroke: #66d17d;
            stroke-width: 2;
            fill: none;
            stroke-dasharray: 63;
            stroke-dashoffset: 63;
            animation: circleDraw 0.5s ease forwards;
        }
        .checkmark path {
            stroke: #66d17d;
            stroke-width: 2.5;
            stroke-linecap: round;
            stroke-linejoin: round;
            fill: none;
            stroke-dasharray: 20;
            stroke-dashoffset: 20;
            animation: checkDraw 0.3s ease 0.4s forwards;
        }
        @keyframes circleDraw { to { stroke-dashoffset: 0; } }
        @keyframes checkDraw { to { stroke-dashoffset: 0; } }

        /* ==========================================================
           الروابط
           ========================================================== */
        .links {
            text-align: center;
            margin-top: 20px;
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.45s both;
            color: rgba(255, 255, 255, 0.15);
            font-size: 0.65rem;
            font-weight: 600;
            letter-spacing: 0.3px;
        }

        .links .system-name {
            color: rgba(255, 255, 255, 0.1);
            font-size: 0.6rem;
        }

        .links .system-name i {
            color: rgba(245, 200, 66, 0.15);
            margin: 0 4px;
        }

        .links a {
            color: var(--gold);
            text-decoration: none;
            font-weight: 700;
            transition: color 0.3s;
        }

        .links a:hover {
            color: var(--gold-deep);
            text-decoration: underline;
        }

        /* ===== إمكانية الوصول ===== */
        a:focus-visible, button:focus-visible, input:focus-visible {
            outline: 2px solid rgba(245, 200, 66, 0.6);
            outline-offset: 2px;
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 480px) {
            .register-container { padding: 28px 20px 26px; border-radius: 24px; }
            .logo-section { gap: 14px; margin-bottom: 26px; }
            .logo-image { width: 52px; height: 52px; border-radius: 14px; }
            .logo-text h1 { font-size: 1.4rem; }
            .input-wrap input { padding: 14px 44px 14px 44px; font-size: 0.9rem; }
            .input-wrap .input-icon { right: 14px; font-size: 0.7rem; }
            .btn-primary { padding: 14px; font-size: 0.9rem; }
            .links { font-size: 0.55rem; }
            .copyright { font-size: 0.5rem; margin-top: 16px; padding-top: 12px; }
        }

        @media (max-width: 380px) {
            .register-container { padding: 20px 14px 20px; border-radius: 20px; }
            .logo-image { width: 44px; height: 44px; border-radius: 12px; }
            .logo-text h1 { font-size: 1.2rem; }
            .input-wrap input { padding: 12px 40px 12px 40px; font-size: 0.85rem; }
            .btn-primary { padding: 12px; font-size: 0.85rem; }
            .links { font-size: 0.5rem; }
        }

        @media (min-width: 769px) {
            .register-container { padding: 52px 44px 38px; border-radius: 36px; }
            .logo-image { width: 76px; height: 76px; border-radius: 22px; }
            .logo-text h1 { font-size: 2rem; }
        }

        /* ===== تحسين التمرير ===== */
        ::-webkit-scrollbar { width: 3px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(245, 200, 66, 0.15); border-radius: 50px; }
    </style>
</head>
<body>

    <!-- ===== فيديو الخلفية ===== -->
    <video class="bg-video" autoplay muted loop playsinline>
        <source src="https://cdn.pixabay.com/video/2022/11/10/138219-770684293_tiny.mp4" type="video/mp4" />
    </video>

    <div class="bg-overlay"></div>
    <div class="caustics"></div>
    <div class="particles" id="particles"></div>

    <!-- ===== خط الأفق الذهبي ===== -->
    <div class="horizon">
        <svg viewBox="0 0 1440 140" preserveAspectRatio="none">
            <path d="M0,90 C240,40 480,120 720,80 C960,40 1200,110 1440,70 L1440,140 L0,140 Z"
                  fill="url(#horizonGrad)" />
            <defs>
                <linearGradient id="horizonGrad" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stop-color="#f5c842" stop-opacity="0.06" />
                    <stop offset="100%" stop-color="#f5c842" stop-opacity="0" />
                </linearGradient>
            </defs>
        </svg>
    </div>

    <!-- ===== الحاوية الرئيسية ===== -->
    <div class="register-wrapper" id="registerWrapper">

        <div class="register-container" id="registerCard">
            <div class="card-content">

                <!-- ===== الشعار ===== -->
                <div class="logo-section">
                    <div class="logo-image">
                        <img src="https://raw.githubusercontent.com/gfwwgh43hfew2-source/Hayala-Resort/main/ChatGPT%20Image%2030%20%D9%8A%D9%88%D9%84%D9%8A%D9%88%202026%D8%8C%2012_39_00%20%D9%85.png"
                             alt="منتجع حياله"
                             loading="lazy" />
                    </div>
                    <div class="logo-text">
                        <h1>منتجع حياله</h1>
                        <div class="subtitle">نظام الإدارة المتكامل</div>
                    </div>
                </div>

                <!-- ===== نموذج إنشاء حساب ===== -->
                <form id="registerForm">

                    <div class="form-group">
                        <label><i class="fas fa-user"></i> الاسم الكامل</label>
                        <div class="input-wrap">
                            <i class="fas fa-user input-icon"></i>
                            <input type="text" id="name" name="name" placeholder="أحمد محمد" required />
                        </div>
                    </div>

                    <div class="form-group">
                        <label><i class="fas fa-envelope"></i> البريد الإلكتروني</label>
                        <div class="input-wrap">
                            <i class="fas fa-envelope input-icon"></i>
                            <input type="email" id="email" name="email" placeholder="admin@hayala.com" required autocomplete="email" />
                        </div>
                    </div>

                    <div class="form-group">
                        <label><i class="fas fa-lock"></i> كلمة المرور</label>
                        <div class="input-wrap">
                            <i class="fas fa-key input-icon"></i>
                            <input type="password" id="password" name="password" placeholder="•••••••• (6 أحرف على الأقل)" required minlength="6" />
                        </div>
                    </div>

                    <div class="form-group">
                        <label><i class="fas fa-building"></i> اسم الشركة</label>
                        <div class="input-wrap">
                            <i class="fas fa-building input-icon"></i>
                            <input type="text" id="companyName" name="companyName" placeholder="شركة النور للتجارة" required />
                        </div>
                    </div>

                    <button type="submit" class="btn-primary" id="registerBtn">
                        <i class="fas fa-user-plus"></i> إنشاء الحساب
                    </button>

                    <div class="loading-spinner" id="loadingSpinner">
                        <div class="dots"><span></span><span></span><span></span></div>
                        <span class="label">جاري إنشاء الحساب...</span>
                    </div>

                    <div id="message" class="message"></div>
                </form>

                <!-- ===== الروابط ===== -->
                <div class="links">
                    <span class="system-name">
                        <i class="fas fa-circle" style="font-size: 0.25rem; vertical-align: middle;"></i>
                        لديك حساب بالفعل؟ <a href="login.html">تسجيل الدخول</a>
                        <i class="fas fa-circle" style="font-size: 0.25rem; vertical-align: middle;"></i>
                    </span>
                </div>

                <!-- ===== حقوق الملكية ===== -->
                <div class="copyright">
                    <i class="fas fa-copyright"></i>
                    جميع الحقوق محفوظة لشركة
                    <strong>RASID SOFT</strong>
                    <i class="fas fa-circle" style="font-size: 0.2rem; vertical-align: middle;"></i>
                    2026
                </div>

            </div>
        </div>
    </div>

    <script>
        /**
         * ============================================================
         * SUPABASE CONFIGURATION
         * ============================================================
         */
        var SUPABASE_URL = 'https://ykkhkgajzyxsgoamtmnn.supabase.co';
        var SUPABASE_ANON_KEY = 'sb_publishable_NOH7uJlEoPf6wcT87DNBug_izzR-4VF';

        /**
         * ============================================================
         * جسيمات الخلفية المتحركة
         * ============================================================
         */
        (function createParticles() {
            var container = document.getElementById('particles');
            var count = 25;
            for (var i = 0; i < count; i++) {
                var particle = document.createElement('div');
                particle.className = 'particle';
                var size = 2 + Math.random() * 4;
                particle.style.width = size + 'px';
                particle.style.height = size + 'px';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.animationDuration = (10 + Math.random() * 14) + 's';
                particle.style.animationDelay = (Math.random() * 12) + 's';
                particle.style.opacity = 0.05 + Math.random() * 0.2;
                container.appendChild(particle);
            }
        })();

        /**
         * ============================================================
         * ميل البطاقة ثلاثي الأبعاد مع حركة الفأرة
         * ============================================================
         */
        var prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        var card = document.getElementById('registerCard');
        var wrapper = document.getElementById('registerWrapper');

        if (!prefersReducedMotion && window.matchMedia('(hover: hover)').matches) {
            wrapper.addEventListener('mousemove', function(e) {
                var rect = card.getBoundingClientRect();
                var x = (e.clientX - rect.left) / rect.width - 0.5;
                var y = (e.clientY - rect.top) / rect.height - 0.5;
                card.style.transform = 'rotateY(' + (x * 6) + 'deg) rotateX(' + (-y * 6) + 'deg)';
            });
            wrapper.addEventListener('mouseleave', function() {
                card.style.transform = 'rotateY(0deg) rotateX(0deg)';
            });
        }

        /**
         * ============================================================
         * تأثير التموّج عند النقر على الزر
         * ============================================================
         */
        var registerBtn = document.getElementById('registerBtn');
        registerBtn.addEventListener('click', function(e) {
            var rect = this.getBoundingClientRect();
            var ripple = document.createElement('span');
            var size = Math.max(rect.width, rect.height);
            ripple.className = 'ripple';
            ripple.style.width = ripple.style.height = size + 'px';
            ripple.style.left = (e.clientX - rect.left - size / 2) + 'px';
            ripple.style.top = (e.clientY - rect.top - size / 2) + 'px';
            this.appendChild(ripple);
            setTimeout(function() { ripple.remove(); }, 650);
        });

        /**
         * ============================================================
         * التحقق من وجود شركة
         * ============================================================
         */
        async function checkCompanyExists(companyName) {
            try {
                var response = await fetch(SUPABASE_URL + '/rest/v1/companies?name=eq.' + encodeURIComponent(companyName) + '&select=id', {
                    headers: { 'apikey': SUPABASE_ANON_KEY }
                });
                if (!response.ok) return false;
                var data = await response.json();
                return data && data.length > 0;
            } catch (error) {
                console.error('❌ خطأ في التحقق:', error);
                return false;
            }
        }

        /**
         * ============================================================
         * نموذج إنشاء حساب - Supabase
         * ============================================================
         */
        var registerForm = document.getElementById('registerForm');
        var messageDiv = document.getElementById('message');
        var loadingSpinner = document.getElementById('loadingSpinner');

        registerForm.addEventListener('submit', async function(e) {
            e.preventDefault();

            var name = document.getElementById('name').value.trim();
            var email = document.getElementById('email').value.trim();
            var password = document.getElementById('password').value;
            var companyName = document.getElementById('companyName').value.trim();

            if (!name || !email || !password || !companyName) {
                showMessage('❌ الرجاء ملء جميع الحقول', 'error');
                return;
            }

            if (password.length < 6) {
                showMessage('❌ كلمة المرور يجب أن تكون 6 أحرف على الأقل', 'error');
                return;
            }

            registerBtn.style.display = 'none';
            loadingSpinner.style.display = 'flex';
            hideMessage();

            try {
                // 1. التحقق من وجود الشركة
                var companyExists = await checkCompanyExists(companyName);

                if (companyExists) {
                    showMessage('⚠️ هذه الشركة مسجلة بالفعل. التسجيل متاح للشركات الجديدة فقط.', 'error');
                    registerBtn.style.display = 'flex';
                    loadingSpinner.style.display = 'none';
                    return;
                }

                // 2. إنشاء المستخدم في Supabase Auth
                var response = await fetch(SUPABASE_URL + '/auth/v1/signup', {
                    method: 'POST',
                    headers: {
                        'apikey': SUPABASE_ANON_KEY,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        email: email,
                        password: password,
                        data: {
                            name: name,
                            company_name: companyName,
                            role: 'admin'
                        }
                    })
                });

                var data = await response.json();

                if (!response.ok) {
                    var errorMessage = data.msg || data.message || 'حدث خطأ في إنشاء الحساب';
                    if (errorMessage.includes('already registered')) {
                        errorMessage = 'هذا البريد الإلكتروني مسجل بالفعل. يرجى استخدام بريد آخر.';
                    }
                    throw new Error(errorMessage);
                }

                // 3. حفظ الجلسة
                localStorage.setItem('rollex_session', JSON.stringify(data));

                showMessage('✅ تم إنشاء الحساب بنجاح! جاري التحويل...', 'success');

                setTimeout(function() {
                    window.location.href = 'index.html';
                }, 1500);

            } catch (error) {
                console.error('❌ خطأ:', error);
                showMessage('❌ ' + error.message, 'error');
            }

            registerBtn.style.display = 'flex';
            loadingSpinner.style.display = 'none';
        });

        /**
         * ============================================================
         * دوال مساعدة
         * ============================================================
         */
        function showMessage(text, type) {
            var icon = type === 'success'
                ? '<svg class="checkmark" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M7 12.5l3 3 7-7"/></svg>'
                : '<i class="fas fa-circle-exclamation"></i>';
            messageDiv.innerHTML = icon + '<span>' + text + '</span>';
            messageDiv.className = 'message ' + type;
        }

        function hideMessage() {
            messageDiv.className = 'message';
            messageDiv.innerHTML = '';
        }

        /**
         * ============================================================
         * تأثيرات الحقول
         * ============================================================
         */
        var inputs = document.querySelectorAll('.input-wrap input');
        inputs.forEach(function(input) {
            input.addEventListener('focus', function() {
                this.closest('.input-wrap').style.transform = 'translateY(-1px)';
            });
            input.addEventListener('blur', function() {
                this.closest('.input-wrap').style.transform = 'translateY(0)';
            });
        });

        /**
         * ============================================================
         * رسالة الترحيب في Console
         * ============================================================
         */
        console.log('🏕️ نظام إدارة الشركات - إنشاء حساب (Supabase)');
        console.log('📊 Supabase URL:', SUPABASE_URL);
        console.log('✅ النظام جاهز للعمل');
        console.log('📌 التسجيل متاح للشركات الجديدة فقط');
    </script>

</body>
</html>
