<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5, viewport-fit=cover" />
    <title>إنشاء حساب - QuickData ProSoft</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800;900&display=swap" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-client.js"></script>
    <style>
        /* ========================================================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --gold: #f5a623;
            --gold-light: #ffc857;
            --gold-deep: #e08e0b;
            --navy-bg: #1b2431;
            --navy-bg-2: #141c27;
            --card: #212c3b;
            --field: #2a3646;
            --field-border: #37455a;
            --text-dim: rgba(255, 255, 255, 0.55);
            --text-faint: rgba(255, 255, 255, 0.4);
            --text-mid: rgba(255, 255, 255, 0.72);
            --danger: #ff6b6b;
            --success: #66d17d;
        }

        html {
            scroll-behavior: smooth;
            background: var(--navy-bg-2);
            height: 100%;
            overflow-x: hidden;
        }

        body {
            font-family: 'Cairo', 'Segoe UI', Tahoma, Arial, sans-serif;
            direction: rtl;
            min-height: 100vh;
            min-height: calc(var(--vh, 1vh) * 100);
            min-height: 100dvh;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px 20px;
            padding-top: max(24px, env(safe-area-inset-top));
            padding-bottom: max(24px, env(safe-area-inset-bottom));
            padding-left: max(20px, env(safe-area-inset-left));
            padding-right: max(20px, env(safe-area-inset-right));
            position: relative;
            background: radial-gradient(ellipse at 50% 40%, #232f40 0%, var(--navy-bg) 55%, var(--navy-bg-2) 100%);
            overflow-x: hidden;
            overflow-y: auto;
        }

        .ring-wrap {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 460px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .ring {
            position: fixed;
            top: 50%;
            left: 50%;
            width: min(94vw, 94dvh, 520px);
            height: min(94vw, 94dvh, 520px);
            transform: translate(-50%, -50%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
        }
        .ring svg {
            width: 100%;
            height: 100%;
            animation: ringSpin 90s linear infinite;
        }
        @keyframes ringSpin { to { transform: rotate(360deg); } }
        .ring .tick {
            stroke: rgba(255, 255, 255, 0.14);
            stroke-width: 3;
            stroke-linecap: round;
        }
        .ring .tick.lit {
            stroke: var(--gold);
            filter: drop-shadow(0 0 5px rgba(245, 166, 35, 0.85));
        }
        @media (prefers-reduced-motion: reduce) {
            .ring svg { animation: none; }
        }

        .register-container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 360px;
            background: var(--card);
            border-radius: 22px;
            padding: 38px 30px 30px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 30px 70px rgba(0, 0, 0, 0.55);
            animation: fadeInUp 0.7s cubic-bezier(0.16, 1, 0.3, 1) both;
        }
        @keyframes fadeInUp {
            0% { opacity: 0; transform: translateY(30px) scale(0.97); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }
        @media (prefers-reduced-motion: reduce) {
            .register-container { animation: none; }
        }

        .title {
            text-align: center;
            font-size: 1.9rem;
            font-weight: 900;
            letter-spacing: 2px;
            color: var(--gold);
            text-shadow: 0 0 22px rgba(245, 166, 35, 0.35);
            margin-bottom: 26px;
        }

        .form-group { margin-bottom: 16px; }
        .form-group label {
            display: block;
            font-size: 0.78rem;
            font-weight: 700;
            color: var(--text-mid);
            margin-bottom: 6px;
        }

        .input-wrap {
            position: relative;
            border-radius: 12px;
            background: var(--field);
            border: 1px solid var(--field-border);
            transition: border-color 0.25s, box-shadow 0.25s;
        }
        .input-wrap:focus-within {
            border-color: var(--gold);
            box-shadow: 0 0 0 3px rgba(245, 166, 35, 0.18);
        }
        .input-wrap .input-icon {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-dim);
            z-index: 2;
            display: flex;
            pointer-events: none;
        }
        .input-wrap:focus-within .input-icon { color: var(--gold); }

        .input-wrap input {
            width: 100%;
            padding: 14px 44px 14px 16px;
            border: none;
            background: transparent;
            color: #fff;
            font-size: 0.9rem;
            font-family: inherit;
            outline: none;
            text-align: right;
        }
        .input-wrap input::placeholder { color: var(--text-faint); font-weight: 400; }

        /* زر إظهار/إخفاء كلمة المرور */
        .input-wrap .toggle-password {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--text-dim);
            cursor: pointer;
            z-index: 2;
            font-size: 0.9rem;
            padding: 4px;
            transition: color 0.2s;
        }
        .input-wrap .toggle-password:hover {
            color: var(--gold);
        }
        .input-wrap:focus-within .toggle-password {
            color: var(--text-mid);
        }

        .field-error {
            display: none;
            align-items: center;
            gap: 6px;
            color: var(--danger);
            font-size: 0.74rem;
            font-weight: 700;
            margin-top: 6px;
        }
        .field-error.show { display: flex; }
        .input-wrap.invalid { border-color: var(--danger); }
        .input-wrap.invalid:focus-within { box-shadow: 0 0 0 3px rgba(255, 107, 107, 0.15); }

        .btn-primary {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--gold-light), var(--gold), var(--gold-deep));
            color: #1b1204;
            border: none;
            border-radius: 12px;
            font-weight: 800;
            font-size: 0.95rem;
            letter-spacing: 1px;
            cursor: pointer;
            transition: transform 0.25s, box-shadow 0.25s, opacity 0.25s;
            font-family: inherit;
            box-shadow: 0 10px 26px rgba(245, 166, 35, 0.28);
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 8px;
        }
        .btn-primary::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.35), transparent 60%);
            transform: translateX(-100%);
            transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .btn-primary:hover::before { transform: translateX(100%); }
        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 16px 36px rgba(245, 166, 35, 0.36);
        }
        .btn-primary:active:not(:disabled) { transform: translateY(0) scale(0.98); }
        .btn-primary:disabled { cursor: not-allowed; opacity: 0.75; box-shadow: none; }

        .btn-primary .ripple {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.5);
            transform: scale(0);
            animation: rippleAnim 0.6s ease-out;
            pointer-events: none;
        }
        @keyframes rippleAnim { to { transform: scale(3); opacity: 0; } }

        .btn-spinner {
            display: none;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(27, 18, 4, 0.3);
            border-top-color: #1b1204;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }
        .btn-primary.loading .btn-spinner { display: inline-block; }
        .btn-primary.loading .btn-label { opacity: 0.85; }
        @keyframes spin { to { transform: rotate(360deg); } }
        @media (prefers-reduced-motion: reduce) { .btn-spinner { animation: none; } }

        .message {
            text-align: center;
            padding: 12px 16px;
            border-radius: 12px;
            margin-top: 14px;
            font-size: 0.82rem;
            display: none;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-weight: 700;
        }
        .message.success {
            display: flex;
            background: rgba(43, 138, 62, 0.14);
            color: var(--success);
            border: 1px solid rgba(43, 138, 62, 0.25);
        }
        .message.error {
            display: flex;
            background: rgba(201, 42, 42, 0.12);
            color: var(--danger);
            border: 1px solid rgba(201, 42, 42, 0.22);
            animation: shake 0.5s ease;
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-6px); }
            40% { transform: translateX(6px); }
            60% { transform: translateX(-4px); }
            80% { transform: translateX(4px); }
        }
        @media (prefers-reduced-motion: reduce) { .message.error { animation: none; } }

        .checkmark { width: 16px; height: 16px; flex-shrink: 0; }
        .checkmark circle { stroke: var(--success); stroke-width: 2; fill: none; }
        .checkmark path { stroke: var(--success); stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; fill: none; }

        .links {
            text-align: center;
            color: var(--text-dim);
            font-size: 0.8rem;
            font-weight: 600;
            margin-top: 20px;
        }
        .links a {
            color: var(--gold);
            text-decoration: none;
            font-weight: 800;
        }
        .links a:hover { text-decoration: underline; color: var(--gold-light); }

        .copyright {
            text-align: center;
            margin-top: 20px;
            padding-top: 14px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            color: rgba(255, 255, 255, 0.22);
            font-size: 0.6rem;
            font-weight: 600;
            letter-spacing: 0.4px;
        }
        .copyright strong { color: rgba(245, 166, 35, 0.45); }

        a:focus-visible, button:focus-visible {
            outline: 2px solid var(--gold);
            outline-offset: 2px;
        }
        .input-wrap input:focus,
        .input-wrap input:focus-visible { outline: none; }

        @media (max-width: 480px) {
            .register-container { padding: 30px 22px 24px; border-radius: 20px; }
            .title { font-size: 1.6rem; }
        }
        @media (max-width: 480px) and (max-height: 700px) {
            body { align-items: flex-start; padding-top: 20px; }
        }
    </style>
</head>
<body>

    <!-- Font Awesome للأيقونات -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

    <script>
        /**
         * ============================================================
         * REAL VIEWPORT HEIGHT FIX
         * ============================================================
         */
        function setRealViewportHeight() {
            document.documentElement.style.setProperty('--vh', (window.innerHeight * 0.01) + 'px');
        }
        setRealViewportHeight();
        window.addEventListener('resize', setRealViewportHeight);
        window.addEventListener('orientationchange', setRealViewportHeight);
        if (window.visualViewport) {
            window.visualViewport.addEventListener('resize', setRealViewportHeight);
        }

        /**
         * ============================================================
         * SUPABASE CONFIGURATION
         * ============================================================
         */
        var supabaseUrl = 'https://ykkhkgajzyxsgoamtmnn.supabase.co';
        var supabaseKey = 'sb_publishable_NOH7uJlEoPf6wcT87DNBug_izzR-4VF';
        var supabase = supabase.createClient(supabaseUrl, supabaseKey, {
            auth: {
                autoRefreshToken: true,
                persistSession: true,
                detectSessionInUrl: true,
                storageKey: 'rollex_session'
            }
        });

        /**
         * ============================================================
         * منع الوصول إذا كان المستخدم مسجل دخول بالفعل
         * ============================================================
         */
        (async function checkAuthAndRedirect() {
            try {
                var { data: { session }, error } = await supabase.auth.getSession();

                if (error) {
                    console.warn('⚠️ خطأ في التحقق من الجلسة:', error.message);
                    return;
                }

                if (session) {
                    console.log('✅ المستخدم مسجل دخول بالفعل:', session.user.email);
                    console.log('🔄 جاري التوجيه إلى الصفحة الرئيسية...');
                    window.location.replace('index.html');
                } else {
                    console.log('👤 المستخدم غير مسجل دخول، مرحباً بك في صفحة التسجيل');
                }
            } catch (error) {
                console.error('❌ خطأ في التحقق من الجلسة:', error);
            }
        })();

        /**
         * ============================================================
         * بناء الحلقة المتقطعة المزخرفة (SVG)
         * ============================================================
         */
        (function buildRing() {
            var ring = document.getElementById('ring');
            var size = 600;
            var cx = size / 2,
                cy = size / 2,
                r = size / 2 - 20;
            var total = 48;
            var litStart = 4,
                litEnd = 15;
            var svgNS = 'http://www.w3.org/2000/svg';
            var svg = document.createElementNS(svgNS, 'svg');
            svg.setAttribute('viewBox', '0 0 ' + size + ' ' + size);

            for (var i = 0; i < total; i++) {
                var angle = (i / total) * 2 * Math.PI;
                var inner = r - 14;
                var outer = r;
                var x1 = cx + inner * Math.cos(angle);
                var y1 = cy + inner * Math.sin(angle);
                var x2 = cx + outer * Math.cos(angle);
                var y2 = cy + outer * Math.sin(angle);
                var line = document.createElementNS(svgNS, 'line');
                line.setAttribute('x1', x1);
                line.setAttribute('y1', y1);
                line.setAttribute('x2', x2);
                line.setAttribute('y2', y2);
                var lit = (i >= litStart && i <= litEnd);
                line.setAttribute('class', 'tick' + (lit ? ' lit' : ''));
                svg.appendChild(line);
            }
            ring.appendChild(svg);
        })();

        /**
         * ============================================================
         * تأثير التموّج عند النقر على الزر
         * ============================================================
         */
        var registerBtn = document.getElementById('registerBtn');
        registerBtn.addEventListener('click', function(e) {
            if (registerBtn.disabled) return;
            var rect = this.getBoundingClientRect();
            var ripple = document.createElement('span');
            var size = Math.max(rect.width, rect.height);
            ripple.className = 'ripple';
            ripple.style.width = ripple.style.height = size + 'px';
            ripple.style.left = (e.clientX - rect.left - size / 2) + 'px';
            ripple.style.top = (e.clientY - rect.top - size / 2) + 'px';
            this.appendChild(ripple);
            setTimeout(function() { ripple.remove(); }, 650);
        });

        /**
         * ============================================================
         * زر إظهار/إخفاء كلمة المرور
         * ============================================================
         */
        function setupTogglePassword(inputId, toggleId) {
            var input = document.getElementById(inputId);
            var toggle = document.getElementById(toggleId);

            toggle.addEventListener('click', function() {
                var type = input.getAttribute('type') === 'password' ? 'text' : 'password';
                input.setAttribute('type', type);
                this.innerHTML = type === 'password' ? '<i class="fas fa-eye"></i>' : '<i class="fas fa-eye-slash"></i>';
            });
        }

        setupTogglePassword('password', 'togglePassword');
        setupTogglePassword('confirmPassword', 'toggleConfirmPassword');

        /**
         * ============================================================
         * دالة التحقق من وجود الشركة
         * ============================================================
         */
        async function checkCompanyExists(companyName) {
            try {
                var response = await fetch(supabaseUrl + '/rest/v1/companies?name=eq.' + encodeURIComponent(companyName) +
                    '&select=id', {
                        headers: { 'apikey': supabaseKey }
                    });
                if (!response.ok) return false;
                var data = await response.json();
                return data && data.length > 0;
            } catch (error) {
                console.error('❌ خطأ في التحقق من الشركة:', error);
                return false;
            }
        }

        /**
         * ============================================================
         * دالة إنشاء شركة جديدة في جدول companies
         * ============================================================
         */
        async function createCompany(companyName) {
            var response = await fetch(supabaseUrl + '/rest/v1/companies', {
                method: 'POST',
                headers: {
                    'apikey': supabaseKey,
                    'Content-Type': 'application/json',
                    'Prefer': 'return=representation'
                },
                body: JSON.stringify({
                    name: companyName,
                    subdomain: companyName.toLowerCase().replace(/[^a-z0-9]/g, '') + '-' + Date.now().toString().slice(-6)
                })
            });
            if (!response.ok) {
                var errorText = await response.text();
                throw new Error('فشل إنشاء الشركة: ' + errorText);
            }
            var data = await response.json();
            return data && data.length > 0 ? data[0] : null;
        }

        /**
         * ============================================================
         * دالة إنشاء البروفايل (المستخدم) في جدول profiles
         * ============================================================
         */
        async function createProfile(userId, name, email, companyId, companyName, role) {
            // 1. التحقق مما إذا كان البروفايل موجود بالفعل
            var checkResponse = await fetch(supabaseUrl + '/rest/v1/profiles?select=id,company_id,company_name&id=eq.' +
                userId, {
                    headers: {
                        'apikey': supabaseKey,
                        'Authorization': 'Bearer ' + (await supabase.auth.getSession()).data.session.access_token
                    }
                });
            var existingProfile = await checkResponse.json();

            // إذا كان موجوداً، نقوم بتحديث company_id و company_name إذا لزم الأمر
            if (existingProfile && existingProfile.length > 0) {
                var profile = existingProfile[0];
                if (profile.company_id !== companyId || profile.company_name !== companyName) {
                    var updateResponse = await fetch(supabaseUrl + '/rest/v1/profiles?id=eq.' + userId, {
                        method: 'PATCH',
                        headers: {
                            'apikey': supabaseKey,
                            'Authorization': 'Bearer ' + (await supabase.auth.getSession()).data.session.access_token,
                            'Content-Type': 'application/json',
                            'Prefer': 'return=representation'
                        },
                        body: JSON.stringify({
                            company_id: companyId,
                            company_name: companyName
                        })
                    });
                    if (!updateResponse.ok) {
                        console.error('❌ فشل تحديث company_id/company_name للبروفايل:', await updateResponse.text());
                    } else {
                        console.log('✅ تم تحديث company_id و company_name للبروفايل بنجاح');
                    }
                }
                return profile;
            }

            // إذا لم يكن موجوداً، نقوم بإضافته مع company_name
            var response = await fetch(supabaseUrl + '/rest/v1/profiles', {
                method: 'POST',
                headers: {
                    'apikey': supabaseKey,
                    'Authorization': 'Bearer ' + (await supabase.auth.getSession()).data.session.access_token,
                    'Content-Type': 'application/json',
                    'Prefer': 'return=representation'
                },
                body: JSON.stringify({
                    id: userId,
                    name: name,
                    email: email,
                    role: role || 'admin',
                    company_id: companyId,
                    company_name: companyName
                })
            });

            if (!response.ok) {
                var errorText = await response.text();
                throw new Error('فشل إنشاء البروفايل: ' + errorText);
            }

            return await response.json();
        }

        /**
         * ============================================================
         * نموذج إنشاء حساب - Supabase
         * ============================================================
         */
        var registerForm = document.getElementById('registerForm');
        var messageDiv = document.getElementById('message');
        var btnLabel = registerBtn.querySelector('.btn-label');

        // عناصر التحقق
        var nameInput = document.getElementById('name');
        var nameWrap = document.getElementById('nameWrap');
        var nameError = document.getElementById('nameError');

        var emailInput = document.getElementById('email');
        var emailWrap = document.getElementById('emailWrap');
        var emailError = document.getElementById('emailError');

        var passwordInput = document.getElementById('password');
        var passwordWrap = document.getElementById('passwordWrap');
        var passwordError = document.getElementById('passwordError');

        var confirmPasswordInput = document.getElementById('confirmPassword');
        var confirmPasswordWrap = document.getElementById('confirmPasswordWrap');
        var confirmPasswordError = document.getElementById('confirmPasswordError');

        var companyInput = document.getElementById('companyName');
        var companyWrap = document.getElementById('companyWrap');
        var companyError = document.getElementById('companyError');

        function validateEmail(value) {
            return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value);
        }

        function setFieldState(wrap, errorEl, isValid) {
            wrap.classList.toggle('invalid', !isValid);
            errorEl.classList.toggle('show', !isValid);
        }

        // التحقق من تطابق كلمة المرور فوراً
        confirmPasswordInput.addEventListener('input', function() {
            var password = passwordInput.value;
            var confirm = this.value;
            if (confirm.length > 0) {
                var isValid = password === confirm;
                setFieldState(confirmPasswordWrap, confirmPasswordError, isValid);
            } else {
                confirmPasswordWrap.classList.remove('invalid');
                confirmPasswordError.classList.remove('show');
            }
        });

        passwordInput.addEventListener('input', function() {
            // إذا كان حقل التأكيد غير فارغ، نتحقق من التطابق
            if (confirmPasswordInput.value.length > 0) {
                var isValid = this.value === confirmPasswordInput.value;
                setFieldState(confirmPasswordWrap, confirmPasswordError, isValid);
            }
        });

        registerForm.addEventListener('submit', async function(e) {
            e.preventDefault();

            var name = nameInput.value.trim();
            var email = emailInput.value.trim();
            var password = passwordInput.value;
            var confirmPassword = confirmPasswordInput.value;
            var companyName = companyInput.value.trim();

            var nameValid = name.length > 0;
            var emailValid = validateEmail(email);
            var passwordValid = password.length >= 6;
            var confirmValid = password === confirmPassword && confirmPassword.length >= 6;
            var companyValid = companyName.length > 0;

            setFieldState(nameWrap, nameError, nameValid);
            setFieldState(emailWrap, emailError, emailValid);
            setFieldState(passwordWrap, passwordError, passwordValid);
            setFieldState(confirmPasswordWrap, confirmPasswordError, confirmValid);
            setFieldState(companyWrap, companyError, companyValid);

            if (!nameValid || !emailValid || !passwordValid || !confirmValid || !companyValid) {
                if (!nameValid) nameInput.focus();
                else if (!emailValid) emailInput.focus();
                else if (!passwordValid) passwordInput.focus();
                else if (!confirmValid) confirmPasswordInput.focus();
                else if (!companyValid) companyInput.focus();
                return;
            }

            registerBtn.disabled = true;
            registerBtn.classList.add('loading');
            btnLabel.textContent = 'جاري إنشاء الحساب...';
            hideMessage();

            try {
                // 1. التحقق من وجود الشركة
                var companyExists = await checkCompanyExists(companyName);

                if (companyExists) {
                    showMessage('⚠️ هذه الشركة مسجلة بالفعل. التسجيل متاح للشركات الجديدة فقط.', 'error');
                    registerBtn.disabled = false;
                    registerBtn.classList.remove('loading');
                    btnLabel.textContent = 'إنشاء الحساب';
                    return;
                }

                // 2. إنشاء الشركة الجديدة
                var newCompany = await createCompany(companyName);
                if (!newCompany) {
                    throw new Error('فشل إنشاء الشركة');
                }

                // 3. إنشاء المستخدم في Supabase Auth
                var { data, error } = await supabase.auth.signUp({
                    email: email,
                    password: password,
                    options: {
                        data: {
                            name: name,
                            company_id: newCompany.id,
                            role: 'admin'
                        }
                    }
                });

                if (error) {
                    var errorMessage = error.message || 'حدث خطأ في إنشاء الحساب';
                    if (errorMessage.includes('already registered')) {
                        errorMessage = 'هذا البريد الإلكتروني مسجل بالفعل. يرجى استخدام بريد آخر.';
                    }
                    throw new Error(errorMessage);
                }

                if (!data.user) {
                    throw new Error('فشل إنشاء المستخدم');
                }

                // 4. إنشاء البروفايل في جدول profiles
                await createProfile(data.user.id, name, email, newCompany.id, companyName, 'admin');

                // 5. حفظ الجلسة
                localStorage.setItem('rollex_session', JSON.stringify(data.session));

                showMessage('✅ تم إنشاء الحساب بنجاح! جاري التحويل...', 'success');

                setTimeout(function() {
                    window.location.href = 'index.html';
                }, 1500);

            } catch (error) {
                console.error('❌ خطأ:', error);
                showMessage('❌ ' + error.message, 'error');
            }

            registerBtn.disabled = false;
            registerBtn.classList.remove('loading');
            btnLabel.textContent = 'إنشاء الحساب';
        });

        function showMessage(text, type) {
            var icon = type === 'success' ?
                '<svg class="checkmark" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M7 12.5l3 3 7-7"/></svg>' :
                '<span aria-hidden="true">⚠</span>';
            messageDiv.innerHTML = icon + '<span>' + text + '</span>';
            messageDiv.className = 'message ' + type;
        }

        function hideMessage() {
            messageDiv.className = 'message';
            messageDiv.innerHTML = '';
        }

        // التحقق الفوري عند الكتابة
        nameInput.addEventListener('input', function() {
            if (nameWrap.classList.contains('invalid') && nameInput.value.trim().length > 0) {
                setFieldState(nameWrap, nameError, true);
            }
        });

        emailInput.addEventListener('input', function() {
            if (emailWrap.classList.contains('invalid') && validateEmail(emailInput.value.trim())) {
                setFieldState(emailWrap, emailError, true);
            }
        });

        passwordInput.addEventListener('input', function() {
            if (passwordWrap.classList.contains('invalid') && passwordInput.value.length >= 6) {
                setFieldState(passwordWrap, passwordError, true);
            }
        });

        companyInput.addEventListener('input', function() {
            if (companyWrap.classList.contains('invalid') && companyInput.value.trim().length > 0) {
                setFieldState(companyWrap, companyError, true);
            }
        });

        console.log('🏢 QuickData ProSoft - نظام إدارة الشركات');
        console.log('✅ النظام جاهز للعمل');
        console.log('📌 التسجيل متاح للشركات الجديدة فقط');
        console.log('📌 يتم إنشاء الشركة والمستخدم الأول كـ admin تلقائياً');
        console.log('🔒 في حال وجود جلسة نشطة، سيتم توجيهك للرئيسية');
    </script>

</body>
</html>
