<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>تسجيل الدخول - QuickData ProSoft</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Cormorant+Garamond:wght@500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <style>
        /* ==========================================================
           RESET & BASE
           ========================================================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --champagne: #e6d3a3;
            --champagne-light: #f5ecd2;
            --champagne-deep: #b8944f;
            --platinum: #c7cedb;
            --ink: #060810;
            --ink-2: #0b0e1a;
            --wave-1: rgba(230, 211, 163, 0.07);
            --wave-2: rgba(199, 206, 219, 0.04);
        }

        html { scroll-behavior: smooth; }

        body {
            font-family: 'Cairo', 'Segoe UI', Tahoma, Arial, sans-serif;
            direction: rtl;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow: hidden;
            position: relative;
            background: var(--ink);
        }

        /* ===== خلفية شبكية مالية دقيقة ===== */
        .bg-fabric {
            position: fixed;
            inset: 0;
            z-index: 0;
            background-image:
                linear-gradient(rgba(230, 211, 163, 0.035) 1px, transparent 1px),
                linear-gradient(90deg, rgba(230, 211, 163, 0.035) 1px, transparent 1px);
            background-size: 46px 46px;
            mask-image: radial-gradient(ellipse 70% 60% at 50% 35%, #000 20%, transparent 85%);
        }

        .bg-overlay {
            position: fixed;
            inset: 0;
            z-index: 1;
            background:
                radial-gradient(ellipse at 25% 15%, rgba(230, 211, 163, 0.10) 0%, transparent 50%),
                radial-gradient(ellipse at 78% 85%, rgba(199, 206, 219, 0.06) 0%, transparent 50%),
                linear-gradient(180deg, rgba(6, 8, 16, 0.75) 0%, rgba(6, 8, 16, 0.96) 100%);
        }

        /* ===== توهج ذهبي متحرك ===== */
        .golden-glow {
            position: fixed;
            inset: 0;
            z-index: 1;
            pointer-events: none;
            opacity: 0.35;
            background-image:
                repeating-conic-gradient(from 0deg at 20% 25%, transparent 0deg, var(--wave-1) 10deg, transparent 20deg),
                repeating-conic-gradient(from 45deg at 82% 75%, transparent 0deg, var(--wave-2) 12deg, transparent 24deg);
            filter: blur(46px);
            animation: glowDrift 22s ease-in-out infinite alternate;
        }

        @keyframes glowDrift {
            0%   { transform: translate(0, 0) rotate(0deg) scale(1); }
            50%  { transform: translate(-2%, 2%) rotate(4deg) scale(1.05); }
            100% { transform: translate(2%, -1%) rotate(-3deg) scale(1.02); }
        }

        /* ===== جسيمات دقيقة ===== */
        .particles {
            position: fixed;
            inset: 0;
            z-index: 1;
            pointer-events: none;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            width: 3px;
            height: 3px;
            background: rgba(230, 211, 163, 0.2);
            border-radius: 50%;
            animation: floatParticle linear infinite;
            box-shadow: 0 0 8px rgba(230, 211, 163, 0.3);
        }

        @keyframes floatParticle {
            0% { transform: translateY(100vh) scale(0); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-8vh) scale(1); opacity: 0; }
        }

        /* ===== الحاوية الرئيسية ===== */
        .login-wrapper {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 420px;
            perspective: 1400px;
            animation: fadeInUp 0.55s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes fadeInUp {
            0% { opacity: 0; transform: translateY(28px) scale(0.97); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* ===== البطاقة الزجاجية ===== */
        .login-container {
            background: rgba(255, 255, 255, 0.025);
            backdrop-filter: blur(36px);
            -webkit-backdrop-filter: blur(36px);
            border-radius: 26px;
            padding: 38px 34px 30px;
            border: 1px solid rgba(230, 211, 163, 0.08);
            box-shadow:
                0 30px 80px rgba(0, 0, 0, 0.55),
                inset 0 1px 0 rgba(255, 255, 255, 0.05);
            position: relative;
            overflow: hidden;
            transform-style: preserve-3d;
            transition: transform 0.08s linear, box-shadow 0.25s;
        }

        .login-container:hover {
            box-shadow:
                0 36px 90px rgba(0, 0, 0, 0.6),
                0 0 70px rgba(230, 211, 163, 0.05),
                inset 0 1px 0 rgba(255, 255, 255, 0.07);
        }

        /* ===== حدود متوهجة دوّارة ===== */
        .login-container::before {
            content: '';
            position: absolute;
            inset: -2px;
            border-radius: 26px;
            padding: 1.5px;
            background: conic-gradient(from 0deg,
                    transparent 0%, rgba(230, 211, 163, 0.06) 25%,
                    rgba(230, 211, 163, 0.22) 50%, rgba(230, 211, 163, 0.06) 75%,
                    transparent 100%);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
            animation: borderSpin 9s linear infinite;
        }

        @keyframes borderSpin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* ===== محتوى البطاقة ===== */
        .card-content { transform: translateZ(24px); position: relative; }

        /* ===== الشعار ===== */
        .logo-section {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 26px;
            animation: slideDown 0.4s cubic-bezier(0.16, 1, 0.3, 1) 0.05s both;
        }

        @keyframes slideDown {
            0% { opacity: 0; transform: translateY(-14px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .logo-icon {
            flex-shrink: 0;
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, var(--champagne-light), var(--champagne), var(--champagne-deep));
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
            color: var(--ink);
            box-shadow: 0 8px 26px rgba(230, 211, 163, 0.22);
            border: 1px solid rgba(230, 211, 163, 0.15);
            animation: logoFloat 4.5s ease-in-out infinite alternate;
            transition: transform 0.15s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.15s;
        }

        .logo-icon:hover {
            transform: scale(1.06) rotate(-3deg);
            box-shadow: 0 12px 36px rgba(230, 211, 163, 0.32);
        }

        @keyframes logoFloat {
            0% { transform: translateY(0); }
            100% { transform: translateY(-5px); }
        }

        .logo-text { flex: 1; }

        .logo-text h1 {
            font-family: 'Cormorant Garamond', 'Cairo', serif;
            font-size: 1.7rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--champagne-light), var(--champagne), var(--champagne-deep), var(--champagne));
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shimmer 5s ease-in-out infinite;
            line-height: 1.2;
            letter-spacing: 0.2px;
        }

        @keyframes shimmer {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .logo-text .subtitle {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: var(--platinum);
            opacity: 0.55;
            font-size: 0.66rem;
            font-weight: 700;
            letter-spacing: 1.4px;
            margin-top: 4px;
            text-transform: uppercase;
        }

        .logo-text .subtitle::before {
            content: '';
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: var(--champagne);
            box-shadow: 0 0 8px rgba(230, 211, 163, 0.7);
            animation: dotPulse 1.6s ease-in-out infinite;
        }

        @keyframes dotPulse {
            0%, 100% { opacity: 0.45; transform: scale(0.85); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        /* ===== حقوق الملكية ===== */
        .copyright {
            text-align: center;
            margin-top: 20px;
            padding-top: 16px;
            border-top: 1px solid rgba(230, 211, 163, 0.06);
            color: rgba(199, 206, 219, 0.2);
            font-size: 0.56rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            animation: slideUp 0.35s cubic-bezier(0.16, 1, 0.3, 1) 0.3s both;
        }

        .copyright i { margin: 0 4px; color: rgba(230, 211, 163, 0.2); }
        .copyright strong { color: rgba(230, 211, 163, 0.4); font-weight: 800; }
        .copyright .version { color: rgba(199, 206, 219, 0.14); font-weight: 400; font-size: 0.5rem; }

        /* ===== خيارات الدخول ===== */
        .social-label {
            text-align: center;
            font-size: 0.7rem;
            font-weight: 600;
            color: rgba(199, 206, 219, 0.3);
            margin-bottom: 12px;
        }

        .social-btns {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        .social-btns button {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            border: 1px solid rgba(230, 211, 163, 0.08);
            background: rgba(255, 255, 255, 0.03);
            color: rgba(199, 206, 219, 0.5);
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.15s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .social-btns button:hover {
            border-color: var(--champagne);
            background: rgba(230, 211, 163, 0.06);
            color: var(--champagne);
        }

        /* ===== الفاصل ===== */
        .divider {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 20px;
        }

        .divider span {
            font-size: 0.6rem;
            font-weight: 600;
            color: rgba(199, 206, 219, 0.2);
            white-space: nowrap;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: rgba(230, 211, 163, 0.06);
        }

        /* ===== حقول الإدخال ===== */
        .form-group {
            margin-bottom: 15px;
            position: relative;
            animation: slideUp 0.32s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
            transform: translateY(10px);
        }

        .form-group:nth-child(1) { animation-delay: 0.05s; }
        .form-group:nth-child(2) { animation-delay: 0.08s; }

        @keyframes slideUp { to { opacity: 1; transform: translateY(0); } }

        .form-group label {
            display: flex;
            align-items: center;
            gap: 8px;
            color: rgba(199, 206, 219, 0.4);
            font-size: 0.66rem;
            font-weight: 700;
            margin-bottom: 7px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            transition: color 0.1s;
        }

        .form-group:focus-within label { color: rgba(230, 211, 163, 0.75); }

        .form-group label i { font-size: 0.6rem; color: rgba(230, 211, 163, 0.25); }

        .input-wrap {
            position: relative;
            border-radius: 13px;
            background: rgba(255, 255, 255, 0.025);
            border: 1px solid rgba(230, 211, 163, 0.08);
            transition: border-color 0.1s, background 0.1s, box-shadow 0.1s, transform 0.1s;
            overflow: hidden;
        }

        .input-wrap:focus-within {
            border-color: rgba(230, 211, 163, 0.35);
            background: rgba(230, 211, 163, 0.045);
            box-shadow: 0 0 0 3.5px rgba(230, 211, 163, 0.06);
            transform: translateY(-1px);
        }

        .input-wrap .input-icon {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(199, 206, 219, 0.14);
            font-size: 0.8rem;
            transition: color 0.1s;
            z-index: 2;
        }

        .input-wrap:focus-within .input-icon { color: var(--champagne); }

        .input-wrap input {
            width: 100%;
            padding: 13px 44px 13px 44px;
            border: none;
            background: transparent;
            color: var(--champagne-light);
            font-size: 0.9rem;
            font-family: inherit;
            outline: none;
            position: relative;
            z-index: 1;
        }

        .input-wrap input::placeholder {
            color: rgba(199, 206, 219, 0.16);
            font-weight: 300;
        }

        /* ===== نسيت كلمة المرور ===== */
        .forgot {
            text-align: left;
            margin-bottom: 18px;
        }

        .forgot a {
            font-size: 0.7rem;
            font-weight: 600;
            color: rgba(199, 206, 219, 0.3);
            text-decoration: none;
            transition: color 0.15s;
        }

        .forgot a:hover {
            color: var(--champagne);
            text-decoration: underline;
        }

        /* ===== زر الدخول ===== */
        .btn-primary {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, var(--champagne-light), var(--champagne), var(--champagne-deep));
            background-size: 200% 100%;
            color: var(--ink);
            border: none;
            border-radius: 50px;
            font-weight: 800;
            font-size: 0.98rem;
            cursor: pointer;
            transition: background-position 0.2s, transform 0.08s, box-shadow 0.1s;
            font-family: inherit;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            position: relative;
            overflow: hidden;
            animation: slideUp 0.32s cubic-bezier(0.16, 1, 0.3, 1) 0.17s both;
            box-shadow: 0 6px 22px rgba(230, 211, 163, 0.18);
            margin-top: 6px;
        }

        .btn-primary:hover {
            background-position: 100% 0;
            transform: translateY(-2px);
            box-shadow: 0 14px 34px rgba(230, 211, 163, 0.3);
        }

        .btn-primary:active { transform: translateY(0) scale(0.97); }

        .btn-primary .ripple {
            position: absolute;
            border-radius: 50%;
            background: rgba(6, 8, 16, 0.3);
            transform: scale(0);
            animation: rippleAnim 0.4s ease-out;
            pointer-events: none;
        }

        @keyframes rippleAnim { to { transform: scale(3); opacity: 0; } }

        /* ===== التحميل ===== */
        .loading-spinner {
            display: none;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 14px;
            animation: slideUp 0.15s cubic-bezier(0.16, 1, 0.3, 1) both;
        }

        .loading-spinner .dots { display: flex; gap: 5px; }

        .loading-spinner .dots span {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--champagne);
            animation: dotBounce 0.9s ease-in-out infinite;
            box-shadow: 0 0 8px rgba(230, 211, 163, 0.45);
        }

        .loading-spinner .dots span:nth-child(2) { animation-delay: 0.12s; }
        .loading-spinner .dots span:nth-child(3) { animation-delay: 0.24s; }

        @keyframes dotBounce {
            0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
            30% { transform: translateY(-7px); opacity: 1; }
        }

        .loading-spinner span.label { color: rgba(199, 206, 219, 0.45); font-size: 0.8rem; font-weight: 600; }

        /* ===== رسائل الحالة ===== */
        .message {
            text-align: center;
            padding: 12px 16px;
            border-radius: 12px;
            margin-top: 14px;
            font-size: 0.8rem;
            display: none;
            align-items: center;
            justify-content: center;
            gap: 10px;
            animation: messagePop 0.2s cubic-bezier(0.16, 1, 0.3, 1) both;
            font-weight: 700;
        }

        @keyframes messagePop {
            0% { opacity: 0; transform: scale(0.94) translateY(-3px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }

        .message.success {
            display: flex;
            background: rgba(52, 211, 153, 0.08);
            color: #6ee7bf;
            border: 1px solid rgba(52, 211, 153, 0.16);
            backdrop-filter: blur(8px);
        }

        .message.error {
            display: flex;
            background: rgba(220, 60, 60, 0.06);
            color: #ff8080;
            border: 1px solid rgba(220, 60, 60, 0.14);
            backdrop-filter: blur(8px);
            animation: messagePop 0.2s cubic-bezier(0.16, 1, 0.3, 1) both, shake 0.3s ease 0.2s;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            50% { transform: translateX(5px); }
            75% { transform: translateX(-3px); }
        }

        .checkmark { width: 20px; height: 20px; flex-shrink: 0; }

        .checkmark circle {
            stroke: #6ee7bf;
            stroke-width: 2;
            fill: none;
            stroke-dasharray: 63;
            stroke-dashoffset: 63;
            animation: circleDraw 0.28s ease forwards;
        }

        .checkmark path {
            stroke: #6ee7bf;
            stroke-width: 2.5;
            stroke-linecap: round;
            stroke-linejoin: round;
            fill: none;
            stroke-dasharray: 20;
            stroke-dashoffset: 20;
            animation: checkDraw 0.2s ease 0.22s forwards;
        }

        @keyframes circleDraw { to { stroke-dashoffset: 0; } }
        @keyframes checkDraw { to { stroke-dashoffset: 0; } }

        /* ===== الروابط ===== */
        .links {
            text-align: center;
            margin-top: 18px;
            animation: slideUp 0.32s cubic-bezier(0.16, 1, 0.3, 1) 0.2s both;
            color: rgba(199, 206, 219, 0.14);
            font-size: 0.68rem;
            font-weight: 600;
            letter-spacing: 0.3px;
        }

        .links a {
            color: var(--champagne);
            text-decoration: none;
            transition: color 0.1s;
            font-weight: 700;
        }

        .links a:hover { color: var(--champagne-light); text-decoration: underline; }

        .links .system-name i { color: rgba(230, 211, 163, 0.15); margin: 0 4px; }

        /* ===== إمكانية الوصول ===== */
        a:focus-visible, button:focus-visible, input:focus-visible {
            outline: 2px solid rgba(230, 211, 163, 0.55);
            outline-offset: 2px;
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 480px) {
            .login-container { padding: 24px 18px 20px; border-radius: 22px; }
            .logo-section { gap: 12px; margin-bottom: 22px; }
            .logo-icon { width: 48px; height: 48px; font-size: 1.35rem; border-radius: 13px; }
            .logo-text h1 { font-size: 1.35rem; }
            .input-wrap input { padding: 12px 38px 12px 38px; font-size: 0.85rem; }
            .input-wrap .input-icon { right: 12px; font-size: 0.7rem; }
            .btn-primary { padding: 12px; font-size: 0.87rem; }
            .links { font-size: 0.58rem; }
            .copyright { font-size: 0.5rem; margin-top: 16px; padding-top: 12px; }
            .social-btns button { width: 38px; height: 38px; font-size: 0.85rem; }
        }

        @media (max-width: 380px) {
            .login-container { padding: 18px 12px 16px; border-radius: 18px; }
            .logo-icon { width: 40px; height: 40px; font-size: 1.15rem; border-radius: 11px; }
            .logo-text h1 { font-size: 1.15rem; }
            .input-wrap input { padding: 10px 34px 10px 34px; font-size: 0.8rem; }
            .btn-primary { padding: 10px; font-size: 0.82rem; }
        }

        @media (min-width: 769px) {
            .login-container { padding: 46px 42px 34px; border-radius: 30px; }
            .logo-icon { width: 68px; height: 68px; font-size: 1.9rem; border-radius: 18px; }
            .logo-text h1 { font-size: 1.95rem; }
        }

        ::-webkit-scrollbar { width: 3px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(230, 211, 163, 0.18); border-radius: 50px; }
    </style>
</head>
<body>

    <div class="bg-fabric"></div>
    <div class="bg-overlay"></div>
    <div class="golden-glow"></div>
    <div class="particles" id="particles"></div>

    <!-- ===== الحاوية الرئيسية ===== -->
    <div class="login-wrapper" id="loginWrapper">

        <div class="login-container" id="loginCard">
            <div class="card-content">

                <!-- ===== الشعار ===== -->
                <div class="logo-section">
                    <div class="logo-icon"><i class="fa-solid fa-building-columns"></i></div>
                    <div class="logo-text">
                        <h1>نظام إدارة الشركات</h1>
                        <div class="subtitle">تسجيل الدخول</div>
                    </div>
                </div>

                <!-- ===== خيارات الدخول ===== -->
                <div class="social-label">أو استخدم</div>
                <div class="social-btns">
                    <button onclick="alert('جاري التوجيه إلى جوجل...')"><i class="fab fa-google"></i></button>
                    <button onclick="alert('جاري التوجيه إلى فيسبوك...')"><i class="fab fa-facebook-f"></i></button>
                    <button onclick="alert('جاري التوجيه إلى مايكروسوفت...')"><i class="fab fa-microsoft"></i></button>
                </div>

                <!-- ===== الفاصل ===== -->
                <div class="divider">
                    <span>أو</span>
                </div>

                <!-- ===== نموذج تسجيل الدخول ===== -->
                <form id="loginForm">

                    <div class="form-group">
                        <label><i class="fas fa-envelope"></i> البريد الإلكتروني</label>
                        <div class="input-wrap">
                            <i class="fas fa-envelope input-icon"></i>
                            <input type="email" id="email" placeholder="admin@company.com" required autocomplete="email" />
                        </div>
                    </div>

                    <div class="form-group">
                        <label><i class="fas fa-lock"></i> كلمة المرور</label>
                        <div class="input-wrap">
                            <i class="fas fa-key input-icon"></i>
