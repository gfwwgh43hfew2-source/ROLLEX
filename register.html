<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>تسجيل الدخول - QuickData ProSoft</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background: #f5f2ed;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            direction: rtl;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 380px;
        }

        /* ===== البطاقة ===== */
        .card {
            background: #ffffff;
            border-radius: 18px;
            padding: 36px 28px 28px;
            box-shadow: 0 2px 16px rgba(0, 0, 0, 0.04);
            border: 1px solid #e8e4de;
        }

        /* ===== الشعار ===== */
        .brand {
            text-align: center;
            margin-bottom: 22px;
        }

        .brand-icon {
            width: 52px;
            height: 52px;
            background: #1a2634;
            border-radius: 14px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-weight: 800;
            font-size: 1.1rem;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        .brand h1 {
            font-size: 1.2rem;
            font-weight: 800;
            color: #1a2634;
            letter-spacing: -0.3px;
        }

        .brand p {
            color: #8a94a6;
            font-size: 0.8rem;
            font-weight: 400;
            margin-top: 2px;
        }

        /* ===== خيارات الدخول ===== */
        .social-label {
            text-align: center;
            font-size: 0.7rem;
            font-weight: 600;
            color: #8a94a6;
            margin-bottom: 12px;
        }

        .social-btns {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        .social-btns button {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            border: 1.5px solid #e8e4de;
            background: #ffffff;
            color: #4a5568;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .social-btns button:hover {
            border-color: #c9b8a4;
            background: #faf8f6;
        }

        /* ===== الفاصل ===== */
        .divider {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 18px;
        }

        .divider span {
            font-size: 0.6rem;
            font-weight: 600;
            color: #b0b8c6;
            white-space: nowrap;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: #e8e4de;
        }

        /* ===== الحقول ===== */
        .field {
            margin-bottom: 14px;
        }

        .field label {
            display: block;
            font-size: 0.7rem;
            font-weight: 700;
            color: #3d4a5c;
            margin-bottom: 4px;
        }

        .field .input-wrap {
            position: relative;
            border: 1.5px solid #e8e4de;
            border-radius: 10px;
            background: #faf8f6;
            transition: border-color 0.2s;
        }

        .field .input-wrap:focus-within {
            border-color: #c9b8a4;
            background: #ffffff;
        }

        .field .input-wrap input {
            width: 100%;
            padding: 11px 14px;
            border: none;
            background: transparent;
            font-size: 0.85rem;
            font-family: inherit;
            color: #1a2634;
            outline: none;
            border-radius: 10px;
        }

        .field .input-wrap input::placeholder {
            color: #c5ccd6;
            font-weight: 400;
        }

        /* ===== نسيت كلمة المرور ===== */
        .forgot {
            text-align: left;
            margin-bottom: 18px;
        }

        .forgot a {
            font-size: 0.7rem;
            font-weight: 600;
            color: #8a94a6;
            text-decoration: none;
        }

        .forgot a:hover {
            color: #1a2634;
            text-decoration: underline;
        }

        /* ===== الزر ===== */
        .btn {
            width: 100%;
            padding: 13px;
            background: #1a2634;
            color: #ffffff;
            border: none;
            border-radius: 50px;
            font-size: 0.9rem;
            font-weight: 700;
            font-family: inherit;
            cursor: pointer;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn:hover {
            background: #0f1822;
        }

        .btn:active {
            transform: scale(0.98);
        }

        /* ===== رسائل ===== */
        .message {
            margin-top: 14px;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 0.75rem;
            font-weight: 600;
            display: none;
            text-align: center;
        }

        .message.show {
            display: block;
        }

        .message.error {
            background: #fde8e8;
            color: #b33636;
            border: 1px solid #f5cfcf;
        }

        /* ===== التحميل ===== */
        .spinner {
            display: none;
            justify-content: center;
            gap: 6px;
            padding: 8px 0;
        }

        .spinner.show {
            display: flex;
        }

        .spinner span {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #1a2634;
            animation: bounce 1s ease-in-out infinite;
        }

        .spinner span:nth-child(2) {
            animation-delay: 0.15s;
        }
        .spinner span:nth-child(3) {
            animation-delay: 0.3s;
        }

        @keyframes bounce {
            0%,
            80%,
            100% {
                transform: scale(0.6);
                opacity: 0.4;
            }
            40% {
                transform: scale(1);
                opacity: 1;
            }
        }

        /* ===== رابط التسجيل ===== */
        .register-link {
            text-align: center;
            margin-top: 16px;
            font-size: 0.75rem;
            color: #8a94a6;
            font-weight: 500;
        }

        .register-link a {
            color: #1a2634;
            font-weight: 700;
            text-decoration: none;
        }

        .register-link a:hover {
            text-decoration: underline;
        }

        /* ===== التذييل ===== */
        .footer {
            text-align: center;
            margin-top: 20px;
            padding-top: 14px;
            border-top: 1px solid #e8e4de;
            font-size: 0.55rem;
            font-weight: 600;
            color: #b0b8c6;
        }

        .footer strong {
            color: #1a2634;
            font-weight: 700;
        }

        @media (max-width: 400px) {
            .card {
                padding: 28px 18px 22px;
            }
            .brand-icon {
                width: 44px;
                height: 44px;
                font-size: 0.9rem;
            }
            .brand h1 {
                font-size: 1rem;
            }
            .social-btns button {
                width: 38px;
                height: 38px;
                font-size: 0.85rem;
            }
            .field .input-wrap input {
                font-size: 0.8rem;
                padding: 10px 12px;
            }
            .btn {
                padding: 12px;
                font-size: 0.85rem;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="card">

            <!-- ===== الشعار ===== -->
            <div class="brand">
                <div class="brand-icon">QD</div>
                <h1>مرحباً بك</h1>
                <p>سجل دخولك للوصول إلى لوحة التحكم</p>
            </div>

            <!-- ===== خيارات الدخول ===== -->
            <div class="social-label">أو استخدم</div>
            <div class="social-btns">
                <button onclick="alert('جاري التوجيه إلى جوجل...')"><i class="fab fa-google"></i></button>
                <button onclick="alert('جاري التوجيه إلى فيسبوك...')"><i class="fab fa-facebook-f"></i></button>
                <button onclick="alert('جاري التوجيه إلى جيت هب...')"><i class="fab fa-github"></i></button>
            </div>

            <!-- ===== الفاصل ===== -->
            <div class="divider">
                <span>أو</span>
            </div>

            <!-- ===== النموذج ===== -->
            <form id="loginForm">

                <div class="field">
                    <label>البريد الإلكتروني</label>
                    <div class="input-wrap">
                        <input type="email" id="email" placeholder="admin@company.com" required autocomplete="email" />
                    </div>
                </div>

                <div class="field">
                    <label>كلمة المرور</label>
                    <div class="input-wrap">
                        <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password" />
                    </div>
                </div>

                <div class="forgot">
                    <a href="#">نسيت كلمة المرور؟</a>
                </div>

                <button type="submit" class="btn" id="loginBtn">
                    دخول
                </button>

                <div class="spinner" id="loadingSpinner">
                    <span></span><span></span><span></span>
                </div>

                <div class="message" id="message"></div>
            </form>

            <!-- ===== رابط التسجيل ===== -->
            <div class="register-link">
                ليس لديك حساب؟ <a href="register.html">سجل الآن</a>
            </div>

            <!-- ===== التذييل ===== -->
            <div class="footer">
                <i class="fas fa-copyright"></i> 2026
                <strong>QuickData ProSoft</strong>
                <span style="color:#c5ccd6;font-weight:400;">v3.0</span>
            </div>

        </div>
    </div>

    <script>
        var SUPABASE_URL = 'https://ykkhkgajzyxsgoamtmnn.supabase.co';
        var SUPABASE_ANON_KEY = 'sb_publishable_NOH7uJlEoPf6wcT87DNBug_izzR-4VF';

        var form = document.getElementById('loginForm');
        var msg = document.getElementById('message');
        var spinner = document.getElementById('loadingSpinner');
        var btn = document.getElementById('loginBtn');

        function showMessage(text, type) {
            msg.textContent = text;
            msg.className = 'message show ' + type;
        }

        function hideMessage() {
            msg.className = 'message';
            msg.textContent = '';
        }

        form.addEventListener('submit', async function(e) {
            e.preventDefault();

            var email = document.getElementById('email').value.trim();
            var password = document.getElementById('password').value;

            if (!email || !password) {
                showMessage('الرجاء ملء جميع الحقول', 'error');
                return;
            }

            btn.style.display = 'none';
            spinner.classList.add('show');
            hideMessage();

            try {
                var res = await fetch(SUPABASE_URL + '/auth/v1/token?grant_type=password', {
                    method: 'POST',
                    headers: {
                        'apikey': SUPABASE_ANON_KEY,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email: email, password: password })
                });

                var data = await res.json();

                if (!res.ok) {
                    throw new Error(data.msg || data.message || 'بيانات الدخول غير صحيحة');
                }

                localStorage.setItem('rollex_session', JSON.stringify(data));
                window.location.href = 'index.html';

            } catch (error) {
                showMessage('❌ ' + error.message, 'error');
            }

            btn.style.display = 'flex';
            spinner.classList.remove('show');
        });

        console.log('🔐 QuickData ProSoft - تسجيل الدخول');
    </script>

</body>
</html>
