<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5" />
    <title>الخزائن - QuickData ProSoft</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- ===== إضافة الملف المركزي ===== -->
    <script src="supabase-client.js"></script>
    <style>
        /* ==========================================================
           RESET & BASE - LIGHT THEME
           ========================================================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --gold: #c9a84c;
            --gold-light: #dbb95c;
            --gold-deep: #b8942a;
            --gold-bg: rgba(201, 168, 76, 0.08);
            --gold-gradient: linear-gradient(135deg, #dbb95c, #c9a84c, #b8942a);
            --bg-body: #f5f7fa;
            --bg-card: #ffffff;
            --bg-card-hover: #fafbfc;
            --bg-field: #f0f2f5;
            --border-color: #e8ecf1;
            --border-hover: #d0d5dd;
            --text-primary: #1a2332;
            --text-secondary: #4a5a6e;
            --text-muted: #8a96a8;
            --text-faint: #b0b8c4;
            --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.04);
            --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 12px 48px rgba(0, 0, 0, 0.08);
            --shadow-xl: 0 20px 60px rgba(0, 0, 0, 0.10);
            --danger: #dc3545;
            --success: #28a745;
            --danger-bg: rgba(220, 53, 69, 0.06);
            --success-bg: rgba(40, 167, 69, 0.06);
            --radius: 16px;
            --radius-sm: 10px;
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        html { scroll-behavior: smooth; }

        body {
            font-family: 'Cairo', 'Segoe UI', Tahoma, Arial, sans-serif;
            direction: rtl;
            min-height: 100vh;
            background: var(--bg-body);
            color: var(--text-primary);
            padding: 0;
            margin: 0;
        }

        /* ==========================================================
           TOP NAVIGATION
           ========================================================== */
        .top-nav {
            background: var(--bg-card);
            border-bottom: 1px solid var(--border-color);
            padding: 0 24px;
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: var(--shadow-sm);
        }

        .top-nav .logo-area {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .top-nav .logo-area .logo-icon {
            width: 40px;
            height: 40px;
            background: var(--gold-gradient);
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            color: #fff;
            font-weight: 900;
        }

        .top-nav .logo-area h1 {
            font-size: 1.2rem;
            font-weight: 800;
            color: var(--text-primary);
        }

        .top-nav .logo-area h1 span {
            color: var(--gold);
        }

        .top-nav .nav-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .top-nav .nav-actions .user-badge {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 6px 14px 6px 6px;
            background: var(--bg-field);
            border-radius: 50px;
            border: 1px solid var(--border-color);
        }

        .top-nav .nav-actions .user-badge .avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: var(--gold-gradient);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-weight: 700;
            font-size: 0.7rem;
        }

        .top-nav .nav-actions .user-badge .user-info {
            display: flex;
            flex-direction: column;
        }

        .top-nav .nav-actions .user-badge .user-info .name {
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--text-primary);
            line-height: 1.2;
        }

        .top-nav .nav-actions .user-badge .user-info .role {
            font-size: 0.55rem;
            font-weight: 600;
            color: var(--text-muted);
        }

        .top-nav .nav-actions .btn-icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 1px solid var(--border-color);
            background: var(--bg-card);
            color: var(--text-secondary);
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
        }

        .top-nav .nav-actions .btn-icon:hover {
            background: var(--bg-field);
            border-color: var(--border-hover);
            transform: translateY(-1px);
        }

        .top-nav .nav-actions .btn-icon.gold {
            background: var(--gold-gradient);
            color: #fff;
            border: none;
        }

        .top-nav .nav-actions .btn-icon.gold:hover {
            box-shadow: 0 4px 16px rgba(201, 168, 76, 0.35);
            transform: translateY(-2px);
        }

        /* ==========================================================
           PAGE HEADER
           ========================================================== */
        .page-header {
            padding: 30px 24px 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .page-header .breadcrumb {
            font-size: 0.7rem;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .page-header .breadcrumb span { color: var(--gold); }

        .page-header .title-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
        }

        .page-header .title-section h2 {
            font-size: 1.8rem;
            font-weight: 900;
            color: var(--text-primary);
        }

        .page-header .title-section h2 i {
            color: var(--gold);
            margin-left: 12px;
        }

        .page-header .title-section .actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .page-header .title-section .actions .btn-primary {
            padding: 10px 24px;
            background: var(--gold-gradient);
            color: #fff;
            border: none;
            border-radius: var(--radius-sm);
            font-weight: 700;
            font-size: 0.8rem;
            cursor: pointer;
            transition: var(--transition);
            font-family: inherit;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 16px rgba(201, 168, 76, 0.25);
        }

        .page-header .title-section .actions .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(201, 168, 76, 0.35);
        }

        .page-header .title-section .actions .btn-secondary {
            padding: 10px 20px;
            background: var(--bg-card);
            color: var(--text-secondary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            font-weight: 600;
            font-size: 0.8rem;
            cursor: pointer;
            transition: var(--transition);
            font-family: inherit;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .page-header .title-section .actions .btn-secondary:hover {
            background: var(--bg-field);
            border-color: var(--border-hover);
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        /* ==========================================================
           STATS ROW
           ========================================================== */
        .stats-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            padding: 0 24px 24px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .stat-card {
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 20px 24px;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-sm);
            transition: var(--transition);
            position: relative;
            overflow: hidden;
        }

        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 4px;
            height: 100%;
            background: var(--gold);
            opacity: 0.6;
        }

        .stat-card:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow-md);
        }

        .stat-card .stat-label {
            font-size: 0.65rem;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .stat-card .stat-value {
            font-size: 1.6rem;
            font-weight: 900;
            color: var(--text-primary);
            margin-top: 4px;
        }

        .stat-card .stat-value.gold { color: var(--gold); }
        .stat-card .stat-value.green { color: var(--success); }
        .stat-card .stat-value.red { color: var(--danger); }

        .stat-card .stat-icon {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 2.2rem;
            color: var(--text-faint);
            opacity: 0.15;
        }

        /* ==========================================================
           FILTER BAR
           ========================================================== */
        .filter-bar {
            display: flex;
            gap: 12px;
            padding: 0 24px 20px;
            max-width: 1200px;
            margin: 0 auto;
            flex-wrap: wrap;
            align-items: center;
        }

        .filter-bar .search-box {
            flex: 1;
            min-width: 200px;
            position: relative;
        }

        .filter-bar .search-box input {
            width: 100%;
            padding: 10px 16px 10px 44px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-color);
            background: var(--bg-card);
            color: var(--text-primary);
            font-size: 0.85rem;
            font-family: inherit;
            outline: none;
            transition: var(--transition);
        }

        .filter-bar .search-box input:focus {
            border-color: var(--gold);
            box-shadow: 0 0 0 3px rgba(201, 168, 76, 0.12);
        }

        .filter-bar .search-box input::placeholder {
            color: var(--text-faint);
        }

        .filter-bar .search-box .search-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
        }

        .filter-bar .filter-group {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .filter-bar .filter-group select {
            padding: 10px 14px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-color);
            background: var(--bg-card);
            color: var(--text-primary);
            font-size: 0.8rem;
            font-family: inherit;
            outline: none;
            cursor: pointer;
            transition: var(--transition);
            min-width: 130px;
        }

        .filter-bar .filter-group select:focus {
            border-color: var(--gold);
        }

        /* ==========================================================
           TREASURY GRID
           ========================================================== */
        .treasury-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
            padding: 0 24px 40px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .treasury-card {
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 24px 28px;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-sm);
            transition: all var(--transition);
            cursor: pointer;
            position: relative;
        }

        .treasury-card:hover {
            border-color: var(--gold-light);
            transform: translateY(-6px);
            box-shadow: var(--shadow-xl);
        }

        .treasury-card .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 14px;
        }

        .treasury-card .card-header .icon-wrapper {
            width: 48px;
            height: 48px;
            border-radius: var(--radius-sm);
            background: var(--gold-bg);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            color: var(--gold);
            transition: var(--transition);
        }

        .treasury-card:hover .card-header .icon-wrapper {
            background: var(--gold-gradient);
            color: #fff;
            transform: scale(1.05);
        }

        .treasury-card .card-header .badge {
            padding: 4px 14px;
            border-radius: 50px;
            font-size: 0.55rem;
            font-weight: 700;
            text-transform: uppercase;
            background: var(--bg-field);
            color: var(--text-muted);
            border: 1px solid var(--border-color);
        }

        .treasury-card .card-header .badge.active {
            background: var(--success-bg);
            color: var(--success);
            border-color: rgba(40, 167, 69, 0.1);
        }

        .treasury-card .card-body .card-name {
            font-size: 1.15rem;
            font-weight: 800;
            color: var(--text-primary);
            margin-bottom: 4px;
        }

        .treasury-card .card-body .card-desc {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-bottom: 16px;
        }

        .treasury-card .card-body .balance-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 16px;
            border-top: 1px solid var(--border-color);
        }

        .treasury-card .card-body .balance-section .balance-label {
            font-size: 0.6rem;
            color: var(--text-muted);
            font-weight: 600;
            text-transform: uppercase;
        }

        .treasury-card .card-body .balance-section .balance-amount {
            font-size: 1.4rem;
            font-weight: 900;
            color: var(--gold);
        }

        .treasury-card .card-body .balance-section .treasury-type {
            font-size: 0.6rem;
            color: var(--text-muted);
            background: var(--bg-field);
            padding: 4px 12px;
            border-radius: 50px;
            border: 1px solid var(--border-color);
        }

        .treasury-card .card-footer {
            display: flex;
            gap: 10px;
            margin-top: 18px;
            padding-top: 16px;
            border-top: 1px solid var(--border-color);
        }

        .treasury-card .card-footer .btn-sm {
            padding: 8px 16px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-color);
            background: var(--bg-card);
            font-family: inherit;
            font-size: 0.65rem;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition);
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: var(--text-secondary);
            flex: 1;
            justify-content: center;
        }

        .treasury-card .card-footer .btn-sm.primary {
            background: var(--gold-gradient);
            color: #fff;
            border: none;
        }

        .treasury-card .card-footer .btn-sm.primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 16px rgba(201, 168, 76, 0.3);
        }

        .treasury-card .card-footer .btn-sm.secondary:hover {
            background: var(--bg-field);
            border-color: var(--border-hover);
        }

        .treasury-card .card-footer .btn-sm.danger {
            border-color: rgba(220, 53, 69, 0.1);
            color: var(--danger);
            background: var(--danger-bg);
        }

        .treasury-card .card-footer .btn-sm.danger:hover {
            background: rgba(220, 53, 69, 0.12);
        }

        /* ==========================================================
           EMPTY STATE
           ========================================================== */
        .empty-state {
            text-align: center;
            padding: 80px 20px;
            color: var(--text-muted);
            grid-column: 1 / -1;
        }

        .empty-state .empty-icon {
            font-size: 4rem;
            color: var(--text-faint);
            opacity: 0.2;
            margin-bottom: 16px;
        }

        .empty-state h3 {
            font-size: 1.3rem;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }

        .empty-state p {
            font-size: 0.85rem;
            max-width: 400px;
            margin: 0 auto 20px;
        }

        .empty-state a {
            color: var(--gold);
            text-decoration: none;
            font-weight: 700;
            padding: 10px 24px;
            background: var(--gold-bg);
            border-radius: var(--radius-sm);
            transition: var(--transition);
            display: inline-block;
        }

        .empty-state a:hover {
            background: var(--gold-gradient);
            color: #fff;
            transform: translateY(-2px);
            box-shadow: 0 4px 16px rgba(201, 168, 76, 0.3);
        }

        /* ==========================================================
           TOAST
           ========================================================== */
        .toast-container {
            position: fixed;
            top: 80px;
            right: 24px;
            z-index: 99999;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .toast {
            background: var(--bg-card);
            padding: 14px 20px;
            border-radius: var(--radius-sm);
            border-right: 4px solid var(--gold);
            box-shadow: var(--shadow-lg);
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 280px;
            animation: slideIn 0.3s ease;
            border: 1px solid var(--border-color);
        }

        .toast.success { border-right-color: var(--success); }
        .toast.error { border-right-color: var(--danger); }

        .toast .icon { font-size: 1.1rem; }
        .toast .icon.success { color: var(--success); }
        .toast .icon.error { color: var(--danger); }

        .toast .content .title { font-size: 0.8rem; font-weight: 700; color: var(--text-primary); }
        .toast .content .message { font-size: 0.7rem; color: var(--text-muted); }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(20px); }
            to { opacity: 1; transform: translateX(0); }
        }

        /* ==========================================================
           RESPONSIVE
           ========================================================== */
        @media (max-width: 768px) {
            .top-nav { padding: 0 16px; height: 60px; }
            .top-nav .logo-area h1 { font-size: 1rem; }
            .top-nav .nav-actions .user-badge .user-info { display: none; }

            .page-header { padding: 20px 16px; }
            .page-header .title-section h2 { font-size: 1.4rem; }

            .stats-row { padding: 0 16px 16px; gap: 12px; }
            .stats-row { grid-template-columns: repeat(2, 1fr); }

            .filter-bar { padding: 0 16px 16px; flex-direction: column; }
            .filter-bar .search-box { width: 100%; }
            .filter-bar .filter-group { width: 100%; }
            .filter-bar .filter-group select { flex: 1; min-width: 0; }

            .treasury-grid { padding: 0 16px 30px; gap: 14px; grid-template-columns: 1fr; }
        }

        @media (max-width: 480px) {
            .stats-row { grid-template-columns: 1fr; }
            .page-header .title-section { flex-direction: column; align-items: stretch; }
            .page-header .title-section .actions { flex-direction: column; }
            .page-header .title-section .actions .btn-primary,
            .page-header .title-section .actions .btn-secondary { width: 100%; justify-content: center; }

            .treasury-card .card-footer { flex-direction: column; }
            .treasury-card .card-footer .btn-sm { flex: none; }
        }
    </style>
</head>
<body>

    <!-- ==========================================================
    TOP NAVIGATION
    ========================================================== -->
    <nav class="top-nav">
        <div class="logo-area">
            <div class="logo-icon">Q</div>
            <h1>Quick<span>Data</span></h1>
        </div>
        <div class="nav-actions">
            <div class="user-badge">
                <div class="avatar" id="userAvatar">أ</div>
                <div class="user-info">
                    <span class="name" id="userName">مرحباً</span>
                    <span class="role" id="userRole">مدير النظام</span>
                </div>
            </div>
            <button class="btn-icon gold" onclick="window.location.href='treasury-add.html'" title="خزينة جديدة">
                <i class="fas fa-plus"></i>
            </button>
            <button class="btn-icon" onclick="window.location.href='index.html'" title="الرئيسية">
                <i class="fas fa-home"></i>
            </button>
            <button class="btn-icon" onclick="logout()" title="تسجيل الخروج">
                <i class="fas fa-sign-out-alt"></i>
            </button>
        </div>
    </nav>

    <!-- ==========================================================
    PAGE HEADER
    ========================================================== -->
    <div class="page-header">
        <div class="breadcrumb">الرئيسية <i class="fas fa-chevron-left" style="font-size:0.5rem;margin:0 6px;"></i> <span>الخزائن</span></div>
        <div class="title-section">
            <h2><i class="fas fa-university"></i> الخزائن</h2>
            <div class="actions">
                <button class="btn-secondary" onclick="loadData()">
                    <i class="fas fa-sync-alt"></i> تحديث
                </button>
                <button class="btn-primary" onclick="window.location.href='treasury-add.html'">
                    <i class="fas fa-plus"></i> خزينة جديدة
                </button>
            </div>
        </div>
    </div>

    <!-- ==========================================================
    STATS ROW
    ========================================================== -->
    <div class="stats-row">
        <div class="stat-card">
            <div class="stat-icon"><i class="fas fa-university"></i></div>
            <div class="stat-label">إجمالي الخزائن</div>
            <div class="stat-value gold" id="totalTreasuries">0</div>
        </div>
        <div class="stat-card">
            <div class="stat-icon"><i class="fas fa-wallet"></i></div>
            <div class="stat-label">إجمالي الرصيد</div>
            <div class="stat-value green" id="totalBalance">0 ج.م</div>
        </div>
        <div class="stat-card">
            <div class="stat-icon"><i class="fas fa-check-circle"></i></div>
            <div class="stat-label">الخزائن النشطة</div>
            <div class="stat-value" id="activeTreasuries">0</div>
        </div>
    </div>

    <!-- ==========================================================
    FILTER BAR
    ========================================================== -->
    <div class="filter-bar">
        <div class="search-box">
            <span class="search-icon"><i class="fas fa-search"></i></span>
            <input type="text" id="searchInput" placeholder="ابحث عن خزينة..." onkeyup="filterTreasuries()" />
        </div>
        <div class="filter-group">
            <select id="typeFilter" onchange="filterTreasuries()">
                <option value="">جميع الأنواع</option>
                <option value="main">رئيسية</option>
                <option value="accountant">محاسب</option>
                <option value="driver">سائق</option>
                <option value="custom">مخصصة</option>
            </select>
            <select id="statusFilter" onchange="filterTreasuries()">
                <option value="">جميع الحالات</option>
                <option value="true">نشطة</option>
                <option value="false">غير نشطة</option>
            </select>
        </div>
    </div>

    <!-- ==========================================================
    TREASURY GRID
    ========================================================== -->
    <div class="treasury-grid" id="treasuryGrid">
        <!-- يتم التحميل عبر JavaScript -->
    </div>

    <!-- ==========================================================
    TOAST
    ========================================================== -->
    <div class="toast-container" id="toastContainer"></div>

    <script>
        /**
         * ============================================================
         * CONFIGURATION (مأخوذة من supabase-client.js)
         * ============================================================
         */
        var SUPABASE_URL = 'https://ykkhkgajzyxsgoamtmnn.supabase.co';
        var SUPABASE_ANON_KEY = 'sb_publishable_NOH7uJlEoPf6wcT87DNBug_izzR-4VF';

        /**
         * ============================================================
         * DEBUG MODE
         * ============================================================
         */
        var DEBUG_MODE = false;

        function debugLog(message, type, data) {
            if (!DEBUG_MODE) return;
            var prefix = '🔍 [DEBUG]';
            var icon = '📌';
            switch(type) {
                case 'success': prefix = '✅ [SUCCESS]'; icon = '✅'; break;
                case 'error': prefix = '❌ [ERROR]'; icon = '❌'; break;
                case 'warning': prefix = '⚠️ [WARNING]'; icon = '⚠️'; break;
                case 'info': prefix = 'ℹ️ [INFO]'; icon = 'ℹ️'; break;
                default: prefix = '🔍 [DEBUG]'; icon = '🔍';
            }
            if (data) {
                console.log(icon + ' ' + prefix + ' - ' + message, data);
            } else {
                console.log(icon + ' ' + prefix + ' - ' + message);
            }
        }

        /**
         * ============================================================
         * GET COMPANY TREASURIES - باستخدام getTable من الملف المركزي
         * ============================================================
         */
        async function getTreasuries(companyId) {
            try {
                var data = await getTable('treasuries', 'created_at.desc');
                return data || [];
            } catch (error) {
                debugLog('❌ فشل جلب الخزائن:', 'error', error);
                return [];
            }
        }

        /**
         * ============================================================
         * DELETE TREASURY - باستخدام deleteRows من الملف المركزي
         * ============================================================
         */
        async function deleteTreasury(id) {
            await deleteRows('treasuries', 'id', id);
            return true;
        }

        /**
         * ============================================================
         * FILTER TREASURIES
         * ============================================================
         */
        function filterTreasuries() {
            var search = document.getElementById('searchInput').value.toLowerCase();
            var typeFilter = document.getElementById('typeFilter').value;
            var statusFilter = document.getElementById('statusFilter').value;

            var cards = document.querySelectorAll('.treasury-card');
            var visibleCount = 0;

            cards.forEach(function(card) {
                var name = card.getAttribute('data-name') || '';
                var desc = card.getAttribute('data-desc') || '';
                var type = card.getAttribute('data-type') || '';
                var isActive = card.getAttribute('data-active') === 'true';

                var matchSearch = name.includes(search) || desc.includes(search);
                var matchType = !typeFilter || type === typeFilter;
                var matchStatus = !statusFilter || String(isActive) === statusFilter;

                if (matchSearch && matchType && matchStatus) {
                    card.style.display = '';
                    visibleCount++;
                } else {
                    card.style.display = 'none';
                }
            });

            var grid = document.getElementById('treasuryGrid');
            var emptyMsg = grid.querySelector('.empty-state-msg');
            if (visibleCount === 0) {
                if (!emptyMsg) {
                    var msg = document.createElement('div');
                    msg.className = 'empty-state empty-state-msg';
                    msg.innerHTML = `
                        <div class="empty-icon"><i class="fas fa-search"></i></div>
                        <h3>لا توجد نتائج</h3>
                        <p>حاول تغيير كلمات البحث أو الفلاتر</p>
                    `;
                    grid.appendChild(msg);
                }
            } else {
                if (emptyMsg) emptyMsg.remove();
            }
        }

        /**
         * ============================================================
         * RENDER TREASURIES
         * ============================================================
         */
        function renderTreasuries(treasuries) {
            var grid = document.getElementById('treasuryGrid');
            var totalBalance = 0;
            var activeCount = 0;

            treasuries.forEach(function(t) {
                totalBalance += (t.balance || 0);
                if (t.is_active !== false) activeCount++;
            });

            document.getElementById('totalTreasuries').textContent = treasuries.length;
            document.getElementById('totalBalance').textContent = totalBalance.toLocaleString() + ' ج.م';
            document.getElementById('activeTreasuries').textContent = activeCount;

            if (treasuries.length === 0) {
                grid.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon"><i class="fas fa-university"></i></div>
                        <h3>لا توجد خزائن</h3>
                        <p>قم بإضافة خزينة جديدة للبدء في إدارة أموالك</p>
                        <a href="treasury-add.html"><i class="fas fa-plus"></i> إضافة خزينة</a>
                    </div>
                `;
                return;
            }

            var html = '';
            var typeLabels = {
                'main': 'رئيسية',
                'accountant': 'محاسب',
                'driver': 'سائق',
                'custom': 'مخصصة'
            };
            var typeIcons = {
                'main': 'fa-building',
                'accountant': 'fa-calculator',
                'driver': 'fa-truck',
                'custom': 'fa-cog'
            };

            treasuries.forEach(function(t) {
                var isActive = t.is_active !== false;
                var typeLabel = typeLabels[t.type] || t.type || 'مخصصة';
                var typeIcon = typeIcons[t.type] || 'fa-university';

                html += `
                    <div class="treasury-card" 
                         data-id="${t.id}"
                         data-name="${(t.name || '').toLowerCase()}"
                         data-desc="${(t.description || '').toLowerCase()}"
                         data-type="${t.type || ''}"
                         data-active="${isActive}"
                         onclick="openTreasury('${t.id}')">
                        <div class="card-header">
                            <div class="icon-wrapper"><i class="fas ${typeIcon}"></i></div>
                            <span class="badge ${isActive ? 'active' : ''}">${isActive ? 'نشطة' : 'غير نشطة'}</span>
                        </div>
                        <div class="card-body">
                            <div class="card-name">${t.name || 'خزينة'}</div>
                            <div class="card-desc">${t.description || 'لا يوجد وصف'}</div>
                            <div class="balance-section">
                                <div>
                                    <div class="balance-label">الرصيد الحالي</div>
                                    <div class="balance-amount">${(t.balance || 0).toLocaleString()} ج.م</div>
                                </div>
                                <span class="treasury-type">${typeLabel}</span>
                            </div>
                        </div>
                        <div class="card-footer">
                            <a href="treasury.html?treasury_id=${t.id}" class="btn-sm primary" onclick="event.stopPropagation();">
                                <i class="fas fa-eye"></i> عرض
                            </a>
                            <button class="btn-sm secondary" onclick="event.stopPropagation();editTreasury('${t.id}')">
                                <i class="fas fa-edit"></i> تعديل
                            </button>
                            <button class="btn-sm danger" onclick="event.stopPropagation();deleteTreasuryConfirm('${t.id}')">
                                <i class="fas fa-trash-alt"></i>
                            </button>
                        </div>
                    </div>
                `;
            });

            grid.innerHTML = html;
        }

        /**
         * ============================================================
         * OPEN TREASURY
         * ============================================================
         */
        function openTreasury(id) {
            window.location.href = 'treasury.html?treasury_id=' + id;
        }

        /**
         * ============================================================
         * EDIT TREASURY
         * ============================================================
         */
        function editTreasury(id) {
            window.location.href = 'treasury-edit.html?treasury_id=' + id;
        }

        /**
         * ============================================================
         * DELETE TREASURY CONFIRM
         * ============================================================
         */
        async function deleteTreasuryConfirm(id) {
            if (!confirm('هل أنت متأكد من حذف هذه الخزينة؟')) return;

            try {
                await deleteTreasury(id);
                showToast('✅ تم الحذف', 'تم حذف الخزينة بنجاح', 'success');
                loadData();
            } catch (error) {
                console.error('❌ خطأ:', error);
                showToast('❌ خطأ', error.message, 'error');
            }
        }

        /**
         * ============================================================
         * LOAD DATA - باستخدام دوال الملف المركزي
         * ============================================================
         */
        async function loadData() {
            var token = getToken();
            if (!token) {
                showToast('⚠️ تنبيه', 'يرجى تسجيل الدخول أولاً', 'warning');
                setTimeout(function() {
                    window.location.href = 'login.html';
                }, 2000);
                return;
            }

            var profile = await getCurrentUserProfile();
            if (!profile) {
                showToast('⚠️ تنبيه', 'لم يتم العثور على بيانات المستخدم', 'error');
                return;
            }

            document.getElementById('userName').textContent = profile.name || 'مرحباً';
            document.getElementById('userRole').textContent = profile.role === 'admin' ? 'مدير النظام' : (profile.role === 'accountant' ? 'محاسب' : 'موظف');
            document.getElementById('userAvatar').textContent = (profile.name || 'أ').charAt(0);

            var treasuries = await getTreasuries(profile.company_id);
            renderTreasuries(treasuries);
        }

        /**
         * ============================================================
         * INIT
         * ============================================================
         */
        (async function init() {
            console.log('🏛️ الخزائن - QuickData ProSoft');
            console.log('🔗 Supabase URL:', SUPABASE_URL);

            var token = getToken();
            if (!token) {
                window.location.href = 'login.html';
                return;
            }

            await loadData();
            setTimeout(function() {
                startSessionMonitor();
            }, 3000);
        })();

        // تحديث تلقائي كل 30 ثانية
        setInterval(loadData, 30000);
    </script>

</body>
</html>
