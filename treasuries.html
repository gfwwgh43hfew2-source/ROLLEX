<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5" />
    <title>الخزائن - QuickData ProSoft</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800;900&display=swap" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* ==========================================================
           RESET & BASE - LIGHT THEME
           ========================================================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --gold: #c9a84c;
            --gold-light: #dbb95c;
            --gold-deep: #b8942a;
            --gold-bg: rgba(201, 168, 76, 0.08);
            --bg-body: #f0f2f5;
            --bg-card: #ffffff;
            --bg-card-hover: #f8f9fb;
            --bg-field: #f8f9fb;
            --border-color: #e8ecf1;
            --border-hover: #d0d5dd;
            --text-primary: #1a2332;
            --text-secondary: #4a5a6e;
            --text-muted: #8a96a8;
            --text-faint: #b0b8c4;
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.04);
            --shadow-md: 0 4px 20px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 12px 40px rgba(0, 0, 0, 0.08);
            --danger: #dc3545;
            --success: #28a745;
            --danger-bg: rgba(220, 53, 69, 0.06);
            --success-bg: rgba(40, 167, 69, 0.06);
            --radius: 12px;
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        html { scroll-behavior: smooth; }

        body {
            font-family: 'Cairo', 'Segoe UI', Tahoma, Arial, sans-serif;
            direction: rtl;
            min-height: 100vh;
            background: var(--bg-body);
            color: var(--text-primary);
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* ==========================================================
           HEADER
           ========================================================== */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 0;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 12px;
        }

        .header h1 {
            font-size: 1.6rem;
            font-weight: 900;
            color: var(--text-primary);
        }

        .header h1 i {
            margin-left: 10px;
            color: var(--gold);
        }

        .header-actions {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }

        .btn-header {
            padding: 8px 18px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            background: var(--bg-card);
            color: var(--text-secondary);
            font-family: inherit;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            box-shadow: var(--shadow-sm);
        }

        .btn-header:hover {
            background: var(--bg-card-hover);
            border-color: var(--border-hover);
            transform: translateY(-1px);
            box-shadow: var(--shadow-md);
        }

        .btn-header.gold {
            background: linear-gradient(135deg, var(--gold-light), var(--gold));
            color: #fff;
            border: none;
        }

        .btn-header.gold:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 16px rgba(201, 168, 76, 0.35);
        }

        .user-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--bg-card);
            padding: 6px 14px;
            border-radius: 50px;
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-secondary);
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-sm);
        }

        .user-badge .role {
            background: var(--gold);
            color: #fff;
            padding: 2px 10px;
            border-radius: 50px;
            font-size: 0.55rem;
            font-weight: 700;
        }

        /* ==========================================================
           STATS ROW
           ========================================================== */
        .stats-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 14px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 18px 20px;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-sm);
            transition: var(--transition);
        }

        .stat-card:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
            border-color: var(--gold-light);
        }

        .stat-card .label {
            font-size: 0.6rem;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .stat-card .value {
            font-size: 1.5rem;
            font-weight: 900;
            margin-top: 4px;
            color: var(--text-primary);
        }

        .stat-card .value.gold { color: var(--gold); }
        .stat-card .value.green { color: var(--success); }
        .stat-card .value.red { color: var(--danger); }

        /* ==========================================================
           SEARCH & FILTER
           ========================================================== */
        .search-section {
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 16px 20px;
            margin-bottom: 24px;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-sm);
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            align-items: center;
        }

        .search-section .search-wrap {
            flex: 1;
            min-width: 200px;
            position: relative;
        }

        .search-section .search-wrap input {
            width: 100%;
            padding: 10px 16px 10px 44px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            background: var(--bg-field);
            color: var(--text-primary);
            font-size: 0.85rem;
            font-family: inherit;
            outline: none;
            transition: var(--transition);
        }

        .search-section .search-wrap input:focus {
            border-color: var(--gold);
            box-shadow: 0 0 0 3px rgba(201, 168, 76, 0.12);
        }

        .search-section .search-wrap input::placeholder {
            color: var(--text-faint);
        }

        .search-section .search-wrap .search-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
        }

        .search-section .filter-group {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .search-section .filter-group select {
            padding: 10px 14px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            background: var(--bg-field);
            color: var(--text-primary);
            font-size: 0.8rem;
            font-family: inherit;
            outline: none;
            cursor: pointer;
            transition: var(--transition);
            min-width: 130px;
        }

        .search-section .filter-group select:focus {
            border-color: var(--gold);
        }

        /* ==========================================================
           TREASURY GRID
           ========================================================== */
        .treasury-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 18px;
        }

        .treasury-card {
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 22px 24px;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-sm);
            transition: all var(--transition);
            cursor: pointer;
            position: relative;
        }

        .treasury-card::before {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 4px;
            height: 100%;
            background: var(--gold);
            opacity: 0;
            border-radius: 0 0 0 0;
            transition: opacity var(--transition);
        }

        .treasury-card:hover {
            border-color: var(--gold-light);
            transform: translateY(-4px);
            box-shadow: var(--shadow-lg);
        }

        .treasury-card:hover::before {
            opacity: 1;
        }

        .treasury-card .card-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 12px;
        }

        .treasury-card .card-top .icon {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            background: var(--gold-bg);
            color: var(--gold);
        }

        .treasury-card .card-top .badge {
            padding: 3px 12px;
            border-radius: 50px;
            font-size: 0.55rem;
            font-weight: 700;
            text-transform: uppercase;
            background: var(--bg-field);
            color: var(--text-muted);
            border: 1px solid var(--border-color);
        }

        .treasury-card .card-top .badge.active {
            background: var(--success-bg);
            color: var(--success);
            border-color: rgba(40, 167, 69, 0.1);
        }

        .treasury-card .card-name {
            font-size: 1.1rem;
            font-weight: 800;
            color: var(--text-primary);
            margin-bottom: 4px;
        }

        .treasury-card .card-desc {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-bottom: 14px;
        }

        .treasury-card .card-balance {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 14px;
            border-top: 1px solid var(--border-color);
        }

        .treasury-card .card-balance .amount {
            font-size: 1.2rem;
            font-weight: 900;
            color: var(--gold);
        }

        .treasury-card .card-balance .label {
            font-size: 0.6rem;
            color: var(--text-muted);
            font-weight: 600;
            text-transform: uppercase;
        }

        .treasury-card .card-balance .treasury-type {
            font-size: 0.6rem;
            color: var(--text-muted);
            background: var(--bg-field);
            padding: 4px 10px;
            border-radius: 50px;
            border: 1px solid var(--border-color);
        }

        .treasury-card .card-actions {
            display: flex;
            gap: 8px;
            margin-top: 14px;
        }

        .treasury-card .card-actions .btn-sm {
            padding: 6px 14px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: var(--bg-card);
            font-family: inherit;
            font-size: 0.65rem;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition);
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            color: var(--text-secondary);
        }

        .treasury-card .card-actions .btn-sm.primary {
            background: linear-gradient(135deg, var(--gold-light), var(--gold));
            color: #fff;
            border: none;
        }

        .treasury-card .card-actions .btn-sm.primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(201, 168, 76, 0.3);
        }

        .treasury-card .card-actions .btn-sm.secondary:hover {
            background: var(--bg-card-hover);
            border-color: var(--border-hover);
        }

        .treasury-card .card-actions .btn-sm.danger {
            border-color: rgba(220, 53, 69, 0.1);
            color: var(--danger);
            background: var(--danger-bg);
        }

        .treasury-card .card-actions .btn-sm.danger:hover {
            background: rgba(220, 53, 69, 0.12);
        }

        /* ==========================================================
           EMPTY STATE
           ========================================================== */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
        }

        .empty-state i {
            font-size: 3rem;
            display: block;
            margin-bottom: 12px;
            color: var(--text-faint);
        }

        .empty-state h3 {
            font-size: 1.2rem;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }

        .empty-state p {
            font-size: 0.8rem;
        }

        .empty-state a {
            color: var(--gold);
            text-decoration: none;
            font-weight: 700;
        }

        .empty-state a:hover {
            text-decoration: underline;
        }

        /* ==========================================================
           TOAST
           ========================================================== */
        .toast-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 99999;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .toast {
            background: var(--bg-card);
            padding: 14px 20px;
            border-radius: var(--radius);
            border-right: 4px solid var(--gold);
            box-shadow: var(--shadow-lg);
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 280px;
            animation: slideIn 0.3s ease;
            border: 1px solid var(--border-color);
        }

        .toast.success { border-right-color: var(--success); }
        .toast.error { border-right-color: var(--danger); }

        .toast .icon { font-size: 1.1rem; }
        .toast .icon.success { color: var(--success); }
        .toast .icon.error { color: var(--danger); }

        .toast .content .title { font-size: 0.8rem; font-weight: 700; color: var(--text-primary); }
        .toast .content .message { font-size: 0.7rem; color: var(--text-muted); }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(20px); }
            to { opacity: 1; transform: translateX(0); }
        }

        /* ==========================================================
           RESPONSIVE
           ========================================================== */
        @media (max-width: 768px) {
            .header {
                flex-direction: column;
                align-items: flex-start;
            }

            .header-actions {
                width: 100%;
                flex-wrap: wrap;
            }

            .search-section {
                flex-direction: column;
            }

            .search-section .search-wrap {
                width: 100%;
            }

            .search-section .filter-group {
                width: 100%;
            }

            .search-section .filter-group select {
                flex: 1;
                min-width: 0;
            }

            .treasury-grid {
                grid-template-columns: 1fr;
            }

            .stats-row {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 480px) {
            .stats-row {
                grid-template-columns: 1fr;
            }

            .treasury-card .card-actions {
                flex-direction: column;
            }

            .treasury-card .card-actions .btn-sm {
                justify-content: center;
            }
        }
    </style>
</head>
<body>

    <div class="container">

        <!-- ===== HEADER ===== -->
        <header class="header">
            <h1><i class="fas fa-university"></i> الخزائن</h1>
            <div class="header-actions">
                <div class="user-badge">
                    <i class="fas fa-user"></i>
                    <span id="userName">مرحباً</span>
                    <span class="role" id="userRole">مدير</span>
                </div>
                <button class="btn-header gold" onclick="window.location.href='treasury-add.html'">
                    <i class="fas fa-plus"></i> خزينة جديدة
                </button>
                <button class="btn-header" onclick="window.location.href='index.html'">
                    <i class="fas fa-home"></i> الرئيسية
                </button>
                <button class="btn-header" onclick="logout()">
                    <i class="fas fa-sign-out-alt"></i>
                </button>
            </div>
        </header>

        <!-- ===== STATS ===== -->
        <div class="stats-row">
            <div class="stat-card">
                <div class="label">إجمالي الخزائن</div>
                <div class="value gold" id="totalTreasuries">0</div>
            </div>
            <div class="stat-card">
                <div class="label">إجمالي الرصيد</div>
                <div class="value green" id="totalBalance">0 ج.م</div>
            </div>
            <div class="stat-card">
                <div class="label">الخزائن النشطة</div>
                <div class="value" id="activeTreasuries">0</div>
            </div>
        </div>

        <!-- ===== SEARCH & FILTER ===== -->
        <div class="search-section">
            <div class="search-wrap">
                <span class="search-icon"><i class="fas fa-search"></i></span>
                <input type="text" id="searchInput" placeholder="ابحث عن خزينة..." onkeyup="filterTreasuries()" />
            </div>
            <div class="filter-group">
                <select id="typeFilter" onchange="filterTreasuries()">
                    <option value="">جميع الأنواع</option>
                    <option value="main">رئيسية</option>
                    <option value="accountant">محاسب</option>
                    <option value="driver">سائق</option>
                    <option value="custom">مخصصة</option>
                </select>
                <select id="statusFilter" onchange="filterTreasuries()">
                    <option value="">جميع الحالات</option>
                    <option value="true">نشطة</option>
                    <option value="false">غير نشطة</option>
                </select>
            </div>
        </div>

        <!-- ===== TREASURY GRID ===== -->
        <div class="treasury-grid" id="treasuryGrid">
            <!-- يتم التحميل عبر JavaScript -->
        </div>

    </div>

    <!-- ===== TOAST ===== -->
    <div class="toast-container" id="toastContainer"></div>

    <script>
        /**
         * ============================================================
         * SUPABASE CONFIGURATION
         * ============================================================
         */
        var SUPABASE_URL = 'https://ykkhkgajzyxsgoamtmnn.supabase.co';
        var SUPABASE_ANON_KEY = 'sb_publishable_NOH7uJlEoPf6wcT87DNBug_izzR-4VF';

        /**
         * ============================================================
         * INITIALIZE SUPABASE CLIENT
         * ============================================================
         */
        var supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
            auth: {
                autoRefreshToken: true,
                persistSession: true,
                detectSessionInUrl: true,
                storageKey: 'rollex_session'
            }
        });

        /**
         * ============================================================
         * DEBUG MODE
         * ============================================================
         */
        var DEBUG_MODE = true;

        function debugLog(message, type, data) {
            if (!DEBUG_MODE) return;
            var prefix = '🔍 [DEBUG]';
            var icon = '📌';
            switch(type) {
                case 'success': prefix = '✅ [SUCCESS]'; icon = '✅'; break;
                case 'error': prefix = '❌ [ERROR]'; icon = '❌'; break;
                case 'warning': prefix = '⚠️ [WARNING]'; icon = '⚠️'; break;
                case 'info': prefix = 'ℹ️ [INFO]'; icon = 'ℹ️'; break;
                default: prefix = '🔍 [DEBUG]'; icon = '🔍';
            }
            if (data) {
                console.log(icon + ' ' + prefix + ' - ' + message, data);
            } else {
                console.log(icon + ' ' + prefix + ' - ' + message);
            }
        }

        /**
         * ============================================================
         * CHECK SESSION
         * ============================================================
         */
        async function checkSession() {
            debugLog('بدء التحقق من الجلسة...', 'info');
            try {
                var { data: { session }, error } = await supabase.auth.getSession();
                if (error) {
                    debugLog('خطأ في جلب الجلسة', 'error', error);
                    return false;
                }
                if (session) {
                    debugLog('تم العثور على جلسة صالحة', 'success', { user: session.user.email });
                    return true;
                }
                debugLog('لا توجد جلسة نشطة', 'info');
                return false;
            } catch (error) {
                debugLog('خطأ في التحقق من الجلسة', 'error', error);
                return false;
            }
        }

        /**
         * ============================================================
         * LOGOUT
         * ============================================================
         */
        async function logout() {
            await supabase.auth.signOut();
            localStorage.removeItem('rollex_session');
            window.location.href = 'login.html';
        }

        /**
         * ============================================================
         * TOAST
         * ============================================================
         */
        function showToast(title, message, type) {
            var container = document.getElementById('toastContainer');
            var toast = document.createElement('div');
            toast.className = 'toast ' + (type || '');
            var icon = type === 'success' ? 'fa-check-circle' : 'fa-exclamation-circle';
            var iconClass = type === 'success' ? 'success' : 'error';
            toast.innerHTML = `
                <span class="icon ${iconClass}"><i class="fas ${icon}"></i></span>
                <div class="content">
                    <div class="title">${title}</div>
                    <div class="message">${message}</div>
                </div>
            `;
            container.appendChild(toast);
            setTimeout(function() {
                toast.style.opacity = '0';
                toast.style.transform = 'translateX(20px)';
                setTimeout(function() { toast.remove(); }, 300);
            }, 3000);
        }

        /**
         * ============================================================
         * GET CURRENT USER PROFILE
         * ============================================================
         */
        async function getCurrentUserProfile() {
            try {
                var { data: { user }, error } = await supabase.auth.getUser();
                if (error || !user) {
                    debugLog('❌ مفيش مستخدم', 'error', error);
                    return null;
                }
                debugLog('👤 المستخدم من auth:', 'info', user.email);

                var { data, error: pError } = await supabase
                    .from('profiles')
                    .select('*')
                    .eq('id', user.id)
                    .single();

                if (pError) {
                    debugLog('❌ مفيش بروفايل:', 'error', pError.message);
                    return null;
                }
                debugLog('📊 البروفايل:', 'info', data);
                return { ...user, ...data };
            } catch (error) {
                debugLog('❌ خطأ في جلب البروفايل:', 'error', error);
                return null;
            }
        }

        /**
         * ============================================================
         * GET COMPANY TREASURIES
         * ============================================================
         */
        async function getTreasuries(companyId) {
            try {
                var { data, error } = await supabase
                    .from('treasuries')
                    .select('*')
                    .eq('company_id', companyId)
                    .order('created_at', { ascending: false });

                if (error) {
                    debugLog('❌ فشل جلب الخزائن:', 'error', error);
                    return [];
                }
                debugLog('📊 عدد الخزائن:', 'info', data ? data.length : 0);
                return data || [];
            } catch (error) {
                debugLog('❌ خطأ في جلب الخزائن:', 'error', error);
                return [];
            }
        }

        /**
         * ============================================================
         * FILTER TREASURIES
         * ============================================================
         */
        function filterTreasuries() {
            var search = document.getElementById('searchInput').value.toLowerCase();
            var typeFilter = document.getElementById('typeFilter').value;
            var statusFilter = document.getElementById('statusFilter').value;

            var cards = document.querySelectorAll('.treasury-card');
            var visibleCount = 0;

            cards.forEach(function(card) {
                var name = card.getAttribute('data-name') || '';
                var desc = card.getAttribute('data-desc') || '';
                var type = card.getAttribute('data-type') || '';
                var isActive = card.getAttribute('data-active') === 'true';

                var matchSearch = name.includes(search) || desc.includes(search);
                var matchType = !typeFilter || type === typeFilter;
                var matchStatus = !statusFilter || String(isActive) === statusFilter;

                if (matchSearch && matchType && matchStatus) {
                    card.style.display = '';
                    visibleCount++;
                } else {
                    card.style.display = 'none';
                }
            });

            var grid = document.getElementById('treasuryGrid');
            var emptyMsg = grid.querySelector('.empty-state-msg');
            if (visibleCount === 0) {
                if (!emptyMsg) {
                    var msg = document.createElement('div');
                    msg.className = 'empty-state empty-state-msg';
                    msg.style.gridColumn = '1/-1';
                    msg.innerHTML = `
                        <i class="fas fa-search"></i>
                        <h3>لا توجد نتائج</h3>
                        <p>حاول تغيير كلمات البحث أو الفلاتر</p>
                    `;
                    grid.appendChild(msg);
                }
            } else {
                if (emptyMsg) emptyMsg.remove();
            }
        }

        /**
         * ============================================================
         * RENDER TREASURIES
         * ============================================================
         */
        function renderTreasuries(treasuries) {
            var grid = document.getElementById('treasuryGrid');
            var totalBalance = 0;
            var activeCount = 0;

            treasuries.forEach(function(t) {
                totalBalance += (t.balance || 0);
                if (t.is_active !== false) activeCount++;
            });

            document.getElementById('totalTreasuries').textContent = treasuries.length;
            document.getElementById('totalBalance').textContent = totalBalance.toLocaleString() + ' ج.م';
            document.getElementById('activeTreasuries').textContent = activeCount;

            if (treasuries.length === 0) {
                grid.innerHTML = `
                    <div class="empty-state" style="grid-column:1/-1;">
                        <i class="fas fa-university"></i>
                        <h3>لا توجد خزائن</h3>
                        <p>قم بإضافة خزينة جديدة للبدء</p>
                        <br />
                        <a href="treasury-add.html"><i class="fas fa-plus"></i> إضافة خزينة</a>
                    </div>
                `;
                return;
            }

            var html = '';
            var typeLabels = {
                'main': 'رئيسية',
                'accountant': 'محاسب',
                'driver': 'سائق',
                'custom': 'مخصصة'
            };
            var typeIcons = {
                'main': 'fa-building',
                'accountant': 'fa-calculator',
                'driver': 'fa-truck',
                'custom': 'fa-cog'
            };

            treasuries.forEach(function(t) {
                var isActive = t.is_active !== false;
                var typeLabel = typeLabels[t.type] || t.type || 'مخصصة';
                var typeIcon = typeIcons[t.type] || 'fa-university';

                html += `
                    <div class="treasury-card" 
                         data-id="${t.id}"
                         data-name="${(t.name || '').toLowerCase()}"
                         data-desc="${(t.description || '').toLowerCase()}"
                         data-type="${t.type || ''}"
                         data-active="${isActive}"
                         onclick="openTreasury('${t.id}')">
                        <div class="card-top">
                            <div class="icon"><i class="fas ${typeIcon}"></i></div>
                            <span class="badge ${isActive ? 'active' : ''}">${isActive ? 'نشطة' : 'غير نشطة'}</span>
                        </div>
                        <div class="card-name">${t.name || 'خزينة'}</div>
                        <div class="card-desc">${t.description || 'لا يوجد وصف'}</div>
                        <div class="card-balance">
                            <div>
                                <div class="label">الرصيد الحالي</div>
                                <div class="amount">${(t.balance || 0).toLocaleString()} ج.م</div>
                            </div>
                            <span class="treasury-type">${typeLabel}</span>
                        </div>
                        <div class="card-actions">
                            <a href="treasury.html?treasury_id=${t.id}" class="btn-sm primary" onclick="event.stopPropagation();">
                                <i class="fas fa-eye"></i> عرض
                            </a>
                            <button class="btn-sm secondary" onclick="event.stopPropagation();editTreasury('${t.id}')">
                                <i class="fas fa-edit"></i> تعديل
                            </button>
                            <button class="btn-sm danger" onclick="event.stopPropagation();deleteTreasury('${t.id}')">
                                <i class="fas fa-trash-alt"></i>
                            </button>
                        </div>
                    </div>
                `;
            });

            grid.innerHTML = html;
        }

        /**
         * ============================================================
         * OPEN TREASURY
         * ============================================================
         */
        function openTreasury(id) {
            window.location.href = 'treasury.html?treasury_id=' + id;
        }

        /**
         * ============================================================
         * EDIT TREASURY
         * ============================================================
         */
        function editTreasury(id) {
            window.location.href = 'treasury-edit.html?treasury_id=' + id;
        }

        /**
         * ============================================================
         * DELETE TREASURY
         * ============================================================
         */
        async function deleteTreasury(id) {
            if (!confirm('هل أنت متأكد من حذف هذه الخزينة؟')) return;

            try {
                var { error } = await supabase
                    .from('treasuries')
                    .delete()
                    .eq('id', id);

                if (error) {
                    throw new Error(error.message);
                }

                showToast('✅ تم الحذف', 'تم حذف الخزينة بنجاح', 'success');
                loadData();

            } catch (error) {
                console.error('❌ خطأ:', error);
                showToast('❌ خطأ', error.message, 'error');
            }
        }

        /**
         * ============================================================
         * LOAD DATA
         * ============================================================
         */
        async function loadData() {
            var profile = await getCurrentUserProfile();
            if (!profile) {
                showToast('⚠️ تنبيه', 'لم يتم العثور على بيانات المستخدم', 'error');
                return;
            }

            document.getElementById('userName').textContent = profile.name || 'مرحباً';
            document.getElementById('userRole').textContent = profile.role === 'admin' ? 'مدير' : (profile.role === 'accountant' ? 'محاسب' : 'موظف');

            var treasuries = await getTreasuries(profile.company_id);
            renderTreasuries(treasuries);
        }

        /**
         * ============================================================
         * INIT
         * ============================================================
         */
        (async function init() {
            console.log('🏛️ الخزائن - QuickData ProSoft');
            console.log('🔗 Supabase URL:', SUPABASE_URL);

            var hasSession = await checkSession();
            if (!hasSession) {
                debugLog('❌ لا توجد جلسة، جاري التوجيه إلى تسجيل الدخول...', 'error');
                window.location.href = 'login.html';
                return;
            }

            debugLog('✅ جلسة موجودة، جاري تحميل البيانات...', 'success');
            await loadData();
        })();

        // تحديث تلقائي كل 30 ثانية
        setInterval(loadData, 30000);
    </script>

</body>
</html>
