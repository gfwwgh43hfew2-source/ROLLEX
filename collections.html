<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>تحصيلات العملاء - QuickData ProSoft</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <!-- ===== إضافة الملف المركزي ===== -->
    <script src="supabase-client.js"></script>
    <style>
        /* ============================================================
           تصميم فاخر - ثيم فاتح أنيق (Light Theme Premium)
           ============================================================ */
        :root {
            --gold: #b8942a;
            --gold-light: #f0e3c4;
            --gold-dark: #8a6b1f;
            --gold-glow: rgba(184, 148, 42, 0.10);
            --gold-gradient: linear-gradient(135deg, #d4a84a 0%, #b8942a 50%, #8a6b1f 100%);
            --bg-page: #f4f1ea;
            --bg-card: #ffffff;
            --bg-card-hover: #faf8f2;
            --bg-input: #f8f6f0;
            --text-primary: #1a1a1a;
            --text-secondary: #2d2d2d;
            --text-muted: #6b6b6b;
            --text-light: #9a9a9a;
            --border-color: #e5dfd0;
            --success: #1a8a5a;
            --success-bg: rgba(26, 138, 90, 0.08);
            --danger: #b8453a;
            --danger-bg: rgba(184, 69, 58, 0.08);
            --warning: #b87a1a;
            --warning-bg: rgba(184, 122, 26, 0.08);
            --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.04);
            --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 8px 40px rgba(0, 0, 0, 0.08);
            --shadow-gold: 0 4px 20px rgba(184, 148, 42, 0.20);
            --radius-sm: 6px;
            --radius-md: 10px;
            --radius-lg: 14px;
            --radius-xl: 18px;
            --radius-2xl: 22px;
            --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            --font: 'Cairo', sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: var(--font);
            background: var(--bg-page);
            background-image: 
                radial-gradient(ellipse 800px 600px at 10% -10%, rgba(184, 148, 42, 0.04), transparent 60%),
                radial-gradient(ellipse 600px 400px at 90% 100%, rgba(184, 148, 42, 0.03), transparent 50%);
            color: var(--text-primary);
            direction: rtl;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1300px;
            margin: 0 auto;
            padding: 0 16px;
        }

        /* ============================================================
           SCROLLBAR
           ============================================================ */
        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: var(--bg-page); }
        ::-webkit-scrollbar-thumb { background: var(--gold); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--gold-dark); }

        /* ============================================================
           HEADER
           ============================================================ */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0 18px;
            border-bottom: 2px solid var(--border-color);
            margin-bottom: 22px;
            flex-wrap: wrap;
            gap: 12px;
        }

        .header h1 {
            font-size: 1.5rem;
            font-weight: 900;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .header h1 i {
            width: 42px;
            height: 42px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            color: #fff;
            background: var(--gold-gradient);
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-gold);
        }
        .header h1 span { color: var(--gold); }

        .header .back-btn {
            color: var(--text-muted);
            text-decoration: none;
            padding: 8px 18px;
            border-radius: var(--radius-md);
            border: 1px solid var(--border-color);
            background: var(--bg-card);
            font-size: 0.78rem;
            font-weight: 600;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .header .back-btn:hover {
            background: var(--bg-page);
            border-color: var(--gold);
            color: var(--text-secondary);
            transform: translateY(-1px);
            box-shadow: var(--shadow-md);
        }

        /* ============================================================
           FILTERS
           ============================================================ */
        .filters-section {
            background: var(--bg-card);
            border-radius: var(--radius-xl);
            padding: 20px 24px;
            margin-bottom: 20px;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-sm);
        }

        .filters-row {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr auto;
            gap: 12px;
            align-items: end;
        }
        .filters-row .form-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .filters-row .form-group label {
            font-size: 0.65rem;
            font-weight: 700;
            color: var(--text-muted);
        }
        .filters-row .form-group input,
        .filters-row .form-group select {
            padding: 8px 14px;
            border-radius: var(--radius-md);
            border: 1px solid var(--border-color);
            background: var(--bg-input);
            color: var(--text-secondary);
            font-size: 0.8rem;
            font-family: inherit;
            outline: none;
            width: 100%;
            transition: var(--transition);
        }
        .filters-row .form-group input:focus,
        .filters-row .form-group select:focus {
            border-color: var(--gold);
            background: var(--bg-card);
            box-shadow: 0 0 0 3px var(--gold-glow);
        }

        .btn-filter {
            padding: 8px 24px;
            background: var(--gold-gradient);
            color: #fff;
            border: none;
            border-radius: var(--radius-md);
            font-weight: 700;
            font-size: 0.78rem;
            cursor: pointer;
            font-family: inherit;
            transition: var(--transition);
            box-shadow: var(--shadow-gold);
            white-space: nowrap;
        }
        .btn-filter:hover {
            box-shadow: 0 6px 28px rgba(184, 148, 42, 0.30);
            transform: translateY(-2px);
        }

        .btn-export {
            padding: 8px 18px;
            background: transparent;
            color: var(--success);
            border: 1px solid rgba(26, 138, 90, 0.25);
            border-radius: var(--radius-md);
            font-weight: 700;
            font-size: 0.78rem;
            cursor: pointer;
            font-family: inherit;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 7px;
        }
        .btn-export:hover {
            background: var(--success-bg);
            border-color: var(--success);
        }

        /* ============================================================
           SUMMARY CARDS
           ============================================================ */
        .summary-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }
        .summary-card {
            background: var(--bg-card);
            border-radius: var(--radius-lg);
            padding: 16px 20px;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-sm);
            transition: var(--transition);
            position: relative;
            overflow: hidden;
        }
        .summary-card::before {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            bottom: 0;
            width: 3px;
            background: var(--gold-gradient);
        }
        .summary-card:hover {
            box-shadow: var(--shadow-md);
            transform: translateY(-2px);
        }
        .summary-card .value {
            font-size: 1.3rem;
            font-weight: 700;
            display: block;
            font-family: 'JetBrains Mono', monospace;
        }
        .summary-card .value.green { color: var(--success); }
        .summary-card .value.gold { color: var(--gold); }
        .summary-card .label {
            font-size: 0.62rem;
            color: var(--text-light);
            font-weight: 700;
            margin-top: 4px;
            display: block;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        /* ============================================================
           TABLE
           ============================================================ */
        .table-wrapper {
            background: var(--bg-card);
            border-radius: var(--radius-xl);
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-sm);
            overflow: hidden;
            transition: var(--transition);
        }
        .table-wrapper:hover {
            box-shadow: var(--shadow-md);
        }
        .table-scroll {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.72rem;
            min-width: 900px;
        }

        thead {
            background: var(--bg-page);
            border-bottom: 2px solid var(--border-color);
        }
        thead th {
            padding: 12px 14px;
            text-align: center;
            font-size: 0.6rem;
            font-weight: 800;
            color: var(--text-muted);
            letter-spacing: 0.5px;
            text-transform: uppercase;
            white-space: nowrap;
            position: sticky;
            top: 0;
        }
        thead th i {
            margin-left: 4px;
            color: var(--gold);
            font-size: 0.55rem;
        }

        tbody tr {
            transition: var(--transition);
        }
        tbody tr:nth-child(even) {
            background: rgba(184, 148, 42, 0.02);
        }
        tbody tr:hover {
            background: var(--bg-card-hover);
        }
        tbody td {
            padding: 10px 14px;
            border-bottom: 1px solid var(--border-color);
            text-align: center;
            color: var(--text-secondary);
            transition: var(--transition);
        }
        tbody tr:last-child td {
            border-bottom: none;
        }

        .badge-client {
            display: inline-block;
            padding: 3px 12px;
            border-radius: 50px;
            font-size: 0.56rem;
            font-weight: 700;
            background: var(--gold-glow);
            color: var(--gold);
            border: 1px solid rgba(184, 148, 42, 0.15);
        }

        .amount-col {
            font-weight: 700;
            font-family: 'JetBrains Mono', monospace;
        }
        .amount-col.incoming { color: var(--success); }
        .amount-col.outgoing { color: var(--danger); }

        .treasury-badge {
            display: inline-block;
            padding: 2px 10px;
            border-radius: 50px;
            font-size: 0.5rem;
            font-weight: 700;
            background: var(--bg-input);
            color: var(--text-muted);
            border: 1px solid var(--border-color);
        }

        .empty-state {
            text-align: center;
            padding: 48px 20px;
            color: var(--text-light);
        }
        .empty-state i {
            font-size: 2.4rem;
            display: block;
            margin-bottom: 12px;
            opacity: 0.3;
            color: var(--gold);
        }
        .empty-state p {
            font-size: 0.85rem;
        }

        /* ============================================================
           TOAST
           ============================================================ */
        .toast-container {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 99999;
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-width: 400px;
            width: 100%;
        }
        .toast {
            background: var(--bg-card);
            padding: 14px 20px;
            border-radius: var(--radius-lg);
            border-right: 4px solid var(--gold);
            box-shadow: var(--shadow-lg);
            display: flex;
            align-items: center;
            gap: 12px;
            animation: slideIn 0.35s ease;
            border: 1px solid var(--border-color);
            width: 100%;
        }
        .toast.success { border-right-color: var(--success); }
        .toast.error { border-right-color: var(--danger); }
        .toast .icon { font-size: 1.1rem; flex-shrink: 0; }
        .toast .icon.success { color: var(--success); }
        .toast .icon.error { color: var(--danger); }
        .toast .content { flex: 1; }
        .toast .content .title { font-size: 0.8rem; font-weight: 700; color: var(--text-secondary); }
        .toast .content .message { font-size: 0.7rem; color: var(--text-muted); }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(-30px); }
            to { opacity: 1; transform: translateX(0); }
        }

        /* ============================================================
           RESPONSIVE
           ============================================================ */
        @media (max-width: 768px) {
            body { padding: 12px; }
            .container { padding: 0 6px; }
            .filters-row { grid-template-columns: 1fr; }
            .summary-grid { grid-template-columns: 1fr 1fr; }
            .header { flex-direction: column; gap: 12px; align-items: flex-start; }
            .header h1 { font-size: 1.2rem; }
            .header h1 i { width: 36px; height: 36px; font-size: 0.85rem; }
            table { font-size: 0.65rem; min-width: 700px; }
            thead th, tbody td { padding: 8px 10px; }
        }

        @media (max-width: 480px) {
            .summary-grid { grid-template-columns: 1fr; }
            .header h1 { font-size: 1rem; }
            .header h1 i { width: 32px; height: 32px; font-size: 0.75rem; }
            table { font-size: 0.58rem; min-width: 600px; }
            thead th, tbody td { padding: 6px 8px; }
        }

        /* ============================================================
           PROGRESS
           ============================================================ */
        #loadingOverlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(4px);
            z-index: 99999;
            justify-content: center;
            align-items: center;
        }
        #loadingOverlay.active {
            display: flex;
        }
        #loadingOverlay .spinner {
            background: var(--bg-card);
            padding: 30px 40px;
            border-radius: var(--radius-xl);
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-xl);
            text-align: center;
        }
        #loadingOverlay .spinner i {
            font-size: 2rem;
            color: var(--gold);
            animation: spin 1s linear infinite;
        }
        #loadingOverlay .spinner p {
            margin-top: 12px;
            font-weight: 700;
            color: var(--text-secondary);
        }
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="container">

        <!-- ===== HEADER ===== -->
        <div class="header">
            <h1><i class="fas fa-users"></i> <span>تحصيلات العملاء</span></h1>
            <a href="treasuries.html" class="back-btn"><i class="fas fa-arrow-right"></i> العودة للخزائن</a>
        </div>

        <!-- ===== FILTERS ===== -->
        <div class="filters-section">
            <div class="filters-row">
                <div class="form-group">
                    <label>من تاريخ</label>
                    <input type="date" id="filterDateFrom" />
                </div>
                <div class="form-group">
                    <label>إلى تاريخ</label>
                    <input type="date" id="filterDateTo" />
                </div>
                <div class="form-group">
                    <label>الخزينة</label>
                    <select id="filterTreasury">
                        <option value="">جميع الخزائن</option>
                    </select>
                </div>
                <div style="display:flex;gap:8px;">
                    <button class="btn-filter" onclick="loadData()">
                        <i class="fas fa-search"></i> عرض
                    </button>
                    <button class="btn-export" onclick="exportToExcel()">
                        <i class="fas fa-file-excel"></i> تصدير
                    </button>
                </div>
            </div>
        </div>

        <!-- ===== SUMMARY CARDS ===== -->
        <div class="summary-grid" id="summaryGrid">
            <div class="summary-card">
                <span class="value gold" id="totalClients">0</span>
                <span class="label">عدد العملاء</span>
            </div>
            <div class="summary-card">
                <span class="value green" id="totalCollections">0 ج.م</span>
                <span class="label">إجمالي التحصيلات</span>
            </div>
            <div class="summary-card">
                <span class="value" id="avgCollection" style="color:#3a7a6a;">0 ج.م</span>
                <span class="label">متوسط التحصيل لكل عميل</span>
            </div>
            <div class="summary-card">
                <span class="value gold" id="totalTransactions">0</span>
                <span class="label">عدد الحركات</span>
            </div>
        </div>

        <!-- ===== TABLE ===== -->
        <div class="table-wrapper">
            <div class="table-scroll">
                <table>
                    <thead>
                        <tr>
                            <th>#</th>
                            <th><i class="fas fa-user"></i> اسم العميل</th>
                            <th><i class="fas fa-university"></i> الخزينة</th>
                            <th><i class="fas fa-calendar"></i> التاريخ</th>
                            <th><i class="fas fa-align-right"></i> البيان</th>
                            <th><i class="fas fa-arrow-down"></i> المبلغ</th>
                            <th><i class="fas fa-tag"></i> النوع</th>
                            <th><i class="fas fa-folder"></i> التبويب</th>
                        </tr>
                    </thead>
                    <tbody id="collectionsBody">
                        <tr><td colspan="8"><div class="empty-state"><i class="fas fa-inbox"></i>لا توجد تحصيلات</div></td></tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <!-- ===== LOADING OVERLAY ===== -->
    <div id="loadingOverlay">
        <div class="spinner">
            <i class="fas fa-spinner"></i>
            <p>جاري تحميل البيانات...</p>
        </div>
    </div>

    <!-- ===== TOAST ===== -->
    <div class="toast-container" id="toastContainer"></div>

    <script>
        // ============================================================
        // DOM REFS
        // ============================================================
        var allTransactions = [];
        var allTreasuries = [];
        var filteredData = [];

        // ============================================================
        // GET TREASURIES
        // ============================================================
        async function getTreasuries() {
            try {
                var data = await getTable('treasuries', 'name.asc');
                return data || [];
            } catch (error) {
                console.error('❌ خطأ في جلب الخزائن:', error);
                return [];
            }
        }

        // ============================================================
        // GET ALL TRANSACTIONS FROM SUPABASE
        // ============================================================
        async function getAllTransactions() {
            try {
                var data = await getTable('client_payments');
                return data || [];
            } catch (error) {
                console.error('❌ خطأ في جلب التحصيلات:', error);
                return [];
            }
        }

        // ============================================================
        // FILTER TRANSACTIONS
        // ============================================================
        function filterClientTransactions(transactions, dateFrom, dateTo, treasuryId) {
            var filtered = [];

            for (var i = 0; i < transactions.length; i++) {
                var item = transactions[i];

                if (treasuryId && item.treasury_id !== treasuryId) continue;

                var itemDate = new Date(item.payment_date || item.created_at);
                if (dateFrom && itemDate < new Date(dateFrom)) continue;
                if (dateTo && itemDate > new Date(dateTo)) continue;

                filtered.push(item);
            }

            return filtered;
        }

        // ============================================================
        // DISPLAY DATA
        // ============================================================
        function displayData(transactions) {
            var tbody = document.getElementById('collectionsBody');

            var totalClientsSet = new Set();
            var totalCollections = 0;
            var totalTransactions = transactions.length;

            transactions.forEach(function(item) {
                if (item.client_name) {
                    totalClientsSet.add(item.client_name);
                }
                totalCollections += parseFloat(item.amount) || 0;
            });

            document.getElementById('totalClients').textContent = totalClientsSet.size;
            document.getElementById('totalCollections').textContent = totalCollections.toLocaleString() + ' ج.م';
            document.getElementById('avgCollection').textContent = (totalClientsSet.size > 0 ? (totalCollections / totalClientsSet
                .size).toLocaleString() : '0') + ' ج.م';
            document.getElementById('totalTransactions').textContent = totalTransactions;

            if (!transactions || transactions.length === 0) {
                tbody.innerHTML =
                    `<tr><td colspan="8"><div class="empty-state"><i class="fas fa-inbox"></i>لا توجد تحصيلات</div></td></tr>`;
                return;
            }

            var clientMap = {};
            transactions.forEach(function(item) {
                var clientName = item.client_name || 'غير محدد';
                if (!clientMap[clientName]) {
                    clientMap[clientName] = {
                        client: clientName,
                        total: 0,
                        transactions: []
                    };
                }
                clientMap[clientName].total += parseFloat(item.amount) || 0;
                clientMap[clientName].transactions.push(item);
            });

            var clientArray = Object.values(clientMap);
            clientArray.sort(function(a, b) { return b.total - a.total; });

            var rows = '';
            var counter = 0;

            clientArray.forEach(function(client) {
                counter++;
                var firstItem = client.transactions[0];
                rows += `
                    <tr style="background:var(--gold-glow);font-weight:700;">
                        <td>${counter}</td>
                        <td><span class="badge-client">${client.client}</span></td>
                        <td colspan="5"></td>
                        <td style="color:var(--gold);font-weight:800;">${client.total.toLocaleString()} ج.م</td>
                    </tr>
                `;

                client.transactions.forEach(function(item) {
                    var amount = parseFloat(item.amount) || 0;
                    var isIncoming = amount > 0;
                    var displayAmount = Math.abs(amount);

                    var typeLabels = {
                        'incoming': 'إيداع',
                        'outgoing': 'سحب',
                        'transfer_in': 'تحويل وارد',
                        'transfer_out': 'تحويل صادر',
                        'opening': 'رصيد افتتاحي',
                        'salary': 'راتب',
                        'expense': 'مصروف',
                        'revenue': 'إيراد',
                        'collection': 'تحصيل'
                    };
                    var displayType = typeLabels[item.type] || item.type || '-';

                    rows += `
                        <tr>
                            <td></td>
                            <td></td>
                            <td><span class="treasury-badge">${item.treasury_name || '-'}</span></td>
                            <td>${formatDate(item.payment_date || item.created_at)}</td>
                            <td style="text-align:right;">${item.notes || item.description || '-'}</td>
                            <td class="amount-col ${isIncoming ? 'incoming' : 'outgoing'}">${isIncoming ? '+' : '-'} ${displayAmount.toLocaleString()}</td>
                            <td>${displayType}</td>
                            <td>${item.general_tab || '-'}</td>
                        </tr>
                    `;
                });
            });

            tbody.innerHTML = rows;
        }

        // ============================================================
        // POPULATE TREASURY FILTER
        // ============================================================
        function populateTreasuryFilter(treasuries) {
            var select = document.getElementById('filterTreasury');
            select.innerHTML = '<option value="">جميع الخزائن</option>';
            treasuries.forEach(function(t) {
                var option = document.createElement('option');
                option.value = t.id;
                option.textContent = t.name;
                select.appendChild(option);
            });
        }

        // ============================================================
        // SET DEFAULT DATES
        // ============================================================
        function setDefaultDates() {
            var now = new Date();
            var firstDayOfYear = new Date(now.getFullYear(), 0, 1);
            var today = new Date(now.getFullYear(), now.getMonth(), now.getDate());

            document.getElementById('filterDateFrom').value = firstDayOfYear.toISOString().split('T')[0];
            document.getElementById('filterDateTo').value = today.toISOString().split('T')[0];
        }

        // ============================================================
        // EXPORT TO EXCEL
        // ============================================================
        function exportToExcel() {
            try {
                if (!filteredData || filteredData.length === 0) {
                    showToast('⚠️ تنبيه', 'لا توجد بيانات لتصديرها', 'warning');
                    return;
                }

                var excelData = filteredData.map(function(item, index) {
                    var amount = parseFloat(item.amount) || 0;
                    var isIncoming = amount > 0;

                    var typeLabels = {
                        'incoming': 'إيداع',
                        'outgoing': 'سحب',
                        'transfer_in': 'تحويل وارد',
                        'transfer_out': 'تحويل صادر',
                        'opening': 'رصيد افتتاحي',
                        'salary': 'راتب',
                        'expense': 'مصروف',
                        'revenue': 'إيراد',
                        'collection': 'تحصيل'
                    };

                    return {
                        '#': index + 1,
                        'العميل': item.client_name || '-',
                        'الخزينة': item.treasury_name || '-',
                        'التاريخ': formatDate(item.payment_date || item.created_at),
                        'البيان': item.notes || item.description || '-',
                        'المبلغ': (isIncoming ? '+' : '-') + Math.abs(amount).toLocaleString(),
                        'النوع': typeLabels[item.type] || item.type || '-',
                        'التبويب العام': item.general_tab || '-'
                    };
                });

                var ws = XLSX.utils.json_to_sheet(excelData);
                var wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, ws, 'تحصيلات العملاء');

                ws['!cols'] = [
                    { wch: 5 }, { wch: 20 }, { wch: 15 }, { wch: 15 },
                    { wch: 30 }, { wch: 15 }, { wch: 15 }, { wch: 20 }
                ];

                var filename = 'تحصيلات_العملاء_' + new Date().toISOString().split('T')[0] + '.xlsx';
                XLSX.writeFile(wb, filename);

                showToast('✅ تم التصدير', 'تم تصدير ' + filteredData.length + ' حركة بنجاح', 'success');

            } catch (error) {
                console.error('❌ خطأ:', error);
                showToast('❌ خطأ', error.message, 'error');
            }
        }

        // ============================================================
        // LOAD DATA
        // ============================================================
        async function loadData() {
            var overlay = document.getElementById('loadingOverlay');
            overlay.classList.add('active');

            try {
                var token = getToken();
                if (!token) {
                    var refreshed = await refreshSession();
                    if (!refreshed) {
                        redirectToLogin();
                        return;
                    }
                }

                allTreasuries = await getTreasuries();
                populateTreasuryFilter(allTreasuries);

                allTransactions = await getAllTransactions();

                var dateFrom = document.getElementById('filterDateFrom').value;
                var dateTo = document.getElementById('filterDateTo').value;
                var treasuryId = document.getElementById('filterTreasury').value;

                filteredData = filterClientTransactions(allTransactions, dateFrom, dateTo, treasuryId);

                displayData(filteredData);

                if (filteredData.length === 0) {
                    showToast('📭 معلومات', 'لا توجد تحصيلات للعملاء في الفترة المحددة', 'warning');
                } else {
                    showToast('✅ تم التحميل', 'تم عرض ' + filteredData.length + ' حركة تحصيل', 'success');
                }

            } catch (error) {
                console.error('❌ خطأ:', error);
                showToast('❌ خطأ', error.message, 'error');
            }

            overlay.classList.remove('active');
        }

        // ============================================================
        // INIT
        // ============================================================
        (async function init() {
            console.log('📊 تحصيلات العملاء - QuickData ProSoft');

            setDefaultDates();

            var token = getToken();
            if (!token) {
                showToast('⚠️ تنبيه', 'يرجى تسجيل الدخول لعرض البيانات', 'warning');
                var refreshed = await refreshSession();
                if (!refreshed) {
                    redirectToLogin();
                    return;
                }
            }

            try {
                await loadData();
                setTimeout(function() {
                    startSessionMonitor();
                }, 3000);
            } catch (e) {
                console.error('❌ خطأ في تحميل البيانات:', e);
                showToast('❌ خطأ', 'حدث خطأ في تحميل البيانات', 'error');
            }
        })();
    </script>

</body>
</html>
