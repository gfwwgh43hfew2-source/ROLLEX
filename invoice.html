<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>فاتورة المبيعات - شركة رولكس</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800;900&display=swap" rel="stylesheet" />
    <style>
        /* ============================================================
           RESET & BASE
           ============================================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Cairo', 'Segoe UI', Tahoma, Arial, sans-serif;
            background: #0a0f1f;
            color: #e8e8e8;
            direction: rtl;
            overflow-x: hidden;
            scroll-behavior: smooth;
            min-height: 100vh;
            background: radial-gradient(ellipse at 10% 20%, rgba(245, 200, 66, 0.04) 0%, transparent 50%),
                radial-gradient(ellipse at 90% 80%, rgba(245, 200, 66, 0.02) 0%, transparent 50%),
                #0a0f1f;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 0 8px;
        }

        ::-webkit-scrollbar {
            width: 5px;
        }
        ::-webkit-scrollbar-track {
            background: #0a0f1f;
        }
        ::-webkit-scrollbar-thumb {
            background: #f5c842;
            border-radius: 10px;
        }

        /* ============================================================
           HEADER
           ============================================================ */
        header {
            position: sticky;
            top: 0;
            z-index: 1000;
            padding: 10px 0;
            background: rgba(10, 15, 31, 0.92);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(245, 200, 66, 0.06);
        }

        header .container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 12px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-icon {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, #f5c842, #d4a020);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            font-weight: 900;
            color: #0a0f1f;
            box-shadow: 0 4px 20px rgba(245, 200, 66, 0.15);
        }

        .logo-text h1 {
            font-size: 1rem;
            font-weight: 900;
            background: linear-gradient(135deg, #f5c842, #d4a020);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1.2;
        }

        .logo-text span {
            font-size: 0.45rem;
            color: rgba(255, 255, 255, 0.25);
            display: block;
            -webkit-text-fill-color: rgba(255, 255, 255, 0.25);
        }

        nav {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        nav a {
            color: rgba(255, 255, 255, 0.35);
            font-weight: 600;
            font-size: 0.75rem;
            transition: 0.3s;
            position: relative;
            padding: 4px 0;
        }

        nav a::after {
            content: '';
            position: absolute;
            bottom: -2px;
            right: 0;
            width: 0;
            height: 2px;
            background: linear-gradient(90deg, #f5c842, #d4a020);
            transition: 0.3s;
            border-radius: 10px;
        }

        nav a:hover {
            color: #fff;
        }
        nav a:hover::after {
            width: 100%;
        }
        nav a.active {
            color: #f5c842;
        }
        nav a.active::after {
            width: 100%;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .header-actions button {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            background: rgba(255, 255, 255, 0.03);
            color: rgba(255, 255, 255, 0.3);
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
        }

        .header-actions button:hover {
            background: rgba(245, 200, 66, 0.08);
            border-color: rgba(245, 200, 66, 0.12);
            color: #f5c842;
        }

        .hamburger {
            display: none;
            font-size: 1.1rem;
            color: #fff;
            cursor: pointer;
            padding: 6px 10px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            background: rgba(255, 255, 255, 0.03);
        }

        /* ============================================================
           MOBILE NAV
           ============================================================ */
        .mobile-nav-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 999;
            backdrop-filter: blur(4px);
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
        }

        .mobile-nav-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .mobile-nav-menu {
            display: none;
            position: fixed;
            top: 0;
            right: -270px;
            width: 260px;
            height: 100vh;
            background: rgba(10, 15, 31, 0.98);
            backdrop-filter: blur(20px);
            border-left: 1px solid rgba(245, 200, 66, 0.05);
            z-index: 1000;
            padding: 60px 18px 30px;
            transition: right 0.3s ease;
            overflow-y: auto;
            box-shadow: -5px 0 30px rgba(0, 0, 0, 0.4);
        }

        .mobile-nav-menu.open {
            right: 0;
        }

        .mobile-nav-menu .close-btn {
            position: absolute;
            top: 12px;
            left: 12px;
            font-size: 1.3rem;
            color: rgba(255, 255, 255, 0.4);
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .mobile-nav-menu .close-btn:hover {
            background: rgba(245, 200, 66, 0.06);
            color: #f5c842;
        }

        .mobile-nav-menu .menu-items a {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 12px;
            border-radius: 8px;
            color: rgba(255, 255, 255, 0.6);
            font-weight: 600;
            font-size: 0.85rem;
            transition: 0.3s;
        }

        .mobile-nav-menu .menu-items a i {
            width: 18px;
        }

        .mobile-nav-menu .menu-items a:hover {
            background: rgba(245, 200, 66, 0.06);
            color: #f5c842;
        }

        .mobile-nav-menu .menu-items a.active {
            background: rgba(245, 200, 66, 0.08);
            color: #f5c842;
        }

        .mobile-nav-bottom {
            display: none;
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 998;
            background: rgba(10, 15, 31, 0.95);
            backdrop-filter: blur(12px);
            border-top: 1px solid rgba(245, 200, 66, 0.05);
            padding: 5px 0 calc(5px + env(safe-area-inset-bottom));
        }

        .mobile-nav-bottom ul {
            display: flex;
            justify-content: space-around;
            list-style: none;
        }

        .mobile-nav-bottom ul li {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1px;
            font-size: 0.4rem;
            color: rgba(255, 255, 255, 0.4);
            transition: 0.3s;
            padding: 3px 8px;
            border-radius: 6px;
        }

        .mobile-nav-bottom ul li i {
            font-size: 0.9rem;
        }

        .mobile-nav-bottom ul li:hover,
        .mobile-nav-bottom ul li.active {
            color: #f5c842;
        }

        /* ============================================================
           INVOICE FORM - بدون هوامش جانبية
           ============================================================ */
        .invoice-form {
            background: rgba(18, 26, 46, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 16px;
            padding: 20px 20px 26px 20px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            margin: 12px 0 16px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            position: relative;
            overflow: hidden;
        }

        .invoice-form::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(245, 200, 66, 0.02), transparent 70%);
            pointer-events: none;
        }

        .invoice-form .form-title {
            font-size: 0.7rem;
            color: rgba(255, 255, 255, 0.2);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            padding-bottom: 8px;
        }

        .invoice-form .form-title i {
            color: #f5c842;
            font-size: 0.8rem;
        }

        .invoice-form .form-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
            gap: 10px;
            margin-bottom: 10px;
        }

        .invoice-form .form-row.small-fields {
            grid-template-columns: 1fr 1fr 1fr;
        }

        .invoice-form .form-row.client-row {
            grid-template-columns: 1fr;
        }

        .invoice-form .form-row.client-row .form-group input {
            max-width: 100%;
        }

        .invoice-form .form-group {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .invoice-form .form-group label {
            font-size: 0.6rem;
            color: rgba(255, 255, 255, 0.3);
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 4px;
            letter-spacing: 0.2px;
        }

        .invoice-form .form-group label .required {
            color: #ef5350;
            font-size: 0.5rem;
        }

        .invoice-form .form-group input,
        .invoice-form .form-group select {
            padding: 8px 12px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            background: rgba(255, 255, 255, 0.03);
            color: #e8e8e8;
            font-size: 0.85rem;
            font-family: inherit;
            transition: all 0.3s ease;
            outline: none;
            width: 100%;
            height: 38px;
        }

        .invoice-form .form-group input:focus,
        .invoice-form .form-group select:focus {
            border-color: rgba(245, 200, 66, 0.4);
            background: rgba(245, 200, 66, 0.04);
            box-shadow: 0 0 0 3px rgba(245, 200, 66, 0.04);
        }

        .invoice-form .form-group input::placeholder {
            color: rgba(255, 255, 255, 0.12);
        }

        .invoice-form .form-group select option {
            background: #0a0f1f;
            color: #e8e8e8;
        }

        .invoice-form .form-row.small-fields .form-group input {
            height: 34px;
            font-size: 0.8rem;
            padding: 4px 10px;
        }

        .invoice-form .form-row.small-fields .form-group label {
            font-size: 0.55rem;
        }

        .invoice-form .divider {
            border: none;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
            margin: 12px 0;
        }

        /* ============================================================
           DROPDOWN
           ============================================================ */
        .dropdown-wrapper {
            position: relative;
        }

        .dropdown-wrapper input {
            cursor: pointer;
            padding-left: 32px !important;
        }

        .dropdown-wrapper .dropdown-arrow {
            position: absolute;
            left: 10px;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(255, 255, 255, 0.15);
            pointer-events: none;
            font-size: 0.75rem;
            transition: 0.3s;
        }

        .dropdown-wrapper input:focus+.dropdown-arrow {
            color: #f5c842;
        }

        .dropdown-list {
            display: none;
            position: absolute;
            top: calc(100% + 3px);
            left: 0;
            right: 0;
            background: rgba(18, 26, 46, 0.98);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 10px;
            max-height: 200px;
            overflow-y: auto;
            z-index: 100;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        }

        .dropdown-list.show {
            display: block;
        }

        .dropdown-list .dropdown-item {
            padding: 8px 14px;
            cursor: pointer;
            transition: 0.2s;
            border-bottom: 1px solid rgba(255, 255, 255, 0.02);
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.8rem;
        }

        .dropdown-list .dropdown-item:hover,
        .dropdown-list .dropdown-item.active {
            background: rgba(245, 200, 66, 0.06);
            color: #f5c842;
        }

        .dropdown-list .dropdown-item:last-child {
            border-bottom: none;
        }

        .dropdown-list .dropdown-empty {
            padding: 12px;
            text-align: center;
            color: rgba(255, 255, 255, 0.3);
            font-size: 0.8rem;
        }

        /* ============================================================
           ITEMS TABLE
           ============================================================ */
        .items-table-wrapper {
            background: rgba(255, 255, 255, 0.02);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.03);
            margin-bottom: 12px;
        }

        .items-table-wrapper table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.8rem;
        }

        .items-table-wrapper table thead th {
            background: rgba(26, 47, 68, 0.2);
            color: #f5c842;
            padding: 8px 10px;
            text-align: center;
            font-weight: 700;
            font-size: 0.6rem;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            border-bottom: 1px solid rgba(245, 200, 66, 0.04);
        }

        .items-table-wrapper table tbody td {
            padding: 8px 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.02);
            color: rgba(255, 255, 255, 0.7);
            text-align: center;
            font-size: 0.8rem;
        }

        .items-table-wrapper table tbody tr:last-child td {
            border-bottom: none;
        }

        .items-table-wrapper table tbody tr:hover td {
            background: rgba(245, 200, 66, 0.02);
        }

        .items-table-wrapper table tbody td .btn-remove {
            background: rgba(239, 83, 80, 0.1);
            border: none;
            color: #ef5350;
            padding: 4px 10px;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.3s;
            font-size: 0.65rem;
        }

        .items-table-wrapper table tbody td .btn-remove:hover {
            background: rgba(239, 83, 80, 0.2);
        }

        .items-table-wrapper table tbody td .btn-edit-item {
            background: rgba(245, 200, 66, 0.08);
            border: none;
            color: #f5c842;
            padding: 4px 10px;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.3s;
            font-size: 0.65rem;
            margin-right: 4px;
        }

        .items-table-wrapper table tbody td .btn-edit-item:hover {
            background: rgba(245, 200, 66, 0.15);
        }

        .items-table-wrapper .empty-items {
            text-align: center;
            padding: 20px;
            color: rgba(255, 255, 255, 0.12);
            font-size: 0.8rem;
        }

        .items-table-wrapper .empty-items i {
            font-size: 1.6rem;
            opacity: 0.15;
            margin-bottom: 6px;
            display: block;
        }

        /* ============================================================
           TOTALS
           ============================================================ */
        .totals-section {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: flex-end;
            padding: 10px 16px;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.03);
            margin-bottom: 12px;
        }

        .totals-section .total-item {
            text-align: center;
            min-width: 85px;
            padding: 4px 8px;
        }

        .totals-section .total-item .label {
            font-size: 0.5rem;
            color: rgba(255, 255, 255, 0.2);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .totals-section .total-item .value {
            font-size: 1.1rem;
            font-weight: 800;
            color: #f5c842;
            margin-top: 2px;
        }

        .totals-section .total-item .value.green {
            color: #4caf50;
        }

        .totals-section .total-item .value.red {
            color: #ef5350;
        }

        /* ============================================================
           BUTTONS
           ============================================================ */
        .form-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn-save {
            padding: 10px 28px;
            border-radius: 50px;
            background: linear-gradient(135deg, #f5c842, #d4a020);
            border: none;
            color: #0a0f1f;
            font-weight: 700;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 4px 20px rgba(245, 200, 66, 0.12);
            flex: 1;
            justify-content: center;
            height: 40px;
        }

        .btn-save:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 30px rgba(245, 200, 66, 0.25);
        }

        .btn-save:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .btn-add {
            padding: 8px 20px;
            border-radius: 50px;
            background: rgba(76, 175, 80, 0.1);
            border: 1px solid rgba(76, 175, 80, 0.1);
            color: #4caf50;
            font-weight: 700;
            font-size: 0.8rem;
            cursor: pointer;
            transition: 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            height: 38px;
        }

        .btn-add:hover {
            background: rgba(76, 175, 80, 0.2);
            transform: translateY(-2px);
        }

        .btn-reset-form {
            padding: 8px 20px;
            border-radius: 50px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            color: rgba(255, 255, 255, 0.35);
            font-weight: 600;
            font-size: 0.8rem;
            cursor: pointer;
            transition: 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            height: 38px;
        }

        .btn-reset-form:hover {
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
        }

        /* ============================================================
           TOAST
           ============================================================ */
        .toast-container {
            position: fixed;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 99999;
            max-width: 400px;
            width: 90%;
            pointer-events: none;
        }

        .toast {
            background: rgba(18, 26, 46, 0.95);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 12px;
            padding: 12px 18px;
            display: flex;
            align-items: center;
            gap: 10px;
            transform: translateY(10px);
            transition: all 0.3s ease;
            opacity: 0;
            pointer-events: auto;
            border-right: 3px solid #f5c842;
        }

        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }

        .toast .toast-icon {
            font-size: 1rem;
            width: 30px;
            height: 30px;
            min-width: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .toast .toast-icon.success {
            color: #4caf50;
            background: rgba(76, 175, 80, 0.1);
        }

        .toast .toast-icon.error {
            color: #ef5350;
            background: rgba(239, 83, 80, 0.1);
        }

        .toast .toast-icon.warning {
            color: #f5c842;
            background: rgba(245, 200, 66, 0.1);
        }

        .toast .toast-close {
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.3);
            cursor: pointer;
            font-size: 0.85rem;
            padding: 4px;
        }

        /* ============================================================
           RESPONSIVE
           ============================================================ */
        @media (min-width: 769px) {
            .mobile-nav-bottom {
                display: none !important;
            }
            .mobile-nav-overlay {
                display: none !important;
            }
            .mobile-nav-menu {
                display: none !important;
            }
            .hamburger {
                display: none !important;
            }
            nav {
                display: flex !important;
            }
            .container {
                padding: 0 12px;
            }
        }

        @media (max-width: 768px) {
            nav {
                display: none !important;
            }
            .hamburger {
                display: flex !important;
            }
            .mobile-nav-bottom {
                display: flex !important;
            }
            .mobile-nav-menu {
                display: block;
            }
            .mobile-nav-overlay {
                display: block;
            }
            .mobile-nav-menu.open {
                right: 0;
            }
            .mobile-nav-overlay.active {
                opacity: 1;
                pointer-events: auto;
            }
            .invoice-form {
                padding: 16px 14px 20px 14px;
            }
            .invoice-form .form-row {
                grid-template-columns: 1fr 1fr;
                gap: 8px;
            }
            .invoice-form .form-row.small-fields {
                grid-template-columns: 1fr 1fr;
            }
            .invoice-form .form-row.client-row {
                grid-template-columns: 1fr;
            }
            .totals-section {
                justify-content: center;
            }
            .form-actions {
                flex-direction: column;
            }
            .form-actions .btn-save,
            .form-actions .btn-add,
            .form-actions .btn-reset-form {
                width: 100%;
                justify-content: center;
                height: 42px;
            }
            .container {
                padding: 0 8px;
            }
            .items-table-wrapper table {
                font-size: 0.7rem;
            }
            .items-table-wrapper table thead th,
            .items-table-wrapper table tbody td {
                padding: 5px 6px;
            }
            .totals-section .total-item {
                min-width: 65px;
            }
            .totals-section .total-item .value {
                font-size: 1rem;
            }
        }

        @media (max-width: 480px) {
            .invoice-form {
                padding: 12px 10px 16px 10px;
            }
            .invoice-form .form-row {
                grid-template-columns: 1fr;
            }
            .invoice-form .form-row.small-fields {
                grid-template-columns: 1fr;
            }
            .invoice-form .form-row.client-row {
                grid-template-columns: 1fr;
            }
            .invoice-form .form-group input,
            .invoice-form .form-group select {
                font-size: 0.75rem;
                padding: 6px 10px;
                height: 36px;
            }
            .items-table-wrapper table {
                font-size: 0.6rem;
            }
            .items-table-wrapper table thead th,
            .items-table-wrapper table tbody td {
                padding: 4px 4px;
            }
            .totals-section .total-item .value {
                font-size: 0.9rem;
            }
            .toast {
                padding: 8px 12px;
                font-size: 0.7rem;
            }
        }
    </style>
</head>
<body>

    <!-- ============================================================
    HEADER
    ============================================================ -->
    <header id="header">
        <div class="container">
            <div class="logo">
                <div class="logo-icon">🧾</div>
                <div class="logo-text">
                    <h1>فاتورة المبيعات</h1>
                    <span>شركة رولكس للدهانات</span>
                </div>
            </div>
            <nav>
                <a href="treasury.html">الخزينة</a>
                <a href="sales.html">المبيعات</a>
                <a href="#" class="active">فاتورة جديدة</a>
                <a href="#">التقارير</a>
            </nav>
            <div class="header-actions">
                <button aria-label="بحث"><i class="fas fa-search"></i></button>
                <button aria-label="إشعارات"><i class="fas fa-bell"></i></button>
                <div class="hamburger" id="navToggle"><i class="fas fa-bars"></i></div>
            </div>
        </div>
    </header>

    <!-- ============================================================
    MOBILE NAV
    ============================================================ -->
    <div class="mobile-nav-overlay" id="mobileOverlay"></div>
    <div class="mobile-nav-menu" id="mobileMenu">
        <div class="close-btn" id="closeMenu"><i class="fas fa-times"></i></div>
        <div class="menu-items">
            <a href="treasury.html"><i class="fas fa-coins"></i> الخزينة</a>
            <a href="sales.html"><i class="fas fa-chart-line"></i> المبيعات</a>
            <a href="#" class="active"><i class="fas fa-file-invoice"></i> فاتورة جديدة</a>
            <a href="#"><i class="fas fa-chart-pie"></i> التقارير</a>
        </div>
    </div>

    <!-- ============================================================
    MOBILE BOTTOM NAV
    ============================================================ -->
    <nav class="mobile-nav-bottom" id="mobileNavBottom">
        <ul>
            <li><a href="treasury.html"><i class="fas fa-coins"></i><span>الخزينة</span></a></li>
            <li><a href="sales.html"><i class="fas fa-chart-line"></i><span>المبيعات</span></a></li>
            <li class="active"><a href="#"><i class="fas fa-file-invoice"></i><span>فاتورة</span></a></li>
            <li><a href="#"><i class="fas fa-chart-pie"></i><span>التقارير</span></a></li>
        </ul>
    </nav>

    <!-- ============================================================
    TOAST CONTAINER
    ============================================================ -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- ============================================================
    PAGE CONTENT
    ============================================================ -->
    <div class="container">

        <!-- ===== INVOICE FORM ===== -->
        <div class="invoice-form" id="invoiceForm">

            <div class="form-title">
                <i class="fas fa-file-invoice"></i>
                بيانات الفاتورة
            </div>

            <!-- بيانات الفاتورة -->
            <div class="form-row small-fields">
                <div class="form-group">
                    <label>رقم الفاتورة <span class="required">*</span></label>
                    <input type="text" id="invoiceNumber" placeholder="مثال: INV-001" />
                </div>
                <div class="form-group">
                    <label>التاريخ <span class="required">*</span></label>
                    <input type="date" id="invoiceDate" />
                </div>
                <div class="form-group">
                    <label>المندوب <span class="required">*</span></label>
                    <input type="text" id="salesman" placeholder="اسم المندوب" />
                </div>
            </div>

            <!-- اسم العميل - صف منفصل لتقليل العرض -->
            <div class="form-row client-row">
                <div class="form-group dropdown-wrapper">
                    <label>اسم العميل <span class="required">*</span></label>
                    <input type="text" id="clientName" placeholder="ابحث عن عميل..." autocomplete="off" />
                    <span class="dropdown-arrow"><i class="fas fa-chevron-down"></i></span>
                    <div class="dropdown-list" id="clientDropdown"></div>
                </div>
            </div>

            <div class="divider"></div>

            <div class="form-title" style="margin-top:0;">
                <i class="fas fa-boxes"></i>
                تفاصيل الأصناف
            </div>

            <!-- إدخال الأصناف -->
            <div class="form-row" style="grid-template-columns:2fr 1fr 1fr;">
                <div class="form-group dropdown-wrapper">
                    <label>المنتج <span class="required">*</span></label>
                    <input type="text" id="itemName" placeholder="ابحث عن منتج..." autocomplete="off" />
                    <span class="dropdown-arrow"><i class="fas fa-chevron-down"></i></span>
                    <div class="dropdown-list" id="productDropdown"></div>
                </div>
                <div class="form-group">
                    <label>الكمية <span class="required">*</span></label>
                    <input type="number" id="itemQuantity" placeholder="0" min="0.1" step="0.1" />
                </div>
                <div class="form-group">
                    <label>سعر الوحدة <span class="required">*</span></label>
                    <input type="number" id="itemPrice" placeholder="0.00" min="0" step="0.01" />
                </div>
            </div>

            <!-- الوحدة والوزن واللون -->
            <div class="form-row" style="grid-template-columns:1fr 1fr 1fr;">
                <div class="form-group">
                    <label>الوحدة <span class="required">*</span></label>
                    <select id="itemUnit">
                        <option value="كجم">كجم</option>
                        <option value="لتر">لتر</option>
                        <option value="عبوة">عبوة</option>
                        <option value="قطعة">قطعة</option>
                        <option value="متر">متر</option>
                        <option value="طرد">طرد</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>الوزن (اختياري)</label>
                    <input type="number" id="itemWeight" placeholder="0.00" min="0" step="0.01" />
                </div>
                <div class="form-group">
                    <label>اللون (اختياري)</label>
                    <input type="text" id="itemColor" placeholder="لون المنتج" />
                </div>
            </div>

            <!-- أزرار -->
            <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;">
                <button class="btn-add" id="btnAddItem"><i class="fas fa-plus"></i> إضافة صنف</button>
                <button class="btn-reset-form" id="btnClearItem"><i class="fas fa-undo"></i> تفريغ</button>
            </div>

            <!-- ===== ITEMS TABLE ===== -->
            <div class="items-table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th style="width:35px;">#</th>
                            <th style="text-align:right;">المنتج</th>
                            <th style="width:65px;">الكمية</th>
                            <th style="width:65px;">الوحدة</th>
                            <th style="width:75px;">السعر</th>
                            <th style="width:85px;">الإجمالي</th>
                            <th style="width:85px;">إجراء</th>
                        </tr>
                    </thead>
                    <tbody id="itemsBody">
                        <tr>
                            <td colspan="7">
                                <div class="empty-items">
                                    <i class="fas fa-box-open"></i>
                                    <p>لا توجد أصناف مضافة</p>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <!-- ===== TOTALS ===== -->
            <div class="totals-section">
                <div class="total-item">
                    <div class="label">الإجمالي</div>
                    <div class="value" id="totalAmount">0.00</div>
                </div>
                <div class="total-item">
                    <div class="label">الخصم</div>
                    <div class="value red" id="discountAmount">0.00</div>
                </div>
                <div class="total-item">
                    <div class="label">الصافي</div>
                    <div class="value green" id="netAmount">0.00</div>
                </div>
            </div>

            <!-- ===== FORM ACTIONS ===== -->
            <div class="form-actions">
                <button class="btn-save" id="btnSaveInvoice"><i class="fas fa-save"></i> حفظ الفاتورة</button>
                <button class="btn-reset-form" id="btnResetAll"><i class="fas fa-undo-alt"></i> إلغاء الكل</button>
            </div>
        </div>

    </div>

    <!-- ============================================================
    JAVASCRIPT
    ============================================================ -->
    <script>
        // ============================================================
        // HEADER SCROLL
        // ============================================================
        var header = document.getElementById('header');
        window.addEventListener('scroll', function() {
            if (window.pageYOffset > 10) {
                header.style.background = 'rgba(10, 15, 31, 0.95)';
                header.style.borderBottom = '1px solid rgba(245, 200, 66, 0.06)';
            } else {
                header.style.background = 'rgba(10, 15, 31, 0.92)';
                header.style.borderBottom = '1px solid rgba(245, 200, 66, 0.05)';
            }
        });

        // ============================================================
        // MOBILE NAV
        // ============================================================
        var navToggle = document.getElementById('navToggle');
        var mobileMenu = document.getElementById('mobileMenu');
        var mobileOverlay = document.getElementById('mobileOverlay');
        var closeMenu = document.getElementById('closeMenu');

        function openMenu() {
            mobileMenu.classList.add('open');
            mobileOverlay.classList.add('active');
            document.body.style.overflow = 'hidden';
            navToggle.innerHTML = '<i class="fas fa-times"></i>';
            navToggle.classList.add('open');
        }

        function closeMenuFn() {
            mobileMenu.classList.remove('open');
            mobileOverlay.classList.remove('active');
            document.body.style.overflow = '';
            navToggle.innerHTML = '<i class="fas fa-bars"></i>';
            navToggle.classList.remove('open');
        }

        navToggle.addEventListener('click', function() {
            if (mobileMenu.classList.contains('open')) {
                closeMenuFn();
            } else {
                openMenu();
            }
        });

        closeMenu.addEventListener('click', closeMenuFn);
        mobileOverlay.addEventListener('click', closeMenuFn);

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape' && mobileMenu.classList.contains('open')) {
                closeMenuFn();
            }
        });

        window.addEventListener('resize', function() {
            if (window.innerWidth > 768 && mobileMenu.classList.contains('open')) {
                closeMenuFn();
            }
        });

        // ============================================================
        // DOM REFS
        // ============================================================
        var invoiceNumber = document.getElementById('invoiceNumber');
        var invoiceDate = document.getElementById('invoiceDate');
        var clientName = document.getElementById('clientName');
        var salesman = document.getElementById('salesman');
        var itemName = document.getElementById('itemName');
        var itemQuantity = document.getElementById('itemQuantity');
        var itemPrice = document.getElementById('itemPrice');
        var itemUnit = document.getElementById('itemUnit');
        var itemWeight = document.getElementById('itemWeight');
        var itemColor = document.getElementById('itemColor');
        var btnAddItem = document.getElementById('btnAddItem');
        var btnClearItem = document.getElementById('btnClearItem');
        var btnSaveInvoice = document.getElementById('btnSaveInvoice');
        var btnResetAll = document.getElementById('btnResetAll');
        var itemsBody = document.getElementById('itemsBody');
        var totalAmount = document.getElementById('totalAmount');
        var discountAmount = document.getElementById('discountAmount');
        var netAmount = document.getElementById('netAmount');
        var clientDropdown = document.getElementById('clientDropdown');
        var productDropdown = document.getElementById('productDropdown');

        // ============================================================
        // STATE
        // ============================================================
        var items = [];
        var clients = [];
        var products = [];
        var editIndex = -1;

        // ============================================================
        // CONFIG
        // ============================================================
        var SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbz7ng74zPmKd-4SS_dquriU-G0llIAedNxiw1A9mvXa-XbHQB8hfROWLdVNxO8u2SsE4Q/exec';

        // ============================================================
        // SET DEFAULT DATE
        // ============================================================
        (function() {
            var today = new Date();
            invoiceDate.value = today.toISOString().split('T')[0];
            var dateStr = today.toISOString().slice(0, 10).replace(/-/g, '');
            invoiceNumber.value = 'INV-' + dateStr + '-' + String(Math.floor(Math.random() * 1000)).padStart(3, '0');
        })();

        // ============================================================
        // TOAST
        // ============================================================
        function showToast(title, message, type) {
            var container = document.getElementById('toastContainer');
            var toast = document.createElement('div');
            toast.className = 'toast';

            var iconClass = 'warning';
            if (type === 'success') iconClass = 'success';
            else if (type === 'error') iconClass = 'error';

            var iconMap = {
                'success': 'fa-check-circle',
                'error': 'fa-times-circle',
                'warning': 'fa-exclamation-triangle'
            };

            toast.innerHTML = '' +
                '<div class="toast-icon ' + iconClass + '"><i class="fas ' + (iconMap[type] || 'fa-info-circle') +
                '"></i></div>' +
                '<div class="toast-content">' +
                '<div class="toast-title">' + title + '</div>' +
                '<div class="toast-message">' + message + '</div>' +
                '</div>' +
                '<button class="toast-close"><i class="fas fa-times"></i></button>';

            container.appendChild(toast);

            requestAnimationFrame(function() {
                toast.classList.add('show');
            });

            var timeout = setTimeout(function() {
                if (toast.parentElement) {
                    toast.classList.remove('show');
                    setTimeout(function() {
                        if (toast.parentElement) toast.remove();
                    }, 300);
                }
            }, 3000);

            toast.addEventListener('click', function(e) {
                if (e.target.closest('.toast-close') || e.target.closest('.toast-icon')) {
                    clearTimeout(timeout);
                    toast.classList.remove('show');
                    setTimeout(function() {
                        if (toast.parentElement) toast.remove();
                    }, 300);
                }
            });
        }

        // ============================================================
        // LOAD DATA
        // ============================================================
        function loadData() {
            fetch(SCRIPT_URL + '?action=getAll')
                .then(function(response) {
                    if (!response.ok) throw new Error('HTTP error! status: ' + response.status);
                    return response.json();
                })
                .then(function(data) {
                    if (data.success) {
                        clients = data.clients || [];
                        products = data.products || [];
                        console.log('✅ العملاء:', clients.length, 'المنتجات:', products.length);

                        try {
                            localStorage.setItem('rollex_clients', JSON.stringify(clients));
                            localStorage.setItem('rollex_products', JSON.stringify(products));
                        } catch (e) {}

                        updateDropdowns();
                    } else {
                        useDefaultData();
                    }
                })
                .catch(function(error) {
                    console.error('❌ خطأ في جلب البيانات:', error);
                    try {
                        var savedClients = localStorage.getItem('rollex_clients');
                        var savedProducts = localStorage.getItem('rollex_products');
                        if (savedClients) clients = JSON.parse(savedClients);
                        if (savedProducts) products = JSON.parse(savedProducts);
                        if (clients.length > 0 || products.length > 0) {
                            console.log('✅ تم تحميل البيانات من LocalStorage');
                            updateDropdowns();
                            return;
                        }
                    } catch (e) {}
                    useDefaultData();
                });
        }

        function useDefaultData() {
            clients = ['شركة النور للتجارة', 'مؤسسة الصفا', 'شركة الاتحاد', 'مؤسسة الأمل', 'شركة الوفاء', 'شركة البركة', 'مؤسسة النجاح'];
            products = ['دهان داخلي أبيض', 'دهان خارجي أزرق', 'ورنيش شفاف', 'معجون جدران', 'دهان أسقف', 'بوية خشب', 'أكريلك'];
            console.log('⚠️ تم استخدام بيانات افتراضية');
            updateDropdowns();
        }

        // ============================================================
        // CUSTOM DROPDOWN
        // ============================================================
        function setupDropdown(input, dropdown, dataList) {
            var selectedIndex = -1;

            input.addEventListener('focus', function() {
                var query = this.value.trim().toLowerCase();
                renderDropdown(query);
            });

            input.addEventListener('input', function() {
                var query = this.value.trim().toLowerCase();
                renderDropdown(query);
            });

            document.addEventListener('click', function(e) {
                if (!e.target.closest('.dropdown-wrapper')) {
                    dropdown.classList.remove('show');
                }
            });

            input.addEventListener('keydown', function(e) {
                var items = dropdown.querySelectorAll('.dropdown-item:not(.dropdown-empty)');
                if (items.length === 0) return;

                if (e.key === 'ArrowDown') {
                    e.preventDefault();
                    selectedIndex = Math.min(selectedIndex + 1, items.length - 1);
                    updateActive(items);
                } else if (e.key === 'ArrowUp') {
                    e.preventDefault();
                    selectedIndex = Math.max(selectedIndex - 1, 0);
                    updateActive(items);
                } else if (e.key === 'Enter') {
                    e.preventDefault();
                    if (selectedIndex >= 0 && selectedIndex < items.length) {
                        var val = items[selectedIndex].dataset.value;
                        input.value = val;
                        dropdown.classList.remove('show');
                        selectedIndex = -1;
                        if (input.id === 'clientName') {
                            salesman.focus();
                        } else if (input.id === 'itemName') {
                            itemQuantity.focus();
                        }
                    }
                } else if (e.key === 'Escape') {
                    dropdown.classList.remove('show');
                    selectedIndex = -1;
                }
            });

            function renderDropdown(query) {
                var list = dataList;
                if (list.length === 0) {
                    if (input.id === 'clientName') {
                        list = ['شركة النور للتجارة', 'مؤسسة الصفا', 'شركة الاتحاد', 'مؤسسة الأمل', 'شركة الوفاء'];
                    } else {
                        list = ['دهان داخلي أبيض', 'دهان خارجي أزرق', 'ورنيش شفاف', 'معجون جدران', 'دهان أسقف'];
                    }
                }

                var results = list;
                if (query) {
                    results = list.filter(function(item) {
                        return item.toLowerCase().includes(query);
                    });
                }

                if (results.length === 0) {
                    dropdown.innerHTML = '<div class="dropdown-empty">لا توجد نتائج</div>';
                    dropdown.classList.add('show');
                    return;
                }

                var html = '';
                results.slice(0, 15).forEach(function(item) {
                    html += '<div class="dropdown-item" data-value="' + item + '">' + item + '</div>';
                });

                dropdown.innerHTML = html;
                dropdown.classList.add('show');

                dropdown.querySelectorAll('.dropdown-item').forEach(function(el) {
                    el.addEventListener('click', function() {
                        input.value = this.dataset.value;
                        dropdown.classList.remove('show');
                        selectedIndex = -1;
                        if (input.id === 'clientName') {
                            salesman.focus();
                        } else if (input.id === 'itemName') {
                            itemQuantity.focus();
                        }
                    });

                    el.addEventListener('touchstart', function(e) {
                        e.preventDefault();
                        input.value = this.dataset.value;
                        dropdown.classList.remove('show');
                        selectedIndex = -1;
                        if (input.id === 'clientName') {
                            salesman.focus();
                        } else if (input.id === 'itemName') {
                            itemQuantity.focus();
                        }
                    }, { passive: true });
                });

                selectedIndex = -1;
            }

            function updateActive(items) {
                items.forEach(function(el, index) {
                    if (index === selectedIndex) {
                        el.classList.add('active');
                        el.scrollIntoView({ block: 'nearest' });
                    } else {
                        el.classList.remove('active');
                    }
                });
            }
        }

        function updateDropdowns() {
            clientDropdown.innerHTML = '';
            productDropdown.innerHTML = '';
            setupDropdown(clientName, clientDropdown, clients);
            setupDropdown(itemName, productDropdown, products);
        }

        updateDropdowns();
        loadData();

        // ============================================================
        // ADD ITEM
        // ============================================================
        itemPrice.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                addItem();
            }
        });

        itemQuantity.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                itemPrice.focus();
            }
        });

        // ============================================================
        // ADD ITEM
        // ============================================================
        function addItem() {
            var name = itemName.value.trim();
            var qty = parseFloat(itemQuantity.value);
            var price = parseFloat(itemPrice.value);
            var unit = itemUnit.value;
            var weight = parseFloat(itemWeight.value) || 0;
            var color = itemColor.value.trim();

            if (!name) {
                showToast('⚠️ تنبيه', 'يرجى إدخال اسم المنتج', 'error');
                itemName.focus();
                return;
            }

            if (!qty || qty <= 0) {
                showToast('⚠️ تنبيه', 'يرجى إدخال كمية صحيحة', 'error');
                itemQuantity.focus();
                return;
            }

            if (!price || price <= 0) {
                showToast('⚠️ تنبيه', 'يرجى إدخال سعر صحيح', 'error');
                itemPrice.focus();
                return;
            }

            var totalItem = qty * price;

            if (editIndex >= 0) {
                items[editIndex] = { name: name, qty: qty, price: price, total: totalItem, unit: unit, weight: weight,
                    color: color };
                editIndex = -1;
                btnAddItem.innerHTML = '<i class="fas fa-plus"></i> إضافة صنف';
                showToast('✏️ تعديل', 'تم تعديل المنتج بنجاح', 'warning');
            } else {
                items.push({ name: name, qty: qty, price: price, total: totalItem, unit: unit, weight: weight,
                    color: color });
                showToast('✅ إضافة', 'تم إضافة المنتج بنجاح', 'success');
            }

            renderItems();
            clearItemFields();
            calculateTotals();
            itemName.focus();
        }

        // ============================================================
        // CLEAR ITEM FIELDS
        // ============================================================
        function clearItemFields() {
            itemName.value = '';
            itemQuantity.value = '';
            itemPrice.value = '';
            itemUnit.value = 'كجم';
            itemWeight.value = '';
            itemColor.value = '';
            productDropdown.classList.remove('show');
        }

        // ============================================================
        // RENDER ITEMS
        // ============================================================
        function renderItems() {
            if (items.length === 0) {
                itemsBody.innerHTML = `
                    <tr>
                        <td colspan="7">
                            <div class="empty-items">
                                <i class="fas fa-box-open"></i>
                                <p>لا توجد أصناف مضافة</p>
                            </div>
                        </td>
                    </tr>
                `;
                return;
            }

            var html = '';
            items.forEach(function(item, index) {
                html += `
                    <tr>
                        <td>${index + 1}</td>
                        <td style="text-align:right;">${item.name}</td>
                        <td>${item.qty}</td>
                        <td>${item.unit || 'كجم'}</td>
                        <td>${item.price.toFixed(2)}</td>
                        <td style="color:#f5c842;font-weight:700;">${item.total.toFixed(2)}</td>
                        <td>
                            <button class="btn-remove" onclick="removeItem(${index})"><i class="fas fa-trash"></i></button>
                            <button class="btn-edit-item" onclick="editItem(${index})"><i class="fas fa-edit"></i></button>
                        </td>
                    </tr>
                `;
            });

            itemsBody.innerHTML = html;
        }

        // ============================================================
        // REMOVE ITEM
        // ============================================================
        function removeItem(index) {
            items.splice(index, 1);
            renderItems();
            calculateTotals();
            showToast('🗑️ حذف', 'تم حذف المنتج بنجاح', 'warning');
        }

        // ============================================================
        // EDIT ITEM
        // ============================================================
        function editItem(index) {
            var item = items[index];
            itemName.value = item.name;
            itemQuantity.value = item.qty;
            itemPrice.value = item.price;
            itemUnit.value = item.unit || 'كجم';
            itemWeight.value = item.weight || '';
            itemColor.value = item.color || '';
            editIndex = index;
            btnAddItem.innerHTML = '<i class="fas fa-edit"></i> تحديث';
            itemName.focus();
            showToast('✏️ تعديل', 'قم بتعديل البيانات ثم اضغط تحديث', 'warning');
        }

        // ============================================================
        // CALCULATE TOTALS
        // ============================================================
        function calculateTotals() {
            var total = 0;
            items.forEach(function(item) {
                total += item.total;
            });

            var discount = 0;
            var net = total - discount;

            totalAmount.textContent = total.toFixed(2);
            discountAmount.textContent = discount.toFixed(2);
            netAmount.textContent = net.toFixed(2);
        }

        // ============================================================
        // BUTTON EVENTS
        // ============================================================
        btnAddItem.addEventListener('click', addItem);

        btnClearItem.addEventListener('click', function() {
            clearItemFields();
            editIndex = -1;
            btnAddItem.innerHTML = '<i class="fas fa-plus"></i> إضافة صنف';
        });

        btnResetAll.addEventListener('click', function() {
            if (items.length > 0) {
                if (!confirm('هل أنت متأكد من إلغاء كل البيانات؟')) return;
            }
            items = [];
            renderItems();
            calculateTotals();
            clearItemFields();
            editIndex = -1;
            btnAddItem.innerHTML = '<i class="fas fa-plus"></i> إضافة صنف';
            invoiceNumber.value = '';
            clientName.value = '';
            salesman.value = '';
            var today = new Date();
            invoiceDate.value = today.toISOString().split('T')[0];
            showToast('🔄 إلغاء', 'تم تفريغ النموذج بالكامل', 'warning');
        });

        // ============================================================
        // SAVE INVOICE
        // ============================================================
        btnSaveInvoice.addEventListener('click', function() {
            var number = invoiceNumber.value.trim();
            var date = invoiceDate.value;
            var client = clientName.value.trim();
            var sales = salesman.value.trim();

            if (!number) {
                showToast('⚠️ تنبيه', 'يرجى إدخال رقم الفاتورة', 'error');
                invoiceNumber.focus();
                return;
            }

            if (!date) {
                showToast('⚠️ تنبيه', 'يرجى إدخال التاريخ', 'error');
                invoiceDate.focus();
                return;
            }

            if (!client) {
                showToast('⚠️ تنبيه', 'يرجى إدخال اسم العميل', 'error');
                clientName.focus();
                return;
            }

            if (!sales) {
                showToast('⚠️ تنبيه', 'يرجى إدخال اسم المندوب', 'error');
                salesman.focus();
                return;
            }

            if (items.length === 0) {
                showToast('⚠️ تنبيه', 'يرجى إضافة منتج واحد على الأقل', 'error');
                itemName.focus();
                return;
            }

            var invoiceData = {
                number: number,
                date: date,
                client: client,
                salesman: sales,
                items: items,
                total: parseFloat(totalAmount.textContent),
                discount: parseFloat(discountAmount.textContent),
                net: parseFloat(netAmount.textContent)
            };

            saveInvoiceToSheet(invoiceData);
        });

        // ============================================================
        // SAVE TO GOOGLE SHEETS
        // ============================================================
        function saveInvoiceToSheet(invoiceData) {
            btnSaveInvoice.disabled = true;
            btnSaveInvoice.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جاري الحفظ...';

            var SHEET_NAME = 'المبيعات والمرتجعات';
            var WEB_APP_URL =
                'https://script.google.com/macros/s/AKfycbwzDyVjlpzCEOsJVYbKwXd_E_k73doYQPQEyB7KeXa3WHEoqTqCKcsXu1w-D_GqAMpCLQ/exec';

            var rows = [];
            invoiceData.items.forEach(function(item) {
                var row = [
                    invoiceData.number,
                    new Date(invoiceData.date).toLocaleString('ar-EG', { month: 'long' }),
                    invoiceData.date,
                    invoiceData.salesman,
                    '',
                    invoiceData.client,
                    '',
                    '',
                    item.total,
                    item.weight || '',
                    item.unit || 'كجم',
                    item.qty,
                    item.price,
                    item.total,
                    '',
                    item.color || '',
                    item.name,
                    ''
                ];
                rows.push(row);
            });

            var promises = rows.map(function(row) {
                return fetch(WEB_APP_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        sheetName: SHEET_NAME,
                        row: row
                    })
                });
            });

            Promise.all(promises)
                .then(function() {
                    showToast('✅ تم الحفظ', 'تم حفظ الفاتورة بنجاح', 'success');
                    btnSaveInvoice.disabled = false;
                    btnSaveInvoice.innerHTML = '<i class="fas fa-save"></i> حفظ الفاتورة';

                    items = [];
                    renderItems();
                    calculateTotals();
                    clearItemFields();
                    editIndex = -1;
                    btnAddItem.innerHTML = '<i class="fas fa-plus"></i> إضافة صنف';
                    clientName.value = '';
                    salesman.value = '';
                    var today = new Date();
                    invoiceDate.value = today.toISOString().split('T')[0];
                    var dateStr = today.toISOString().slice(0, 10).replace(/-/g, '');
                    invoiceNumber.value = 'INV-' + dateStr + '-' + String(Math.floor(Math.random() * 1000)).padStart(3,
                        '0');
                })
                .catch(function(error) {
                    console.error('Error saving invoice:', error);
                    showToast('❌ خطأ', 'حدث خطأ في حفظ الفاتورة', 'error');
                    btnSaveInvoice.disabled = false;
                    btnSaveInvoice.innerHTML = '<i class="fas fa-save"></i> حفظ الفاتورة';
                });
        }

        // ============================================================
        // KEYBOARD SHORTCUTS
        // ============================================================
        document.addEventListener('keydown', function(e) {
            if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
                if (e.target.closest('#invoiceForm')) {
                    e.preventDefault();
                    btnSaveInvoice.click();
                }
            }
            if (e.key === 'Escape') {
                clientDropdown.classList.remove('show');
                productDropdown.classList.remove('show');
            }
        });

        console.log('🧾 فاتورة المبيعات - تم التحميل');
        console.log('📌 استخدم Enter للتنقل بين الحقول');
        console.log('📌 Ctrl+Enter للحفظ');
    </script>

</body>
</html>
