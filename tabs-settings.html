<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>إدارة التبويبات العامة - QuickData ProSoft</title>
    <!-- ... نفس الـ Styles السابقة ... -->
    <style>
        .tabs-manager {
            max-width: 800px;
            margin: 0 auto;
        }
        .tab-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background: var(--surface);
            border-radius: var(--radius);
            border: 1px solid var(--line);
            margin-bottom: 8px;
            transition: all 0.2s;
        }
        .tab-item:hover {
            border-color: var(--brass);
        }
        .tab-item .tab-name {
            font-weight: 600;
        }
        .tab-item .tab-type {
            font-size: 0.7rem;
            color: var(--text-muted);
            background: var(--surface-inset);
            padding: 2px 10px;
            border-radius: 12px;
        }
        .tab-item .tab-actions {
            display: flex;
            gap: 8px;
        }
        .tab-item .tab-actions button {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 4px;
            transition: all 0.2s;
        }
        .tab-item .tab-actions button:hover {
            background: var(--line);
            color: var(--text);
        }
        .tab-item .tab-actions button.delete:hover {
            color: var(--brick);
            background: var(--brick-wash);
        }
        .tab-item.system-tab {
            opacity: 0.7;
            border-left: 3px solid var(--brass);
        }
        .tab-item.system-tab .tab-actions button.delete {
            display: none;
        }
        .add-tab-form {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .add-tab-form input,
        .add-tab-form select {
            padding: 10px 14px;
            border-radius: var(--radius);
            border: 1px solid var(--line);
            background: var(--surface-inset);
            color: var(--text);
            font-family: inherit;
            font-size: 0.85rem;
            outline: none;
            transition: border-color 0.2s;
        }
        .add-tab-form input:focus,
        .add-tab-form select:focus {
            border-color: var(--brass);
        }
        .add-tab-form input { flex: 1; min-width: 180px; }
        .add-tab-form select { min-width: 130px; }
        .add-tab-form button {
            padding: 10px 24px;
            background: var(--brass);
            color: var(--brass-ink);
            border: none;
            border-radius: var(--radius);
            font-weight: 700;
            font-size: 0.85rem;
            cursor: pointer;
            transition: background 0.2s;
            font-family: inherit;
            white-space: nowrap;
        }
        .add-tab-form button:hover { background: var(--brass-bright); }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1><i class="fas fa-tags"></i> إدارة التبويبات العامة</h1>
            <a href="settings.html" class="back-btn"><i class="fas fa-arrow-right"></i> العودة للإعدادات</a>
        </div>

        <div class="tabs-manager">
            <!-- نموذج إضافة تبويب جديد -->
            <div class="add-tab-form" id="addTabForm">
                <input type="text" id="newTabName" placeholder="اسم التبويب الجديد..." required />
                <select id="newTabType">
                    <option value="both">وارد وصادر</option>
                    <option value="in">وارد فقط</option>
                    <option value="out">صادر فقط</option>
                </select>
                <button onclick="addGeneralTab()"><i class="fas fa-plus"></i> إضافة</button>
            </div>

            <!-- قائمة التبويبات -->
            <div id="tabsList">
                <!-- يتم تحميلها عبر JavaScript -->
            </div>
        </div>
    </div>

    <script>
        // ============================================================
        // جلب التبويبات
        // ============================================================
        async function getGeneralTabs() {
            var token = getToken();
            var profile = await getCurrentUserProfile();
            if (!profile) return;

            var response = await fetch(SUPABASE_URL + '/rest/v1/general_tabs?select=*&company_id=eq.' + profile.company_id + '&order=name.asc', {
                headers: {
                    'apikey': SUPABASE_ANON_KEY,
                    'Authorization': 'Bearer ' + token
                }
            });
            if (!response.ok) return [];
            return await response.json();
        }

        // ============================================================
        // عرض التبويبات
        // ============================================================
        async function renderTabs() {
            var tabs = await getGeneralTabs();
            var container = document.getElementById('tabsList');
            
            if (!tabs || tabs.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-tags"></i>
                        <p>لا توجد تبويبات عامة. أضف تبويبك الأول!</p>
                    </div>
                `;
                return;
            }

            var html = '';
            var typeLabels = {
                'in': 'وارد',
                'out': 'صادر',
                'both': 'وارد وصادر'
            };

            tabs.forEach(function(tab) {
                var isSystem = tab.is_system || false;
                var typeLabel = typeLabels[tab.type] || 'وارد وصادر';
                
                html += `
                    <div class="tab-item ${isSystem ? 'system-tab' : ''}">
                        <div>
                            <span class="tab-name">${tab.name}</span>
                            <span class="tab-type">${typeLabel}</span>
                            ${isSystem ? '<span class="tab-type" style="background:var(--brass-wash);color:var(--brass-bright);">نظامي</span>' : ''}
                        </div>
                        <div class="tab-actions">
                            <button onclick="editTab('${tab.id}')" title="تعديل"><i class="fas fa-edit"></i></button>
                            <button class="delete" onclick="deleteTab('${tab.id}')" title="حذف" ${isSystem ? 'disabled' : ''}><i class="fas fa-trash-alt"></i></button>
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        // ============================================================
        // إضافة تبويب جديد
        // ============================================================
        async function addGeneralTab() {
            var nameInput = document.getElementById('newTabName');
            var typeInput = document.getElementById('newTabType');
            var name = nameInput.value.trim();
            var type = typeInput.value;

            if (!name) {
                showToast('⚠️ تنبيه', 'يرجى إدخال اسم التبويب', 'error');
                return;
            }

            var token = getToken();
            var profile = await getCurrentUserProfile();
            if (!profile) return;

            try {
                var response = await fetch(SUPABASE_URL + '/rest/v1/general_tabs', {
                    method: 'POST',
                    headers: {
                        'apikey': SUPABASE_ANON_KEY,
                        'Authorization': 'Bearer ' + token,
                        'Content-Type': 'application/json',
                        'Prefer': 'return=representation'
                    },
                    body: JSON.stringify({
                        company_id: profile.company_id,
                        name: name,
                        type: type,
                        is_active: true,
                        is_system: false,
                        created_by: profile.id
                    })
                });

                if (!response.ok) {
                    var error = await response.json();
                    if (error.message && error.message.includes('duplicate key')) {
                        showToast('⚠️ تنبيه', 'هذا التبويب موجود بالفعل', 'error');
                    } else {
                        throw new Error(error.message || 'فشل الإضافة');
                    }
                    return;
                }

                showToast('✅ تم الإضافة', 'تم إضافة التبويب "' + name + '" بنجاح', 'success');
                nameInput.value = '';
                renderTabs();

            } catch (error) {
                console.error('❌ خطأ:', error);
                showToast('❌ خطأ', error.message, 'error');
            }
        }

        // ============================================================
        // حذف تبويب
        // ============================================================
        async function deleteTab(tabId) {
            if (!confirm('هل أنت متأكد من حذف هذا التبويب؟')) return;

            var token = getToken();

            try {
                var response = await fetch(SUPABASE_URL + '/rest/v1/general_tabs?id=eq.' + tabId, {
                    method: 'DELETE',
                    headers: {
                        'apikey': SUPABASE_ANON_KEY,
                        'Authorization': 'Bearer ' + token
                    }
                });

                if (!response.ok) throw new Error('فشل الحذف');

                showToast('✅ تم الحذف', 'تم حذف التبويب بنجاح', 'success');
                renderTabs();

            } catch (error) {
                console.error('❌ خطأ:', error);
                showToast('❌ خطأ', error.message, 'error');
            }
        }

        // ============================================================
        // INIT
        // ============================================================
        document.addEventListener('DOMContentLoaded', function() {
            renderTabs();
        });
    </script>
</body>
</html>
