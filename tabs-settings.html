<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>إدارة التبويبات العامة - QuickData ProSoft</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* ============================================================
           CSS VARIABLES - نفس الثيم الفاتح الاحترافي
           ============================================================ */
        :root {
            --primary: #1a2332;
            --primary-light: #2c3a4f;
            --secondary: #c9a84c;
            --secondary-light: #e8d5a0;
            --secondary-dark: #b8942a;
            --success: #28a745;
            --danger: #dc3545;
            --info: #17a2b8;
            --warning: #ffc107;
            --gray-50: #f8f9fb;
            --gray-100: #f0f2f5;
            --gray-200: #e8ecf1;
            --gray-300: #dce1e8;
            --gray-400: #b8c4d0;
            --gray-500: #8a96a8;
            --gray-600: #6b7a8d;
            --gray-700: #4a5a6e;
            --gray-800: #2c3a4f;
            --gray-900: #1a2332;
            --white: #ffffff;
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.04);
            --shadow-md: 0 4px 20px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 8px 40px rgba(0, 0, 0, 0.08);
            --shadow-xl: 0 12px 60px rgba(0, 0, 0, 0.12);
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --radius-xl: 20px;
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --font: 'Cairo', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font);
            background: var(--gray-100);
            color: var(--gray-900);
            direction: rtl;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        /* ============================================================
           HEADER
           ============================================================ */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 0;
            border-bottom: 1px solid var(--gray-200);
            margin-bottom: 24px;
            flex-wrap: wrap;
            gap: 12px;
        }

        .header h1 {
            font-size: 1.5rem;
            font-weight: 900;
            color: var(--gray-900);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header h1 i {
            color: var(--secondary);
        }

        .header .back-btn {
            padding: 8px 20px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--gray-200);
            background: var(--white);
            color: var(--gray-600);
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .header .back-btn:hover {
            background: var(--gray-50);
            border-color: var(--gray-300);
            transform: translateY(-1px);
        }

        /* ============================================================
           ADD FORM
           ============================================================ */
        .add-form {
            background: var(--white);
            border-radius: var(--radius-lg);
            padding: 20px 24px;
            border: 1px solid var(--gray-200);
            box-shadow: var(--shadow-sm);
            margin-bottom: 20px;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            align-items: flex-end;
        }

        .add-form .form-group {
            flex: 1;
            min-width: 180px;
        }

        .add-form .form-group label {
            display: block;
            font-size: 0.7rem;
            font-weight: 700;
            color: var(--gray-600);
            margin-bottom: 4px;
        }

        .add-form .form-group input,
        .add-form .form-group select {
            width: 100%;
            padding: 10px 14px;
            border-radius: var(--radius-sm);
            border: 1.5px solid var(--gray-200);
            font-size: 0.85rem;
            font-family: var(--font);
            transition: var(--transition);
            background: var(--gray-50);
            color: var(--gray-900);
            outline: none;
        }

        .add-form .form-group input:focus,
        .add-form .form-group select:focus {
            border-color: var(--secondary);
            background: var(--white);
            box-shadow: 0 0 0 4px rgba(201, 168, 76, 0.06);
        }

        .add-form .btn-add {
            padding: 10px 28px;
            background: linear-gradient(135deg, var(--secondary), var(--secondary-dark));
            color: var(--white);
            border: none;
            border-radius: var(--radius-sm);
            font-weight: 700;
            font-size: 0.85rem;
            cursor: pointer;
            transition: var(--transition);
            font-family: var(--font);
            display: inline-flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 2px 12px rgba(201, 168, 76, 0.15);
            height: 44px;
            white-space: nowrap;
        }

        .add-form .btn-add:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 20px rgba(201, 168, 76, 0.25);
        }

        .add-form .btn-add:active {
            transform: scale(0.97);
        }

        /* ============================================================
           TABS LIST
           ============================================================ */
        .tabs-list {
            background: var(--white);
            border-radius: var(--radius-lg);
            border: 1px solid var(--gray-200);
            box-shadow: var(--shadow-sm);
            overflow: hidden;
        }

        .tabs-list .list-header {
            display: grid;
            grid-template-columns: 1fr 0.5fr 0.4fr;
            padding: 12px 20px;
            background: var(--gray-50);
            border-bottom: 1px solid var(--gray-200);
            font-size: 0.65rem;
            font-weight: 700;
            color: var(--gray-500);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .tab-item {
            display: grid;
            grid-template-columns: 1fr 0.5fr 0.4fr;
            padding: 12px 20px;
            border-bottom: 1px solid var(--gray-100);
            transition: var(--transition);
            align-items: center;
        }

        .tab-item:hover {
            background: var(--gray-50);
        }

        .tab-item:last-child {
            border-bottom: none;
        }

        .tab-item .tab-name {
            font-weight: 600;
            font-size: 0.85rem;
            color: var(--gray-800);
        }

        .tab-item .tab-type {
            font-size: 0.65rem;
            font-weight: 600;
            color: var(--gray-500);
            background: var(--gray-100);
            padding: 2px 12px;
            border-radius: 50px;
            display: inline-block;
            width: fit-content;
        }

        .tab-item .tab-type.in { background: rgba(40, 167, 69, 0.08); color: var(--success); }
        .tab-item .tab-type.out { background: rgba(220, 53, 69, 0.08); color: var(--danger); }
        .tab-item .tab-type.both { background: rgba(201, 168, 76, 0.08); color: var(--secondary); }

        .tab-item .tab-actions {
            display: flex;
            gap: 6px;
            justify-content: flex-end;
        }

        .tab-item .tab-actions button {
            width: 32px;
            height: 32px;
            border: none;
            border-radius: var(--radius-sm);
            background: transparent;
            color: var(--gray-500);
            cursor: pointer;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
        }

        .tab-item .tab-actions button:hover {
            background: var(--gray-100);
            color: var(--gray-700);
        }

        .tab-item .tab-actions button.delete:hover {
            background: rgba(220, 53, 69, 0.08);
            color: var(--danger);
        }

        .tab-item.system-tab {
            background: var(--gray-50);
            opacity: 0.7;
        }

        .tab-item.system-tab .tab-actions button.delete {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .tab-item.system-tab .tab-actions button.delete:hover {
            background: transparent;
            color: var(--gray-500);
        }

        /* ============================================================
           EMPTY STATE
           ============================================================ */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--gray-500);
        }

        .empty-state i {
            font-size: 3rem;
            display: block;
            margin-bottom: 12px;
            color: var(--gray-300);
        }

        .empty-state h3 {
            font-size: 1.1rem;
            color: var(--gray-700);
            margin-bottom: 4px;
        }

        .empty-state p {
            font-size: 0.8rem;
        }

        /* ============================================================
           TOAST
           ============================================================ */
        .toast-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-width: 380px;
            width: 90%;
            pointer-events: none;
        }

        .toast {
            background: var(--white);
            padding: 14px 18px;
            border-radius: var(--radius-md);
            border-right: 4px solid var(--secondary);
            box-shadow: var(--shadow-lg);
            display: flex;
            align-items: center;
            gap: 12px;
            transform: translateX(20px);
            opacity: 0;
            transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            pointer-events: auto;
        }

        .toast.show {
            transform: translateX(0);
            opacity: 1;
        }

        .toast.success { border-right-color: var(--success); }
        .toast.error { border-right-color: var(--danger); }
        .toast.warning { border-right-color: var(--warning); }

        .toast .icon { font-size: 1.1rem; width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .toast .icon.success { background: rgba(40, 167, 69, 0.08); color: var(--success); }
        .toast .icon.error { background: rgba(220, 53, 69, 0.08); color: var(--danger); }
        .toast .icon.warning { background: rgba(255, 193, 7, 0.08); color: var(--warning); }

        .toast .content .title { font-size: 0.85rem; font-weight: 700; color: var(--gray-900); }
        .toast .content .message { font-size: 0.7rem; color: var(--gray-500); }
        .toast .close { background: none; border: none; color: var(--gray-400); cursor: pointer; font-size: 0.9rem; margin-right: auto; padding: 4px; }
        .toast .close:hover { color: var(--gray-600); }

        /* ============================================================
           RESPONSIVE
           ============================================================ */
        @media (max-width: 768px) {
            .header h1 { font-size: 1.2rem; }
            .add-form { flex-direction: column; align-items: stretch; }
            .add-form .form-group { min-width: 0; }
            .tabs-list .list-header { display: none; }
            .tab-item { grid-template-columns: 1fr; gap: 6px; padding: 14px 16px; border-bottom: 1px solid var(--gray-200); }
            .tab-item .tab-actions { justify-content: flex-start; }
            .tab-item .tab-type { display: inline-block; }
        }

        @media (max-width: 480px) {
            body { padding: 12px; }
            .header { flex-direction: column; align-items: flex-start; }
            .header .back-btn { width: 100%; justify-content: center; }
            .add-form .btn-add { width: 100%; justify-content: center; }
            .toast-container { top: 12px; right: 12px; max-width: 95%; }
        }
    </style>
</head>
<body>

    <div class="container">

        <!-- ===== HEADER ===== -->
        <div class="header">
            <h1><i class="fas fa-tags"></i> إدارة التبويبات العامة</h1>
            <a href="settings.html" class="back-btn"><i class="fas fa-arrow-right"></i> العودة للإعدادات</a>
        </div>

        <!-- ===== ADD FORM ===== -->
        <div class="add-form">
            <div class="form-group">
                <label>اسم التبويب <span style="color:var(--danger);">*</span></label>
                <input type="text" id="newTabName" placeholder="مثال: تحصيلات العملاء" />
            </div>
            <div class="form-group">
                <label>النوع</label>
                <select id="newTabType">
                    <option value="both">وارد وصادر</option>
                    <option value="in">وارد فقط</option>
                    <option value="out">صادر فقط</option>
                </select>
            </div>
            <button class="btn-add" onclick="addGeneralTab()">
                <i class="fas fa-plus"></i> إضافة
            </button>
        </div>

        <!-- ===== TABS LIST ===== -->
        <div class="tabs-list">
            <div class="list-header">
                <span>اسم التبويب</span>
                <span>النوع</span>
                <span style="text-align:left;">الإجراءات</span>
            </div>
            <div id="tabsContainer">
                <!-- يتم التحميل عبر JavaScript -->
            </div>
        </div>

    </div>

    <!-- ===== TOAST ===== -->
    <div class="toast-container" id="toastContainer"></div>

    <script>
        // ============================================================
        // SUPABASE CONFIGURATION
        // ============================================================
        var SUPABASE_URL = 'https://ykkhkgajzyxsgoamtmnn.supabase.co';
        var SUPABASE_ANON_KEY = 'sb_publishable_NOH7uJlEoPf6wcT87DNBug_izzR-4VF';

        // ============================================================
        // INIT SUPABASE CLIENT
        // ============================================================
        var supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // ============================================================
        // TOAST
        // ============================================================
        function showToast(title, message, type) {
            var container = document.getElementById('toastContainer');
            var toast = document.createElement('div');
            toast.className = 'toast ' + (type || '');

            var iconMap = {
                'success': { icon: 'fa-check-circle', cls: 'success' },
                'error': { icon: 'fa-times-circle', cls: 'error' },
                'warning': { icon: 'fa-exclamation-triangle', cls: 'warning' }
            };

            var toastType = iconMap[type] || iconMap['warning'];

            toast.innerHTML = '' +
                '<span class="icon ' + toastType.cls + '"><i class="fas ' + toastType.icon + '"></i></span>' +
                '<div class="content">' +
                '<div class="title">' + title + '</div>' +
                '<div class="message">' + message + '</div>' +
                '</div>' +
                '<button class="close"><i class="fas fa-times"></i></button>';

            container.appendChild(toast);

            requestAnimationFrame(function() {
                toast.classList.add('show');
            });

            var timeout = setTimeout(function() {
                if (toast.parentElement) {
                    toast.classList.remove('show');
                    setTimeout(function() {
                        if (toast.parentElement) toast.remove();
                    }, 400);
                }
            }, 5000);

            toast.querySelector('.close').addEventListener('click', function() {
                clearTimeout(timeout);
                toast.classList.remove('show');
                setTimeout(function() {
                    if (toast.parentElement) toast.remove();
                }, 400);
            });
        }

        // ============================================================
        // SESSION FUNCTIONS - تعريف getToken هنا
        // ============================================================
        function getSession() {
            var session = localStorage.getItem('rollex_session');
            if (!session) {
                console.warn('⚠️ لا توجد جلسة في localStorage');
                return null;
            }
            try {
                return JSON.parse(session);
            } catch (e) {
                console.error('❌ فشل تحليل الجلسة:', e);
                return null;
            }
        }

        function getToken() {
            var session = getSession();
            return session ? session.access_token : null;
        }

        // ============================================================
        // GET CURRENT USER PROFILE
        // ============================================================
        async function getCurrentUserProfile() {
            var token = getToken();
            if (!token) {
                console.warn('⚠️ لا يوجد توكن');
                showToast('⚠️ تنبيه', 'يرجى تسجيل الدخول أولاً', 'warning');
                return null;
            }

            try {
                var userResponse = await fetch(SUPABASE_URL + '/auth/v1/user', {
                    headers: {
                        'apikey': SUPABASE_ANON_KEY,
                        'Authorization': 'Bearer ' + token
                    }
                });

                if (!userResponse.ok) {
                    console.warn('⚠️ فشل جلب المستخدم:', userResponse.status);
                    localStorage.removeItem('rollex_session');
                    window.location.href = 'login.html';
                    return null;
                }

                var user = await userResponse.json();

                var profileResponse = await fetch(SUPABASE_URL + '/rest/v1/profiles?select=*&id=eq.' + user.id, {
                    headers: {
                        'apikey': SUPABASE_ANON_KEY,
                        'Authorization': 'Bearer ' + token
                    }
                });

                if (!profileResponse.ok) {
                    console.warn('⚠️ فشل جلب البروفايل:', profileResponse.status);
                    return null;
                }

                var data = await profileResponse.json();
                return data && data.length > 0 ? data[0] : null;

            } catch (error) {
                console.error('❌ خطأ في جلب البروفايل:', error);
                return null;
            }
        }

        // ============================================================
        // GET GENERAL TABS
        // ============================================================
        async function getGeneralTabs() {
            var token = getToken();
            if (!token) {
                console.warn('⚠️ لا يوجد توكن');
                return [];
            }

            var profile = await getCurrentUserProfile();
            if (!profile || !profile.company_id) {
                console.warn('⚠️ لم يتم العثور على company_id');
                return [];
            }

            try {
                var response = await fetch(SUPABASE_URL + '/rest/v1/general_tabs?select=*&company_id=eq.' + profile.company_id + '&order=name.asc', {
                    headers: {
                        'apikey': SUPABASE_ANON_KEY,
                        'Authorization': 'Bearer ' + token
                    }
                });

                if (!response.ok) {
                    console.warn('⚠️ فشل جلب التبويبات:', response.status);
                    return [];
                }

                var data = await response.json();
                console.log('✅ تم جلب التبويبات:', data ? data.length : 0);
                return data || [];

            } catch (error) {
                console.error('❌ خطأ في جلب التبويبات:', error);
                return [];
            }
        }

        // ============================================================
        // RENDER TABS
        // ============================================================
        async function renderTabs() {
            var container = document.getElementById('tabsContainer');
            var tabs = await getGeneralTabs();

            if (!tabs || tabs.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-tags"></i>
                        <h3>لا توجد تبويبات عامة</h3>
                        <p>أضف تبويبك الأول من خلال النموذج أعلاه</p>
                    </div>
                `;
                return;
            }

            var html = '';
            var typeLabels = {
                'in': 'وارد',
                'out': 'صادر',
                'both': 'وارد وصادر'
            };
            var typeClasses = {
                'in': 'in',
                'out': 'out',
                'both': 'both'
            };

            tabs.forEach(function(tab) {
                var isSystem = tab.is_system || false;
                var typeLabel = typeLabels[tab.type] || 'وارد وصادر';
                var typeClass = typeClasses[tab.type] || 'both';

                html += `
                    <div class="tab-item ${isSystem ? 'system-tab' : ''}">
                        <span class="tab-name">${tab.name}</span>
                        <span class="tab-type ${typeClass}">${typeLabel}</span>
                        <div class="tab-actions">
                            <button onclick="editTab('${tab.id}')" title="تعديل">
                                <i class="fas fa-edit"></i>
                            </button>
                            <button class="delete" onclick="deleteTab('${tab.id}')" title="حذف" ${isSystem ? 'disabled' : ''}>
                                <i class="fas fa-trash-alt"></i>
                            </button>
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        // ============================================================
        // ADD GENERAL TAB
        // ============================================================
        async function addGeneralTab() {
            var nameInput = document.getElementById('newTabName');
            var typeInput = document.getElementById('newTabType');
            var name = nameInput.value.trim();
            var type = typeInput.value;

            if (!name) {
                showToast('⚠️ تنبيه', 'يرجى إدخال اسم التبويب', 'error');
                nameInput.focus();
                return;
            }

            var token = getToken();
            if (!token) {
                showToast('⚠️ تنبيه', 'يرجى تسجيل الدخول أولاً', 'error');
                return;
            }

            var profile = await getCurrentUserProfile();
            if (!profile || !profile.company_id) {
                showToast('⚠️ تنبيه', 'لم يتم العثور على الشركة', 'error');
                return;
            }

            try {
                var response = await fetch(SUPABASE_URL + '/rest/v1/general_tabs', {
                    method: 'POST',
                    headers: {
                        'apikey': SUPABASE_ANON_KEY,
                        'Authorization': 'Bearer ' + token,
                        'Content-Type': 'application/json',
                        'Prefer': 'return=representation'
                    },
                    body: JSON.stringify({
                        company_id: profile.company_id,
                        name: name,
                        type: type,
                        is_active: true,
                        is_system: false,
                        created_by: profile.id
                    })
                });

                if (!response.ok) {
                    var errorData = await response.json();
                    if (errorData.message && errorData.message.includes('duplicate key')) {
                        showToast('⚠️ تنبيه', 'هذا التبويب موجود بالفعل', 'warning');
                    } else {
                        throw new Error(errorData.message || 'فشل الإضافة');
                    }
                    return;
                }

                showToast('✅ تم الإضافة', 'تم إضافة التبويب "' + name + '" بنجاح', 'success');
                nameInput.value = '';
                renderTabs();

            } catch (error) {
                console.error('❌ خطأ في الإضافة:', error);
                showToast('❌ خطأ', error.message || 'فشل إضافة التبويب', 'error');
            }
        }

        // ============================================================
        // DELETE TAB
        // ============================================================
        async function deleteTab(tabId) {
            if (!confirm('هل أنت متأكد من حذف هذا التبويب؟')) return;

            var token = getToken();
            if (!token) {
                showToast('⚠️ تنبيه', 'يرجى تسجيل الدخول أولاً', 'error');
                return;
            }

            try {
                var response = await fetch(SUPABASE_URL + '/rest/v1/general_tabs?id=eq.' + tabId, {
                    method: 'DELETE',
                    headers: {
                        'apikey': SUPABASE_ANON_KEY,
                        'Authorization': 'Bearer ' + token
                    }
                });

                if (!response.ok) {
                    throw new Error('فشل حذف التبويب');
                }

                showToast('✅ تم الحذف', 'تم حذف التبويب بنجاح', 'success');
                renderTabs();

            } catch (error) {
                console.error('❌ خطأ في الحذف:', error);
                showToast('❌ خطأ', error.message || 'فشل حذف التبويب', 'error');
            }
        }

        // ============================================================
        // EDIT TAB
        // ============================================================
        function editTab(tabId) {
            var newName = prompt('📝 أدخل الاسم الجديد للتبويب:');
            if (!newName || newName.trim() === '') return;

            var token = getToken();
            if (!token) {
                showToast('⚠️ تنبيه', 'يرجى تسجيل الدخول أولاً', 'error');
                return;
            }

            fetch(SUPABASE_URL + '/rest/v1/general_tabs?id=eq.' + tabId, {
                method: 'PATCH',
                headers: {
                    'apikey': SUPABASE_ANON_KEY,
                    'Authorization': 'Bearer ' + token,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    name: newName.trim()
                })
            })
            .then(function(response) {
                if (!response.ok) throw new Error('فشل التعديل');
                return response.json();
            })
            .then(function() {
                showToast('✅ تم التعديل', 'تم تحديث اسم التبويب بنجاح', 'success');
                renderTabs();
            })
            .catch(function(error) {
                console.error('❌ خطأ في التعديل:', error);
                showToast('❌ خطأ', error.message || 'فشل تعديل التبويب', 'error');
            });
        }

        // ============================================================
        // INIT
        // ============================================================
        document.addEventListener('DOMContentLoaded', function() {
            console.log('🏷️ إدارة التبويبات العامة - QuickData ProSoft');
            console.log('🔗 Supabase URL:', SUPABASE_URL);

            // التحقق من وجود جلسة
            var token = getToken();
            if (!token) {
                showToast('⚠️ تنبيه', 'يرجى تسجيل الدخول للوصول إلى هذه الصفحة', 'warning');
                setTimeout(function() {
                    window.location.href = 'login.html';
                }, 2000);
                return;
            }

            renderTabs();
        });

        // جعل الدوال عامة للاستخدام في HTML
        window.addGeneralTab = addGeneralTab;
        window.deleteTab = deleteTab;
        window.editTab = editTab;
    </script>

</body>
</html>
