<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>الخزينة الرئيسية - Debug</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Cairo', 'Segoe UI', Tahoma, Arial, sans-serif; background: #0a0f1f; color: #eee; direction: rtl; padding: 20px; }
        .container { max-width: 1400px; margin: 0 auto; }
        h1 { color: #f5c842; margin-bottom: 20px; }
        .debug-box { background: #121a2e; border-radius: 12px; padding: 20px; margin-bottom: 20px; border: 1px solid rgba(245,200,66,0.1); overflow-x: auto; }
        .debug-box pre { color: #8a9ab0; font-size: 12px; white-space: pre-wrap; word-wrap: break-word; direction: ltr; text-align: left; }
        .debug-box .label { color: #f5c842; font-weight: 700; margin-bottom: 10px; display: block; }
        table { width: 100%; border-collapse: collapse; font-size: 0.75rem; min-width: 800px; }
        th { background: rgba(26, 47, 68, 0.4); color: #f5c842; padding: 8px 6px; text-align: right; font-weight: 700; white-space: nowrap; font-size: 0.65rem; }
        td { padding: 6px; border-bottom: 1px solid rgba(255, 255, 255, 0.05); color: rgba(255, 255, 255, 0.6); font-size: 0.7rem; }
        .badge { display: inline-block; padding: 2px 10px; border-radius: 50px; font-size: 0.6rem; font-weight: 600; background: rgba(26, 47, 68, 0.25); color: rgba(255, 255, 255, 0.4); }
        .loading, .error { text-align: center; padding: 40px 20px; font-size: 0.95rem; }
        .loading { color: #f5c842; }
        .error { color: #ef5350; }
        .error small { display: block; margin-top: 8px; color: rgba(255,255,255,0.2); font-size: 0.75rem; }
    </style>
</head>
<body>
    <div class="container">
        <h1>💰 الخزينة الرئيسية - Debug Mode</h1>
        <div id="debugContainer">
            <div class="loading">⏳ جاري تحميل البيانات...</div>
        </div>
    </div>

    <script>
        const SHEET_ID = '1bBVMzBc_kJfApP0FXxZEmRwDRcJlNe3hK6MtgZ72aB4';
        const SHEET_NAME = 'الخزينة الرئيسية';

        async function fetchSheetData() {
            try {
                const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${SHEET_NAME}`;
                console.log('🔗 جلب البيانات من:', url);
                const response = await fetch(url);
                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                const csvText = await response.text();
                console.log('📄 النص الخام:', csvText.substring(0, 500) + '...');
                const lines = csvText.split('\n').filter(line => line.trim() !== '');
                return lines.map(line => {
                    const row = [];
                    let current = '', insideQuotes = false;
                    for (let i = 0; i < line.length; i++) {
                        const char = line[i];
                        if (char === '"') insideQuotes = !insideQuotes;
                        else if (char === ',' && !insideQuotes) { row.push(current.trim()); current = ''; }
                        else current += char;
                    }
                    row.push(current.trim());
                    return row;
                });
            } catch (error) { console.error(error); return null; }
        }

        function cleanNumber(value) {
            if (!value) return 0;
            if (typeof value === 'number') return value;
            const cleaned = String(value).replace(/[^0-9.]/g, '');
            return parseFloat(cleaned) || 0;
        }

        function displayData(data) {
            const container = document.getElementById('debugContainer');

            if (!data || data.length === 0) {
                container.innerHTML = `<div class="error">❌ لا توجد بيانات</div>`;
                return;
            }

            console.log('📊 عدد الصفوف:', data.length);
            console.log('📊 أول 3 صفوف:', data.slice(0, 3));

            // عرض كل الصفوف مع أرقامها
            let debugHTML = `
                <div class="debug-box">
                    <span class="label">📋 جميع الصفوف (${data.length} صف)</span>
                    <pre>${JSON.stringify(data, null, 2)}</pre>
                </div>
            `;

            // عرض الجدول مع أرقام الأعمدة
            let tableHTML = `
                <div class="debug-box">
                    <span class="label">📊 عرض البيانات كجدول</span>
                    <div style="overflow-x:auto;">
                        <table>
                            <thead>
                                <tr>
                                    <th>#</th>
                                    <th>0</th><th>1</th><th>2</th><th>3</th><th>4</th>
                                    <th>5</th><th>6</th><th>7</th><th>8</th><th>9</th>
                                    <th>10</th><th>11</th><th>12</th><th>13</th><th>14</th>
                                </tr>
                            </thead>
                            <tbody>
                    `;

            data.forEach((row, index) => {
                tableHTML += `<tr>
                    <td style="color:#f5c842;font-weight:700;">${index + 1}</td>`;
                for (let i = 0; i < 15; i++) {
                    const val = (row && row[i]) ? row[i] : '';
                    const isNumber = !isNaN(cleanNumber(val)) && val !== '';
                    const color = isNumber ? '#4caf50' : 'rgba(255,255,255,0.5)';
                    tableHTML += `<td style="color:${color};">${val || '-'}</td>`;
                }
                tableHTML += `</tr>`;
            });

            tableHTML += `</tbody></table></div></div>`;

            // تحليل الصف 6 (الرؤوس)
            let headersHTML = '';
            if (data.length > 5) {
                const headers = data[5];
                headersHTML = `
                    <div class="debug-box">
                        <span class="label">🔍 الصف 6 (الرؤوس المفترضة) - ${headers ? headers.length : 0} عمود</span>
                        <pre>${JSON.stringify(headers, null, 2)}</pre>
                    </div>
                `;
            }

            // عرض الصفوف من 7 إلى 20
            let dataRowsHTML = '';
            if (data.length > 6) {
                const rows = data.slice(6, 20);
                dataRowsHTML = `
                    <div class="debug-box">
                        <span class="label">📋 الصفوف من 7 إلى 20 (${rows.length} صف)</span>
                        <pre>${JSON.stringify(rows, null, 2)}</pre>
                    </div>
                `;
            }

            container.innerHTML = debugHTML + headersHTML + dataRowsHTML + tableHTML;
        }

        async function loadData() {
            const data = await fetchSheetData();
            if (data && data.length > 0) displayData(data);
            else {
                document.getElementById('debugContainer').innerHTML = `
                    <div class="error">❌ حدث خطأ في تحميل البيانات
                        <small>تأكد من أن الشيت عام للقراءة<br>وأن اسم التبويب "${SHEET_NAME}" صحيح</small>
                    </div>
                `;
            }
        }

        loadData();
    </script>
</body>
</html>
