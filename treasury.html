<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>إدخال حركة - الخزينة</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* نفس تصميم treasury.html مع تعديلات بسيطة */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Cairo', sans-serif;
            background: #1b2431;
            color: #fff;
            direction: rtl;
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 800px; margin: 0 auto; }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 0;
            border-bottom: 1px solid rgba(255,255,255,0.06);
            margin-bottom: 24px;
        }
        .header h1 { font-size: 1.6rem; font-weight: 900; color: #f5a623; }
        .header .back-btn {
            color: rgba(255,255,255,0.5);
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.06);
            transition: 0.3s;
        }
        .header .back-btn:hover { background: rgba(255,255,255,0.04); color: #fff; }

        .form-card {
            background: #212c3b;
            border-radius: 16px;
            padding: 24px;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .form-card h3 {
            font-size: 1rem;
            font-weight: 700;
            color: #f5a623;
            margin-bottom: 16px;
        }
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
            margin-bottom: 14px;
        }
        .form-group label {
            font-size: 0.7rem;
            font-weight: 700;
            color: rgba(255,255,255,0.4);
            text-transform: uppercase;
        }
        .form-group input, .form-group select, .form-group textarea {
            padding: 10px 14px;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.06);
            background: #2a3646;
            color: #fff;
            font-size: 0.85rem;
            font-family: inherit;
            outline: none;
            transition: 0.3s;
            width: 100%;
        }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
            border-color: #f5a623;
            box-shadow: 0 0 0 3px rgba(245,166,35,0.1);
        }
        .form-group textarea { min-height: 60px; resize: vertical; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

        .btn-submit {
            padding: 12px 28px;
            background: linear-gradient(135deg, #ffc857, #f5a623, #e08e0b);
            color: #1b1204;
            border: none;
            border-radius: 10px;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            transition: 0.3s;
            font-family: inherit;
            width: 100%;
        }
        .btn-submit:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(245,166,35,0.3); }
        .btn-submit:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

        .toast-container {
            position: fixed; top: 20px; right: 20px; z-index: 9999;
            display: flex; flex-direction: column; gap: 8px;
        }
        .toast {
            background: #212c3b; padding: 14px 20px; border-radius: 12px;
            border-right: 4px solid #f5a623;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            display: flex; align-items: center; gap: 12px;
            min-width: 280px; animation: slideIn 0.3s ease;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .toast.success { border-right-color: #34d399; }
        .toast.error { border-right-color: #f87171; }
        .toast .icon { font-size: 1.1rem; }
        .toast .icon.success { color: #34d399; }
        .toast .icon.error { color: #f87171; }
        .toast .content .title { font-size: 0.8rem; font-weight: 700; }
        .toast .content .message { font-size: 0.7rem; color: rgba(255,255,255,0.4); }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(20px); }
            to { opacity: 1; transform: translateX(0); }
        }

        @media (max-width: 768px) {
            .form-row { grid-template-columns: 1fr; }
            .header { flex-direction: column; gap: 12px; align-items: flex-start; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1><i class="fas fa-plus-circle"></i> إدخال حركة</h1>
            <a href="treasury.html" class="back-btn"><i class="fas fa-arrow-right"></i> العودة للخزينة</a>
        </div>

        <div class="form-card">
            <h3><i class="fas fa-pen"></i> بيانات الحركة</h3>
            <form id="entryForm">
                <input type="hidden" id="treasuryId" value="" />

                <div class="form-row">
                    <div class="form-group">
                        <label>نوع الحركة <span style="color:#f87171;">*</span></label>
                        <select id="entryType" required>
                            <option value="إيداع">💰 إيداع</option>
                            <option value="سحب">🏦 سحب</option>
                            <option value="تحويل">🔄 تحويل</option>
                            <option value="مصاريف">🧾 مصاريف</option>
                            <option value="إيرادات">📈 إيرادات</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>التاريخ <span style="color:#f87171;">*</span></label>
                        <input type="date" id="entryDate" required />
                    </div>
                </div>

                <div class="form-group">
                    <label>البيان <span style="color:#f87171;">*</span></label>
                    <input type="text" id="entryDescription" placeholder="مثال: فاتورة مبيعات رقم 123" required maxlength="200" />
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>رقم السند <span style="color:#f87171;">*</span></label>
                        <input type="text" id="entryVoucher" placeholder="رقم السند" required />
                    </div>
                    <div class="form-group">
                        <label>المبلغ <span style="color:#f87171;">*</span></label>
                        <input type="number" id="entryAmount" placeholder="0.00" required min="0.01" step="0.01" />
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>التبويب العام <span style="color:#f87171;">*</span></label>
                        <input type="text" id="entryGeneralTab" placeholder="مثال: مبيعات" required />
                    </div>
                    <div class="form-group">
                        <label>التبويب الخاص <span style="color:#f87171;">*</span></label>
                        <input type="text" id="entryPrivateTab" placeholder="مثال: عميل رقم 5" required />
                    </div>
                </div>

                <div class="form-group">
                    <label>ملاحظات</label>
                    <textarea id="entryNotes" placeholder="ملاحظات إضافية" maxlength="300"></textarea>
                </div>

                <button type="submit" class="btn-submit" id="submitBtn">
                    <i class="fas fa-save"></i> حفظ الحركة
                </button>
            </form>
        </div>
    </div>

    <div class="toast-container" id="toastContainer"></div>

    <script>
        var SUPABASE_URL = 'https://ykkhkgajzyxsgoamtmnn.supabase.co';
        var SUPABASE_ANON_KEY = 'sb_publishable_NOH7uJlEoPf6wcT87DNBug_izzR-4VF';

        function showToast(title, message, type) {
            var container = document.getElementById('toastContainer');
            var toast = document.createElement('div');
            toast.className = 'toast ' + (type || '');
            var icon = type === 'success' ? 'fa-check-circle' : 'fa-exclamation-circle';
            var iconClass = type === 'success' ? 'success' : 'error';
            toast.innerHTML = `
                <span class="icon ${iconClass}"><i class="fas ${icon}"></i></span>
                <div class="content">
                    <div class="title">${title}</div>
                    <div class="message">${message}</div>
                </div>
            `;
            container.appendChild(toast);
            setTimeout(function() {
                toast.style.opacity = '0';
                toast.style.transform = 'translateX(20px)';
                setTimeout(function() { toast.remove(); }, 300);
            }, 3000);
        }

        // جلب treasury_id من الرابط
        var urlParams = new URLSearchParams(window.location.search);
        var treasuryId = urlParams.get('treasury_id');

        if (treasuryId) {
            document.getElementById('treasuryId').value = treasuryId;
        } else {
            showToast('⚠️ تنبيه', 'لم يتم تحديد الخزينة', 'error');
            setTimeout(function() { window.location.href = 'treasuries.html'; }, 2000);
        }

        // تعيين التاريخ الحالي
        document.getElementById('entryDate').value = new Date().toISOString().split('T')[0];

        // حفظ الحركة
        document.getElementById('entryForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            var btn = document.getElementById('submitBtn');
            var type = document.getElementById('entryType').value;
            var date = document.getElementById('entryDate').value;
            var description = document.getElementById('entryDescription').value.trim();
            var voucher = document.getElementById('entryVoucher').value.trim();
            var amount = parseFloat(document.getElementById('entryAmount').value);
            var generalTab = document.getElementById('entryGeneralTab').value.trim();
            var privateTab = document.getElementById('entryPrivateTab').value.trim();
            var notes = document.getElementById('entryNotes').value.trim();

            if (!date || !description || !voucher || !amount || !generalTab || !privateTab) {
                showToast('⚠️ تحقق من البيانات', 'يرجى ملء جميع الحقول المطلوبة', 'error');
                return;
            }

            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جاري الحفظ...';

            // تحديد incoming/outgoing بناءً على نوع الحركة
            var incoming = 0;
            var outgoing = 0;

            if (type === 'إيداع' || type === 'إيرادات') {
                incoming = amount;
            } else if (type === 'سحب' || type === 'مصاريف') {
                outgoing = amount;
            } else if (type === 'تحويل') {
                // التحويل ياخد من الخزينة الحالية ويضيف للخزينة الأخرى
                // هنضيف منطق التحويل لاحقاً
                incoming = 0;
                outgoing = amount;
            }

            try {
                var response = await fetch(SUPABASE_URL + '/rest/v1/treasury', {
                    method: 'POST',
                    headers: {
                        'apikey': SUPABASE_ANON_KEY,
                        'Content-Type': 'application/json',
                        'Prefer': 'return=representation'
                    },
                    body: JSON.stringify({
                        treasury_id: treasuryId,
                        date: date,
                        voucher_number: voucher,
                        transaction_type: type,
                        description: description,
                        incoming: incoming,
                        outgoing: outgoing,
                        general_tab: generalTab,
                        private_tab: privateTab,
                        notes: notes
                    })
                });

                if (!response.ok) {
                    var errorText = await response.text();
                    throw new Error('فشل الحفظ: ' + errorText);
                }

                showToast('✅ تم الحفظ', 'تم إضافة الحركة بنجاح', 'success');
                document.getElementById('entryForm').reset();
                document.getElementById('entryDate').value = new Date().toISOString().split('T')[0];

                setTimeout(function() {
                    window.location.href = 'treasury.html?treasury_id=' + treasuryId;
                }, 1500);

            } catch (error) {
                showToast('❌ خطأ', error.message, 'error');
            }

            btn.disabled = false;
            btn.innerHTML = '<i class="fas fa-save"></i> حفظ الحركة';
        });
    </script>
</body>
</html>
