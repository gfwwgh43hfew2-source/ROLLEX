<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>الخزينة - QuickData ProSoft</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* ============================================================
           STYLES
           ============================================================ */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Cairo', sans-serif;
            direction: rtl;
            background: #1b2431;
            color: #fff;
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 1200px; margin: 0 auto; }

        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 0;
            border-bottom: 1px solid rgba(255,255,255,0.06);
            margin-bottom: 24px;
            flex-wrap: wrap;
            gap: 12px;
        }
        .header h1 { font-size: 1.6rem; font-weight: 900; color: #f5a623; }
        .header h1 i { margin-left: 10px; }
        .header .back-btn {
            color: rgba(255,255,255,0.5);
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.06);
            transition: 0.3s;
        }
        .header .back-btn:hover { background: rgba(255,255,255,0.04); color: #fff; }

        /* Treasury Info */
        .treasury-info {
            background: #212c3b;
            border-radius: 16px;
            padding: 20px 24px;
            margin-bottom: 20px;
            border: 1px solid rgba(255,255,255,0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }
        .treasury-info .name { font-size: 1.2rem; font-weight: 800; color: #f5a623; }
        .treasury-info .balance { font-size: 1.4rem; font-weight: 900; color: #34d399; }
        .treasury-info .balance .label { font-size: 0.7rem; color: rgba(255,255,255,0.4); font-weight: 600; display: block; }

        /* Stats */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }
        .stat-card {
            background: #212c3b;
            border-radius: 12px;
            padding: 14px 18px;
            border: 1px solid rgba(255,255,255,0.05);
            text-align: center;
        }
        .stat-card .value { font-size: 1.2rem; font-weight: 800; }
        .stat-card .value.green { color: #34d399; }
        .stat-card .value.red { color: #f87171; }
        .stat-card .value.gold { color: #f5a623; }
        .stat-card .label { font-size: 0.6rem; color: rgba(255,255,255,0.4); font-weight: 600; text-transform: uppercase; }

        /* Transfer Form - نسخة معدلة */
        .transfer-section {
            background: #212c3b;
            border-radius: 16px;
            padding: 20px 24px;
            margin-bottom: 20px;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .transfer-section h3 {
            font-size: 0.9rem;
            font-weight: 700;
            color: #f5a623;
            margin-bottom: 12px;
        }
        .transfer-section h3 i { margin-left: 8px; }
        .transfer-row {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr auto;
            gap: 12px;
            align-items: end;
        }
        .transfer-row .form-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .transfer-row .form-group label {
            font-size: 0.6rem;
            font-weight: 700;
            color: rgba(255,255,255,0.4);
            text-transform: uppercase;
        }
        .transfer-row .form-group label .required { color: #f87171; }
        .transfer-row .form-group select,
        .transfer-row .form-group input {
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.06);
            background: #2a3646;
            color: #fff;
            font-size: 0.8rem;
            font-family: inherit;
            outline: none;
            width: 100%;
        }
        .transfer-row .form-group select:focus,
        .transfer-row .form-group input:focus {
            border-color: #f5a623;
        }
        .transfer-row .form-group select option {
            background: #212c3b;
            color: #fff;
        }
        .btn-transfer {
            padding: 8px 20px;
            background: linear-gradient(135deg, #17a2b8, #138496);
            color: #fff;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.75rem;
            cursor: pointer;
            font-family: inherit;
            white-space: nowrap;
            transition: 0.3s;
        }
        .btn-transfer:hover { transform: translateY(-2px); box-shadow: 0 4px 16px rgba(23,162,184,0.25); }
        .btn-transfer:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        .transfer-note {
            margin-top: 8px;
            font-size: 0.65rem;
            color: rgba(255,255,255,0.25);
        }
        .transfer-note strong { color: #f5a623; }

        /* Table */
        .table-wrapper {
            background: #212c3b;
            border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.05);
            overflow: hidden;
        }
        .table-scroll { overflow-x: auto; }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.7rem;
            min-width: 600px;
        }
        thead {
            background: #2a3646;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        thead th {
            padding: 10px 12px;
            text-align: center;
            font-size: 0.6rem;
            font-weight: 700;
            color: rgba(255,255,255,0.4);
            text-transform: uppercase;
        }
        tbody td {
            padding: 8px 12px;
            border-bottom: 1px solid rgba(255,255,255,0.03);
            text-align: center;
            color: rgba(255,255,255,0.7);
        }
        .badge-type {
            padding: 2px 10px;
            border-radius: 50px;
            font-size: 0.5rem;
            font-weight: 600;
        }
        .badge-type.incoming { background: rgba(52,211,153,0.1); color: #34d399; }
        .badge-type.outgoing { background: rgba(248,113,113,0.1); color: #f87171; }
        .badge-type.transfer { background: rgba(23,162,184,0.1); color: #17a2b8; }

        .amount-in { color: #34d399; font-weight: 700; }
        .amount-out { color: #f87171; font-weight: 700; }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: rgba(255,255,255,0.2);
        }
        .empty-state i { font-size: 3rem; display: block; margin-bottom: 12px; }
        .empty-state a { color: #f5a623; text-decoration: none; font-weight: 700; }
        .empty-state a:hover { text-decoration: underline; }

        /* Toast */
        .toast-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .toast {
            background: #212c3b;
            padding: 14px 20px;
            border-radius: 12px;
            border-right: 4px solid #f5a623;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 280px;
            animation: slideIn 0.3s ease;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .toast.success { border-right-color: #34d399; }
        .toast.error { border-right-color: #f87171; }
        .toast .icon { font-size: 1.1rem; }
        .toast .icon.success { color: #34d399; }
        .toast .icon.error { color: #f87171; }
        .toast .content .title { font-size: 0.8rem; font-weight: 700; }
        .toast .content .message { font-size: 0.7rem; color: rgba(255,255,255,0.4); }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(20px); }
            to { opacity: 1; transform: translateX(0); }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .transfer-row { grid-template-columns: 1fr; }
            .stats-grid { grid-template-columns: 1fr; }
            .header { flex-direction: column; gap: 12px; align-items: flex-start; }
            .treasury-info { flex-direction: column; align-items: flex-start; }
        }
    </style>
</head>
<body>

    <div class="container">

        <!-- ===== HEADER ===== -->
        <div class="header">
            <h1><i class="fas fa-university"></i> الخزينة</h1>
            <a href="treasuries.html" class="back-btn"><i class="fas fa-arrow-right"></i> العودة للخزائن</a>
        </div>

        <!-- ===== TREASURY INFO ===== -->
        <div class="treasury-info" id="treasuryInfo">
            <div>
                <div class="name" id="treasuryName">جاري التحميل...</div>
                <div style="font-size:0.7rem;color:rgba(255,255,255,0.3);">الخزينة الحالية</div>
            </div>
            <div>
                <div class="balance">
                    <span class="label">الرصيد الحالي</span>
                    <span id="treasuryBalance">0 ج.م</span>
                </div>
            </div>
        </div>

        <!-- ===== STATS ===== -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="value green" id="totalIncoming">0</div>
                <div class="label">إجمالي الإيداعات</div>
            </div>
            <div class="stat-card">
                <div class="value red" id="totalOutgoing">0</div>
                <div class="label">إجمالي السحوبات</div>
            </div>
            <div class="stat-card">
                <div class="value gold" id="totalTransactions">0</div>
                <div class="label">عدد الحركات</div>
            </div>
        </div>

        <!-- ===== TRANSFER FORM - نسخة معدلة ===== -->
        <div class="transfer-section" id="transferSection">
            <h3><i class="fas fa-exchange-alt"></i> تحويل إلى خزينة أخرى</h3>
            <div class="transfer-row">
                <div class="form-group">
                    <label>إلى خزينة <span class="required">*</span></label>
                    <select id="toTreasury" required>
                        <option value="">اختر الخزينة الهدف</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>المبلغ <span class="required">*</span></label>
                    <input type="number" id="transferAmount" placeholder="0.00" min="0.01" step="0.01" required />
                </div>
                <div class="form-group">
                    <label>البيان</label>
                    <input type="text" id="transferDesc" placeholder="سبب التحويل" />
                </div>
                <button class="btn-transfer" onclick="transferMoney()">
                    <i class="fas fa-exchange-alt"></i> تحويل
                </button>
            </div>
            <div class="transfer-note">
                <i class="fas fa-info-circle"></i> سيتم التحويل من <strong id="fromTreasuryName">الخزينة الحالية</strong>
            </div>
        </div>

        <!-- ===== TRANSACTIONS TABLE ===== -->
        <div class="table-wrapper">
            <div class="table-scroll">
                <table>
                    <thead>
                        <tr>
                            <th>البيان</th>
                            <th>النوع</th>
                            <th>المبلغ</th>
                            <th>التاريخ</th>
                        </tr>
                    </thead>
                    <tbody id="transactionsBody">
                        <tr><td colspan="4"><div class="empty-state"><i class="fas fa-inbox"></i>لا توجد حركات</div></td></tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <!-- ===== TOAST ===== -->
    <div class="toast-container" id="toastContainer"></div>

    <script>
        // ============================================================
        // CONFIGURATION
        // ============================================================
        var SUPABASE_URL = 'https://ykkhkgajzyxsgoamtmnn.supabase.co';
        var SUPABASE_ANON_KEY = 'sb_publishable_NOH7uJlEoPf6wcT87DNBug_izzR-4VF';

        var currentTreasuryId = null;
        var allTreasuries = [];

        // ============================================================
        // TOAST
        // ============================================================
        function showToast(title, message, type) {
            var container = document.getElementById('toastContainer');
            var toast = document.createElement('div');
            toast.className = 'toast ' + (type || '');
            var icon = type === 'success' ? 'fa-check-circle' : 'fa-exclamation-circle';
            var iconClass = type === 'success' ? 'success' : 'error';
            toast.innerHTML = `
                <span class="icon ${iconClass}"><i class="fas ${icon}"></i></span>
                <div class="content">
                    <div class="title">${title}</div>
                    <div class="message">${message}</div>
                </div>
            `;
            container.appendChild(toast);
            setTimeout(function() {
                toast.style.opacity = '0';
                toast.style.transform = 'translateX(20px)';
                setTimeout(function() { toast.remove(); }, 300);
            }, 3000);
        }

        // ============================================================
        // SESSION & TOKEN
        // ============================================================
        function getSession() {
            var session = localStorage.getItem('rollex_session');
            if (!session) {
                window.location.href = 'login.html';
                return null;
            }
            try { return JSON.parse(session); } catch(e) {
                localStorage.removeItem('rollex_session');
                window.location.href = 'login.html';
                return null;
            }
        }

        function getToken() {
            var session = getSession();
            return session ? session.access_token : null;
        }

        // ============================================================
        // GET TREASURY ID FROM URL
        // ============================================================
        function getTreasuryIdFromUrl() {
            var params = new URLSearchParams(window.location.search);
            return params.get('treasury_id');
        }

        // ============================================================
        // GET CURRENT USER PROFILE
        // ============================================================
        async function getCurrentUserProfile() {
            var token = getToken();
            if (!token) return null;
            try {
                var userResponse = await fetch(SUPABASE_URL + '/auth/v1/user', {
                    headers: {
                        'apikey': SUPABASE_ANON_KEY,
                        'Authorization': 'Bearer ' + token
                    }
                });
                if (!userResponse.ok) {
                    localStorage.removeItem('rollex_session');
                    window.location.href = 'login.html';
                    return null;
                }
                var user = await userResponse.json();
                var profileResponse = await fetch(SUPABASE_URL + '/rest/v1/profiles?select=*&id=eq.' + user.id, {
                    headers: {
                        'apikey': SUPABASE_ANON_KEY,
                        'Authorization': 'Bearer ' + token
                    }
                });
                if (!profileResponse.ok) return null;
                var data = await profileResponse.json();
                return data && data.length > 0 ? data[0] : null;
            } catch (error) {
                console.error('❌ خطأ:', error);
                return null;
            }
        }

        // ============================================================
        // GET TREASURY DETAILS
        // ============================================================
        async function getTreasuryDetails(treasuryId) {
            var token = getToken();
            if (!token) return null;
            try {
                var response = await fetch(SUPABASE_URL + '/rest/v1/treasuries?select=*&id=eq.' + treasuryId, {
                    headers: {
                        'apikey': SUPABASE_ANON_KEY,
                        'Authorization': 'Bearer ' + token
                    }
                });
                if (!response.ok) return null;
                var data = await response.json();
                return data && data.length > 0 ? data[0] : null;
            } catch (error) {
                console.error('❌ خطأ:', error);
                return null;
            }
        }

        // ============================================================
        // GET COMPANY TREASURIES
        // ============================================================
        async function getCompanyTreasuries(companyId) {
            var token = getToken();
            if (!token) return [];
            try {
                var response = await fetch(SUPABASE_URL + '/rest/v1/treasuries?select=*&company_id=eq.' + companyId + '&is_active=eq.true', {
                    headers: {
                        'apikey': SUPABASE_ANON_KEY,
                        'Authorization': 'Bearer ' + token
                    }
                });
                if (!response.ok) {
                    console.error('❌ فشل جلب الخزائن:', response.status);
                    return [];
                }
                var data = await response.json();
                console.log('📊 الخزائن التي تم جلبها:', data);
                return data || [];
            } catch (error) {
                console.error('❌ خطأ في جلب الخزائن:', error);
                return [];
            }
        }

        // ============================================================
        // GET TRANSACTIONS
        // ============================================================
        async function getTransactions(treasuryId) {
            var token = getToken();
            if (!token) return [];
            try {
                var response = await fetch(SUPABASE_URL + '/rest/v1/treasury_transactions?select=*&treasury_id=eq.' + treasuryId + '&order=created_at.desc', {
                    headers: {
                        'apikey': SUPABASE_ANON_KEY,
                        'Authorization': 'Bearer ' + token
                    }
                });
                if (!response.ok) return [];
                return await response.json();
            } catch (error) {
                console.error('❌ خطأ:', error);
                return [];
            }
        }

        // ============================================================
        // POPULATE TREASURY SELECTS - نسخة معدلة
        // ============================================================
        function populateTreasurySelects(treasuries, currentId, currentName) {
            console.log('🔄 ملء القائمة المنسدلة للتحويل...');
            
            var toSelect = document.getElementById('toTreasury');

            // عرض اسم الخزينة الحالية في الرسالة التوضيحية
            document.getElementById('fromTreasuryName').textContent = currentName || 'الخزينة الحالية';

            toSelect.innerHTML = '<option value="">اختر الخزينة الهدف</option>';

            if (!treasuries || treasuries.length === 0) {
                toSelect.innerHTML = '<option value="">لا توجد خزائن أخرى</option>';
                return;
            }

            // عرض الخزائن الأخرى فقط (غير الخزينة الحالية)
            var hasOtherTreasuries = false;
            treasuries.forEach(function(t) {
                if (t.id !== currentId) {
                    hasOtherTreasuries = true;
                    var option = document.createElement('option');
                    option.value = t.id;
                    option.textContent = t.name + ' (رصيد: ' + (t.balance || 0).toLocaleString() + ' ج.م)';
                    toSelect.appendChild(option);
                }
            });

            if (!hasOtherTreasuries) {
                toSelect.innerHTML = '<option value="">⚠️ لا توجد خزائن أخرى للتحويل</option>';
            }

            console.log('✅ تم ملء القائمة بنجاح');
        }

        // ============================================================
        // TRANSFER MONEY - نسخة معدلة
        // ============================================================
        async function transferMoney() {
            var fromId = currentTreasuryId;
            var toId = document.getElementById('toTreasury').value;
            var amount = parseFloat(document.getElementById('transferAmount').value);
            var description = document.getElementById('transferDesc').value.trim() || 'تحويل بين الخزائن';

            if (!toId) {
                showToast('⚠️ تنبيه', 'يرجى اختيار الخزينة الهدف', 'error');
                return;
            }

            if (toId === fromId) {
                showToast('⚠️ تنبيه', 'لا يمكن التحويل لنفس الخزينة', 'error');
                return;
            }

            if (!amount || amount <= 0) {
                showToast('⚠️ تنبيه', 'يرجى إدخال مبلغ صحيح', 'error');
                return;
            }

            // التحقق من الرصيد
            var balanceText = document.getElementById('treasuryBalance').textContent;
            var currentBalance = parseFloat(balanceText.replace(/[^0-9.]/g, '')) || 0;
            if (amount > currentBalance) {
                showToast('⚠️ رصيد غير كافٍ', 'الرصيد الحالي: ' + currentBalance.toLocaleString() + ' ج.م', 'error');
                return;
            }

            var btn = document.querySelector('.btn-transfer');
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جاري...';

            try {
                var token = getToken();
                if (!token) return;

                var fromName = document.getElementById('treasuryName').textContent || 'الخزينة الحالية';

                var response = await fetch(SUPABASE_URL + '/rest/v1/rpc/transfer_money', {
                    method: 'POST',
                    headers: {
                        'apikey': SUPABASE_ANON_KEY,
                        'Authorization': 'Bearer ' + token,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        p_from_treasury_id: fromId,
                        p_to_treasury_id: toId,
                        p_amount: amount,
                        p_description: description + ' (من ' + fromName + ')'
                    })
                });

                var data = await response.json();

                if (!response.ok) {
                    throw new Error(data.message || 'فشل التحويل');
                }

                showToast('✅ تم التحويل', 'تم تحويل ' + amount.toLocaleString() + ' ج.م بنجاح', 'success');

                document.getElementById('transferAmount').value = '';
                document.getElementById('transferDesc').value = '';
                document.getElementById('toTreasury').value = '';

                loadData();

            } catch (error) {
                showToast('❌ خطأ', error.message || 'فشل التحويل', 'error');
            }

            btn.disabled = false;
            btn.innerHTML = '<i class="fas fa-exchange-alt"></i> تحويل';
        }

        // ============================================================
        // DISPLAY DATA
        // ============================================================
        function displayData(transactions, treasury) {
            var tbody = document.getElementById('transactionsBody');

            if (treasury) {
                document.getElementById('treasuryName').textContent = treasury.name;
                document.getElementById('treasuryBalance').textContent = (treasury.balance || 0).toLocaleString() + ' ج.م';
            }

            var totalIn = 0;
            var totalOut = 0;

            if (transactions && transactions.length > 0) {
                transactions.forEach(function(item) {
                    if (item.amount > 0) {
                        totalIn += item.amount;
                    } else {
                        totalOut += Math.abs(item.amount);
                    }
                });
            }

            document.getElementById('totalIncoming').textContent = totalIn.toLocaleString() + ' ج.م';
            document.getElementById('totalOutgoing').textContent = totalOut.toLocaleString() + ' ج.م';
            document.getElementById('totalTransactions').textContent = transactions ? transactions.length : 0;

            if (!transactions || transactions.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4"><div class="empty-state"><i class="fas fa-inbox"></i>لا توجد حركات</div></td></tr>`;
                return;
            }

            var rows = '';
            transactions.forEach(function(item) {
                var badgeClass = 'badge-type';
                var typeName = item.type || 'other';
                if (typeName === 'incoming' || typeName === 'إيداع') {
                    badgeClass += ' incoming';
                    typeName = 'إيداع';
                } else if (typeName === 'outgoing' || typeName === 'سحب') {
                    badgeClass += ' outgoing';
                    typeName = 'سحب';
                } else if (typeName === 'transfer_in' || typeName === 'transfer_out') {
                    badgeClass += ' transfer';
                    typeName = 'تحويل';
                }

                var amount = item.amount || 0;
                var isIncoming = amount > 0;
                var displayAmount = Math.abs(amount);
                var date = item.created_at ? new Date(item.created_at).toLocaleDateString('ar-EG') : '-';

                rows += `
                    <tr>
                        <td>${item.description || '-'}</td>
                        <td><span class="${badgeClass}">${typeName}</span></td>
                        <td class="${isIncoming ? 'amount-in' : 'amount-out'}">
                            ${isIncoming ? '+' : '-'} ${displayAmount.toLocaleString()} ج.م
                        </td>
                        <td>${date}</td>
                    </tr>
                `;
            });

            tbody.innerHTML = rows;
        }

        // ============================================================
        // LOAD DATA
        // ============================================================
        async function loadData() {
            console.log('🔄 بدء تحميل البيانات...');

            currentTreasuryId = getTreasuryIdFromUrl();
            console.log('📌 Treasury ID:', currentTreasuryId);

            if (!currentTreasuryId) {
                document.getElementById('treasuryName').textContent = '⚠️ لم يتم تحديد خزينة';
                document.getElementById('treasuryBalance').textContent = '0 ج.م';
                document.querySelector('.table-wrapper').innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-exclamation-triangle"></i>
                        <p>لم يتم تحديد خزينة. يرجى العودة لصفحة الخزائن.</p>
                        <br />
                        <a href="treasuries.html"><i class="fas fa-arrow-right"></i> العودة للخزائن</a>
                    </div>
                `;
                return;
            }

            var treasury = await getTreasuryDetails(currentTreasuryId);
            console.log('📊 بيانات الخزينة:', treasury);

            if (!treasury) {
                document.getElementById('treasuryName').textContent = '⚠️ الخزينة غير موجودة';
                document.querySelector('.table-wrapper').innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-exclamation-triangle"></i>
                        <p>الخزينة غير موجودة أو تم حذفها</p>
                        <br />
                        <a href="treasuries.html"><i class="fas fa-arrow-right"></i> العودة للخزائن</a>
                    </div>
                `;
                return;
            }

            var transactions = await getTransactions(currentTreasuryId);
            console.log('📊 عدد الحركات:', transactions ? transactions.length : 0);

            allTreasuries = await getCompanyTreasuries(treasury.company_id);
            console.log('📊 عدد الخزائن في الشركة:', allTreasuries.length);

            populateTreasurySelects(allTreasuries, currentTreasuryId, treasury.name);

            displayData(transactions, treasury);
        }

        // ============================================================
        // INIT
        // ============================================================
        console.log('🏛️ الخزينة - QuickData ProSoft');
        console.log('🔗 Supabase URL:', SUPABASE_URL);

        var session = getSession();
        if (session) {
            console.log('✅ الجلسة موجودة');
            loadData();
        }

        setInterval(loadData, 30000);
    </script>

</body>
</html>
